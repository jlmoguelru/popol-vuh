<style>
  /* --vw/--vh los pone el guion a partir de visualViewport: es el ÚNICO alto que
     descuenta la barra de direcciones del móvil. 100dvh es el respaldo moderno y

  :root{ --paper:#d8bd86; --ink:#2a1c10; --red:#9c2c1b; --golds:#e6cd8b;

  @supports (height:100dvh){ :root{ --vh:100dvh; } }

         display:flex; align-items:center; justify-content:center;}
  canvas{max-width:var(--vw); max-height:var(--vh); aspect-ratio:16/9; background:#0d0905;

<script>
'use strict';
/* ================================================================
   POPOL VUH · JUNAJPÚ Y EL FALSO SOL — MVP jugable
   Un solo archivo: portada → apertura del códice → selva (Bioma 1)
   → niebla de copal → Vucub Caquix → cinemática del brazo → final.
   Arte, escenografías y música del proyecto; todo lo demás se dibuja
   como trazo de códice sobre el mismo lienzo de 1280×720.
   ================================================================ */
const cv=document.getElementById('cv'), cx=cv.getContext('2d');
const CVW=1280, CVH=720, GROUND=560, LEVEL=7536;

/* ---------- resolución del lienzo (nítido en Retina) ---------- */
let SCALE=1;
/* Tope de supermuestreo. El coste de dibujar crece con el CUADRADO de la escala:
   sin tope, una pantalla Retina grande pedía un búfer de 2560×1440 y el cuadro
   se iba a 20 ms (por debajo de 50 fps). Por encima de 1,5 este arte no gana
   nitidez visible, así que no compensa. En táctil se baja más, porque además
   cada lámina pre-escalada ocupa memoria. */
const SCALE_MAX=(matchMedia('(pointer:coarse)').matches||'ontouchstart' in window)?1.25:1.5;
function fitCanvas(){
  const r=cv.getBoundingClientRect();
  if(!r.width||!r.height) return;
  const dpr=Math.min(devicePixelRatio||1,2);
  const s=Math.max(1, Math.min(SCALE_MAX, Math.min(r.width/CVW, r.height/CVH)*dpr));
  const w=Math.round(CVW*s), h=Math.round(CVH*s);
  if(cv.width!==w||cv.height!==h){ cv.width=w; cv.height=h; }
  SCALE=w/CVW;
}
/* ---------- ajustar al alto que SE VE ----------
   En el móvil, 100vh mide la ventana completa, como si la barra de direcciones no
   estuviera: el lienzo se centraba en un alto mayor que el visible y la franja de
   arriba —el retrato y las cuentas de jade— quedaba tapada por la barra.
   visualViewport sí mide lo que queda a la vista, y cambia cuando la barra
   aparece o se esconde. */
function fitViewport(){
  const vv=window.visualViewport;
  const w=Math.round(vv?vv.width:innerWidth), h=Math.round(vv?vv.height:innerHeight);
  if(!w||!h) return;
  const st=document.documentElement.style;
  st.setProperty('--vw', w+'px');
  st.setProperty('--vh', h+'px');
  /* algunos navegadores desplazan el área visible en vez de encogerla */
  const esc=document.getElementById('stage');
  if(esc && vv) esc.style.transform = vv.offsetTop? 'translateY('+Math.round(vv.offsetTop)+'px)' : '';
  fitCanvas();
}
addEventListener('resize',fitViewport);
addEventListener('orientationchange',()=>{ fitViewport(); setTimeout(fitViewport,300); });
if(window.visualViewport){
  visualViewport.addEventListener('resize',fitViewport);
  visualViewport.addEventListener('scroll',fitViewport);
}
if(window.ResizeObserver) new ResizeObserver(fitCanvas).observe(document.getElementById('stage'));
fitViewport();

/* ---------- pantalla completa ----------
   Es la solución de verdad al problema de la barra: quita la interfaz del
   navegador entera. Safari de iPhone no deja poner en pantalla completa nada que
   no sea un vídeo, así que allí el botón se esconde y queda el ajuste de arriba. */
const raiz=document.documentElement;
const PIDE_FULL = raiz.requestFullscreen || raiz.webkitRequestFullscreen;
const SALE_FULL = document.exitFullscreen || document.webkitExitFullscreen;
const hayFull = !!(PIDE_FULL && SALE_FULL);
const enFull = ()=>!!(document.fullscreenElement||document.webkitFullscreenElement);
function marcaFull(){ document.body.classList.toggle('full', enFull()); fitViewport(); }
function toggleFull(){
  try{
    if(enFull()){ SALE_FULL.call(document); return; }
    evento('pantalla_completa');
    const p=PIDE_FULL.call(raiz);
    /* al entrar, en Android se puede fijar el horizontal: el juego es 16:9 y
       girar el teléfono dentro de pantalla completa lo dejaba en una franja */
    if(p&&p.then) p.then(()=>{ try{ screen.orientation.lock('landscape').catch(()=>{}); }catch(_){} }).catch(()=>{});
  }catch(_){}
}
['fullscreenchange','webkitfullscreenchange'].forEach(ev=>document.addEventListener(ev,marcaFull));
if(!hayFull) document.body.classList.add('sinfull');

/* Dibuja un cuadro anclado por su CONTENIDO, no por su lienzo. */
function drawAnchored(img,h,ax,mid){
  const an=img.an, k=an? h/an.ref : h/img.naturalHeight;
  const W=img.naturalWidth*k, H=img.naturalHeight*k;
  cx.drawImage(img, -(ax!=null?ax:(an?an.ax:.5))*W, -(mid?.5:(an?an.by:1))*H, W, H);
}

/* ================= CARGA DE ARTE (con barra de progreso) ================= */
/* ---- RUTAS:INICIO ----
   TODO lo que el juego carga sale de este bloque. Las carpetas del proyecto llevan
   acentos, espacios y guiones largos, y macOS los guarda en forma NFD: eso funciona
   en local, pero es una fuente segura de problemas en un servidor Linux (GitHub
   Pages) y al comprimir. Por eso `_empaquetar.py` sustituye ESTE BLOQUE ENTERO por
   otro con nombres sin acentos ni espacios y las láminas grandes en JPEG.
   Si mueves o renombras arte, cámbialo aquí y en `_empaquetar.py`. */
const RUTAS={
  sprites:'assets/sprites/',
  escenas:'assets/escenas/', escExt:'.jpg',
  escenaFiles:['bioma1','bioma1_1','bioma1_2','bioma1_3','bioma1_4'],

  im.onload=done;
  /* macOS guarda los acentos en forma NFD: si la primera petición falla se
     reintenta con esa forma antes de darla por perdida. */
  im.onerror=()=>{ if(!im.retried){ im.retried=true; im.src=encodeURI((dir+f+ext).normalize('NFD')); }
                   else { done(); if(onFail) onFail(); } };
  im.src=encodeURI(dir+f+ext);
  return im;
}

const MUS={}, musState={cur:null, fades:{}};
function mkMus(key){
  const a=new Audio(); a.loop=true; a.volume=0; a.preload='auto';
  let retried=false;
  a.addEventListener('error',()=>{ if(!retried){ retried=true; a.src=encodeURI(MUS_SRC[key].normalize('NFD')); } });
  a.src=encodeURI(MUS_SRC[key]);
  MUS[key]=a; return a;
}
Object.keys(MUS_SRC).forEach(mkMus);
function musFade(key,target,ms){
  const a=MUS[key]; if(!a) return;
  clearInterval(musState.fades[key]);
  const step=40, n=Math.max(1,Math.round((ms||900)/step)), d=(target-a.volume)/n;
  musState.fades[key]=setInterval(()=>{
    const v=a.volume+d;
    if((d>=0&&v>=target)||(d<0&&v<=target)){ a.volume=Math.max(0,Math.min(1,target));
      clearInterval(musState.fades[key]); if(target<=0) a.pause(); return; }
    a.volume=Math.max(0,Math.min(1,v));
  },step);
}
/* Cambia de tema con fundido cruzado. key=null apaga toda la música. */
function musPlay(key,ms){
  if(musState.cur===key) { if(key&&SND.on) MUS[key].play().catch(()=>{}); return; }
  const prev=musState.cur; musState.cur=key;
  if(prev) musFade(prev,0,ms||1200);
  if(!key||!SND.on) return;
  const a=MUS[key];
  a.play().then(()=>musFade(key,SND.mus,ms||1400)).catch(()=>{});
}
function musRefresh(){                      // tras cambiar volumen o silenciar
  Object.keys(MUS).forEach(k=>{
    if(k===musState.cur && SND.on){ MUS[k].play().catch(()=>{}); musFade(k,SND.mus,250); }
    else musFade(k,0,250);
  });
}

/* ---------- efectos sintetizados ---------- */
let AC=null;
function ac(){
  if(!AC){ const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; AC=new C(); }
  if(AC.state==='suspended') AC.resume().catch(()=>{});
  return AC;
}
let noiseBuf=null;
function noise(a){
  if(!noiseBuf){ noiseBuf=a.createBuffer(1,a.sampleRate*1.2,a.sampleRate);
    const d=noiseBuf.getChannelData(0);
    for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; }
  const s=a.createBufferSource(); s.buffer=noiseBuf; s.loop=true; return s;
}
/* tono: forma de onda con caída exponencial y barrido opcional de altura */
function tone(o){
  const a=ac(); if(!a||!SND.on||SND.sfx<=0) return;
  const t0=a.currentTime+(o.delay||0);
  const osc=a.createOscillator(), g=a.createGain();
  osc.type=o.type||'sine';
  osc.frequency.setValueAtTime(o.f0,t0);
  if(o.f1) osc.frequency.exponentialRampToValueAtTime(Math.max(20,o.f1),t0+o.d);
  const vol=(o.v==null?.3:o.v)*SND.sfx;
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.exponentialRampToValueAtTime(vol,t0+(o.atk||0.008));
  g.gain.exponentialRampToValueAtTime(0.0001,t0+o.d);
  let node=osc;
  if(o.filt){ const f=a.createBiquadFilter(); f.type='lowpass'; f.frequency.value=o.filt; node.connect(f); node=f; }
  node.connect(g); g.connect(a.destination);
  osc.start(t0); osc.stop(t0+o.d+0.05);
}
/* soplo: ruido filtrado — pasos, viento, cerbatana, tierra */
function puff(o){
  const a=ac(); if(!a||!SND.on||SND.sfx<=0) return;
  const t0=a.currentTime+(o.delay||0);
  const s=noise(a), f=a.createBiquadFilter(), g=a.createGain();
  f.type=o.type||'bandpass'; f.Q.value=o.q==null?1.2:o.q;
  f.frequency.setValueAtTime(o.f0,t0);
  if(o.f1) f.frequency.exponentialRampToValueAtTime(Math.max(40,o.f1),t0+o.d);
  const vol=(o.v==null?.25:o.v)*SND.sfx;
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.exponentialRampToValueAtTime(vol,t0+(o.atk||0.006));
  g.gain.exponentialRampToValueAtTime(0.0001,t0+o.d);
  s.connect(f); f.connect(g); g.connect(a.destination);
  s.start(t0); s.stop(t0+o.d+0.05);
}

/* ---------- joystick ----------
   Captura su propio dedo, así se puede mover y pulsar TIRO o SALTO a la vez. */
const joy=document.getElementById('joy'), perilla=joy.querySelector('.perilla');
const marcas={n:joy.querySelector('.n'),s:joy.querySelector('.s'),o:joy.querySelector('.o'),e:joy.querySelector('.e')};
let joyDedo=null;
function joyMueve(e){
  const r=joy.getBoundingClientRect(), rad=r.width/2, max=rad*.6;
  let dx=e.clientX-(r.left+rad), dy=e.clientY-(r.top+rad);
  const d=Math.hypot(dx,dy);
  if(d>max){ dx=dx/d*max; dy=dy/d*max; }
  perilla.style.transform='translate('+dx.toFixed(1)+'px,'+dy.toFixed(1)+'px)';
  const nx=dx/max, ny=dy/max, MUERTA=.28;
  /* zona muerta y rampa: a medio camino anda, al ~85 % ya corre a tope */
  vk.ax = Math.abs(nx)<MUERTA ? 0 : Math.sign(nx)*Math.min(1,(Math.abs(nx)-MUERTA)/(1-MUERTA)*1.25);
  /* apuntar sólo si el gesto es claramente vertical (a menos de ~40° de la
     vertical): con un cono más ancho, andar en diagonal con el pulgar un poco
     levantado mandaba el dardo al cielo sin querer */
  vk.up = (ny<-.5 && -ny>Math.abs(nx)*1.2) ? 1 : 0;
  vk.dn = (ny> .5 &&  ny>Math.abs(nx)*1.2) ? 1 : 0;
  marcas.n.classList.toggle('vivo',!!vk.up); marcas.s.classList.toggle('vivo',!!vk.dn);
  marcas.o.classList.toggle('vivo',vk.ax<0); marcas.e.classList.toggle('vivo',vk.ax>0);
}
function joySuelta(){
  joyDedo=null; joy.classList.remove('on'); perilla.style.transform='';
  vk.ax=0; vk.up=0; vk.dn=0;
  Object.values(marcas).forEach(m=>m.classList.remove('vivo'));
}
joy.addEventListener('pointerdown',e=>{
  e.preventDefault(); joyDedo=e.pointerId; joy.classList.add('on');
  try{ joy.setPointerCapture(e.pointerId); }catch(_){}
  joyMueve(e);
});
joy.addEventListener('pointermove',e=>{ if(e.pointerId===joyDedo) joyMueve(e); });
['pointerup','pointercancel','lostpointercapture'].forEach(ev=>
  joy.addEventListener(ev,e=>{ if(e.pointerId===joyDedo) joySuelta(); }));

/* ================= VUCUB CAQUIX ================= */
/* ================= LA ARENA DEL NANCE =================
   La pelea ya no ocurre en la selva que se desplaza, sino en una estampa cerrada
   de cámara fija (la lámina «Fighting arena bioma 1»), a la que se entra por el
   sendero de la escena 1.4. Por eso estas coordenadas son de PANTALLA, no del
   mundo: dentro de la arena la cámara no se mueve. */
let enArena=false;
const BOSSX=640, CANOPY_Y=150, BOSS_H=170;
const HOVER_Y=GROUND-230, DIVE_V=520, DIVE_FLOOR=GROUND-50;
const ARENA_L=150, ARENA_R=1130;
/* ORDEN DEL PASAJE: se llega al nance por el sendero, se le gana en la arena y
   SÓLO entonces arranca la cinemática del brazo. No hay reloj que la dispare: el
   relato avanza cuando el jugador derriba al falso sol, nunca porque se acabe un
   tiempo. A cambio pega fuerte —el picado vale dos corazones— para que el asalto
   siga siendo corto y tenso. */
const DANO_PICADO=2, DANO_PLUMA=1;
function spawnBoss(){
  boss={x:BOSSX,y:CANOPY_Y,vx:0,vy:0,face:-1,hp:300,maxhp:300,
        state:'canopy',t:0,st:0,wt:1.6,active:false,hitCd:0,next:'dive',
        dead:false,deadT:0,tx:0,ty:0,gustN:0,fightT:0};
  feathers.length=0;
}
function bossGo(state,wt){ boss.state=state; boss.st=0; if(wt!==undefined) boss.wt=wt; }
function bossGrounded(){ return boss.state==='eat'||boss.state==='stun'||boss.dead; }
function bossBox(){
  return bossGrounded()? {cy:GROUND-72, hw:84, hh:76}
                       : {cy:boss.y,    hw:88, hh:80};
}

function updBoss(dt){
  if(!boss) return;
  boss.t+=dt; boss.st+=dt; boss.hitCd=Math.max(0,boss.hitCd-dt);
  if(boss.active && !boss.dead) boss.fightT+=dt;
  if(boss.dead){ boss.deadT+=dt;
    if(boss.y<GROUND) boss.y=Math.min(GROUND,boss.y+300*dt);
    return; }
  const d=t.x-boss.x;
  switch(boss.state){
    case 'canopy':                       // arriba, comiendo nances (invulnerable)
      boss.x=BOSSX+Math.sin(boss.t*.8)*14; boss.y=CANOPY_Y+Math.sin(boss.t*1.7)*8;
      boss.face=-1; boss.wt-=dt;
      if(boss.wt<=0) bossGo('descend');
      break;
    case 'descend':
      boss.y+=(GROUND-boss.y)*3.4*dt; boss.x+=(BOSSX-50-boss.x)*3*dt;
      if(GROUND-boss.y<10){ boss.y=GROUND; bossGo('eat',3.6);
        /* el aviso sólo dentro del claro: el ciclo del jefe corre desde el
           principio del nivel y si no, el cartel saltaba en plena selva */
        if(!boss.active) say('come en el suelo: ¡dispárale AHORA con la cerbatana!',3); }
      break;
    case 'eat':                          // en el suelo: LA ventana de emboscada
      boss.face=Math.sign(d)||-1; boss.wt-=dt;
      if(boss.wt<=0) bossGo('ascend');
      break;
    case 'ascend':
      boss.y+=(CANOPY_Y-boss.y)*2*dt; boss.x+=(BOSSX-boss.x)*2*dt;
      if(boss.y-CANOPY_Y<10) bossGo('canopy',2.0);
      break;
    case 'rise':
      boss.y+=(HOVER_Y-boss.y)*2.5*dt;
      if(Math.abs(boss.y-HOVER_Y)<12) bossGo('hover',1.5);
      break;
    case 'hover': {
      const hx=Math.max(ARENA_L,Math.min(ARENA_R, t.x+(d>0?-230:230)));
      boss.x+=(hx-boss.x)*1.6*dt;
      boss.y+=(HOVER_Y+Math.sin(boss.t*2)*14-boss.y)*2.2*dt;
      boss.face=Math.sign(t.x-boss.x)||boss.face; boss.wt-=dt;
      if(boss.wt<=0){
        if(boss.next==='dive'){ bossGo('aim',.55); boss.tx=t.x; boss.next='gust'; SFX.grito(); }
        else { bossGo('gust',.9); boss.gustN=0; boss.next='dive'; }
      }
      break; }
    case 'aim':
      boss.face=Math.sign(boss.tx-boss.x)||boss.face; boss.wt-=dt;
      if(boss.wt<=0){
        /* Se apunta al SUELO bajo el jugador, nunca al jugador en el aire: así el
           picado siempre baja y siempre acaba estrellándose, que es la ventana de daño. */
        const dx=Math.max(ARENA_L,Math.min(ARENA_R,boss.tx))-boss.x,
              dy=Math.max(120,(GROUND-24)-boss.y), m=Math.hypot(dx,dy)||1;
        boss.vx=dx/m*DIVE_V; boss.vy=dy/m*DIVE_V; bossGo('dive');
      }
      break;
    case 'dive':
      boss.x+=boss.vx*dt; boss.y+=boss.vy*dt; boss.face=Math.sign(boss.vx)||boss.face;
      if(t.inv<=0 && Math.abs(boss.x-t.x)<54 && Math.abs(boss.y-(t.y-46))<54){
        hurt(boss.x,DANO_PICADO); }
      if(boss.y>=DIVE_FLOOR){                    // estrellado: se gana la ventana
        boss.y=GROUND; bossGo('stun',1.5); burst(boss.x,GROUND,PAPER2,10);
        SFX.choque(); sacude(16,.45);
      } else if(boss.st>2.4 || boss.x<=ARENA_L || boss.x>=ARENA_R){
        bossGo('rise');                          // red de seguridad: nunca se pierde
      }
      break;
    case 'stun':
      boss.wt-=dt;
      if(boss.wt<=0) bossGo('rise');
      break;
    case 'gust':                                 // ráfaga de plumas
      boss.face=Math.sign(t.x-boss.x)||boss.face; boss.wt-=dt;
      if(boss.gustN<3 && boss.wt<.9-.22*(boss.gustN+1)){
        boss.gustN++;
        const dx=t.x-boss.x, dy=(t.y-50)-boss.y, m=Math.hypot(dx,dy)||1;
        feathers.push({x:boss.x,y:boss.y,vx:dx/m*430,vy:dy/m*430,life:2.2});
        SFX.clavo();
      }
      if(boss.wt<=0) bossGo('hover',1.5);
      break;
  }
  // cinturón y tirantes: pase lo que pase, el jefe vive dentro del claro
  boss.x=Math.max(ARENA_L,Math.min(ARENA_R,boss.x));
  boss.y=Math.max(90,Math.min(GROUND,boss.y));
  feathers.forEach(f=>{ f.x+=f.vx*dt; f.y+=f.vy*dt; f.life-=dt;
    if(t.inv<=0 && f.life>0 && Math.abs(f.x-t.x)<30 && Math.abs(f.y-(t.y-50))<40){
      f.life=0; hurt(f.x,DANO_PLUMA); } });
  for(let i=feathers.length-1;i>=0;i--) if(feathers[i].life<=0) feathers.splice(i,1);
}

function bossDartHit(dd){
  if(!boss||boss.dead||dd.life<=0) return;
  const B=bossBox();
  if(Math.abs(dd.x-boss.x)>B.hw || Math.abs(dd.y-B.cy)>B.hh) return;
  dd.life=0;
  const vuln = boss.state==='eat'||boss.state==='stun';
  if(!boss.active){
    if(vuln){ boss.active=true; boss.hp-=60; boss.hitCd=.25; bossGo('rise');
      evento('jefe_emboscado');
      t.hp=VIDA_MAX;                       // la pelea empieza con las cuentas llenas
      say('¡EMBOSCADA! El falso sol chilla de rabia',3);
      burst(boss.x,B.cy,RED,16); SFX.jefe(); sacude(14,.5); congela(.09);
    } else { burst(dd.x,dd.y,PAPER2,3); SFX.rebote(); }
    return;
  }
  /* Daño subido (era 26 y 9): con los valores viejos hacían falta demasiados ciclos
     y la pelea se hacía larguísima antes de llegar a la cinemática. */
  boss.hp-= vuln? 38 : 13;
  boss.hitCd=.15; burst(dd.x,dd.y,RED,5); SFX.jefeHit();
  if(vuln){ sacude(7,.2); congela(.05); }
  if(boss.hp<=0){ bossCae(); return; }
  /* a media vida chilla y aprieta: sin reloj, el aviso es lo que marca el tramo */
  if(!boss.furia && boss.hp<=boss.maxhp*0.5){ boss.furia=true;
    say('El falso sol chilla de rabia — le queda media luz',2.6); SFX.jefe(); }
}
function bossCae(){
  if(!boss||boss.dead) return;
  evento('jefe_derrotado', {segundos_de_pelea: Math.round(boss.fightT)});
  const B=bossBox();
  boss.hp=0; boss.dead=true; boss.deadT=0; feathers.length=0;
  burst(boss.x,B.cy,GOLDS,34); burst(boss.x,B.cy,RED,18);
  SFX.jefe(); SFX.triunfo(); sacude(20,.9); congela(.14);
  say('☀ EL FALSO SOL HA CAÍDO',4);
}

/* ============ EL CAMINO DEL NANCE (entrada a la arena) ============
   La selva termina en la boca del sendero: el único paso adelante es meterse por
   él, y lleva a la arena cerrada donde espera el falso sol. Los bichos comunes no
   pasan de aquí. Antes esto era una cortina de humo de copal, un apaño mientras no
   había arte del camino. */
/* Boca del sendero medida sobre la escena 1.4 (x≈540 de la lámina). La selva se
   acaba aquí: el único paso adelante es meterse por el camino. */
const GATE_X=6330, GATE_STOP=GATE_X+40;
let gate={open:false, near:false, flash:0, t:0};
function updGate(dt){
  gate.t+=dt;
  gate.flash=Math.max(0,gate.flash-dt);
  if(enArena) { gate.near=false; return; }
  gate.near = t.x>GATE_STOP-130 && t.x<=GATE_STOP+4 && t.onGround;
  if(t.x>GATE_STOP){ t.x=GATE_STOP; if(t.vx>0) t.vx=0; }   // la selva no sigue
  if(gate.near && ENTER()) entrarArena();
}
/* En el teléfono no hay tecla E, así que también se entra tocando la pantalla. */
function entrarArena(){
  if(enArena || !gate.near) return false;
  evento('arena_entrada');
  enArena=true; gate.flash=2.2;
  volverA=t.x;                                  // por dónde se volvió a la selva
  t.x=ARENA_L+120; t.y=GROUND; t.vx=0; t.vy=0; t.onGround=true; t.face=1;
  t.inv=1.2; t.hp=VIDA_MAX; t.web=0; telas.length=0; darts.length=0;
  checkpoint=GATE_X-120;                        // si todo acaba, se vuelve a la selva
  spawnBoss(); boss.wt=1.2;
  say('EL CLARO DEL NANCE · derríbalo: su picado vale dos corazones',3.8);
  SFX.umbral();
  return true;
}
function salirArena(){
  enArena=false;
  t.x=volverA||GATE_STOP-40; t.y=GROUND; t.vx=0; t.vy=0; t.onGround=true; t.inv=1.2;
}
let volverA=0;
function drawCamino(cam){
  if(enArena) return;
  const px=GATE_X-cam;
  if(px<-220||px>CVW+220) return;
  /* claro de luz en la boca del sendero: invita a entrar sin poner un cartel */
  cx.save();
  const g=cx.createRadialGradient(px,GROUND-110,10,px,GROUND-110,200);
  const a=(gate.near?.28:.14)+.05*Math.sin(simT*2.2);
  g.addColorStop(0,'rgba(245,215,140,'+a+')'); g.addColorStop(1,'rgba(245,215,140,0)');
  cx.fillStyle=g; cx.fillRect(px-200,GROUND-310,400,320);
  if(gate.flash>0){ cx.globalAlpha=Math.min(.45,gate.flash*.3);
    cx.fillStyle=GOLDS; cx.fillRect(px-200,0,400,GROUND+40); }
  cx.restore();
  if(gate.near){
    const by=GROUND-200;
    cx.save(); cx.textAlign='center';
    cx.globalAlpha=.55+.45*Math.sin(gate.t*4.5); cx.font='700 17px Georgia';
    inkText(TOUCH?'TOCA LA PANTALLA PARA SEGUIR EL CAMINO':'E  ·  SEGUIR EL CAMINO', px, by, RED);
    cx.globalAlpha=1; cx.font='13px Georgia';
    inkText('el falso sol come al final del sendero', px, by+22, INK, null, 3);
    cx.restore();
  }
}
/* La arena: lámina fija a pantalla completa. */
function drawArena(){
  if(ok(ARENA_FONDO)){
    const a=ARENA_FONDO.naturalWidth/ARENA_FONDO.naturalHeight, ca=CVW/CVH;
    let w,h; if(a>ca){ h=CVH; w=h*a; } else { w=CVW; h=w/a; }
    cx.drawImage(ARENA_FONDO,(CVW-w)/2,(CVH-h)/2,w,h);
  } else { cx.fillStyle=PAPER; cx.fillRect(0,0,CVW,CVH);
    cx.fillStyle=PAPER2; cx.fillRect(0,GROUND,CVW,CVH-GROUND); }
}

/* ¿Junajpú está a la altura del bicho? Los ataques cuerpo a cuerpo son horizontales.
   Antes el esqueleto y la araña sólo miraban `t.onGround`, así que alcanzaban a quien
   estuviera de pie en una losa muy por encima de ellos; y el alacrán no miraba la
   altura en absoluto: pegaba en toda la franja vertical, incluso en pleno salto.
   El umbral es menor que un salto (que sube ~196 px), así que saltar SÍ esquiva. */
const aLaAltura=e=>Math.abs(t.y-e.y)<52;

/* ================= ACTUALIZACIÓN DE ENEMIGOS ================= */
function updFoes(dt){
  const nuevos=[];
  foes.forEach(e=>{
    e.t+=dt; e.hitCd=Math.max(0,e.hitCd-dt);
    if(e.hp<=0){ e.deadT+=dt; return; }
    const d=t.x-e.x, ad=Math.abs(d);
    if(e.kind==='esq'){
      e.atkT=Math.max(0,e.atkT-dt);
      if(e.state==='windup'){ e.wt-=dt;
        if(e.wt<=0){ e.state='stab'; e.wt=.32;
          if(ad<95 && aLaAltura(e)) hurt(e.x); } }
      else if(e.state==='stab'){ e.wt-=dt; e.x+=e.face*230*dt;
        if(e.wt<=0){ e.state='chase'; e.atkT=.9; } }
      else if(ad<380){ e.state='chase'; e.face=Math.sign(d)||1;
        if(ad>66) e.x+=e.face*205*dt;
        else if(e.atkT<=0){ e.state='windup'; e.wt=.5; } }
      else { e.state='patrol';
        e.x+=(Math.sin(e.t*.7)>0?60:-60)*dt; e.face=Math.sin(e.t*.7)>0?1:-1;
        e.x=Math.max(e.baseX-130,Math.min(e.baseX+130,e.x)); }
      e.x+=e.vx*dt; e.vx*=.85;
    } else if(e.kind==='ara'){
      /* ARAÑA — duerme colgada del techo, se descuelga por el hilo cuando pasas
         debajo, persigue a ras de suelo y muerde. A media distancia ESCUPE una
         telaraña que te deja pegado unos segundos: así también es peligrosa de
         lejos y obliga a moverse, no sólo a esperarla. */
      e.cool=Math.max(0,e.cool-dt); e.escupeCd=Math.max(0,e.escupeCd-dt);
      if(e.state==='spit'){ e.wt-=dt; e.face=Math.sign(d)||e.face;
        if(e.wt<=0){ lanzaTela(e); e.escupeCd=3.4+Math.random(); e.cool=.7;
          e.state = e.y<GROUND-2? 'hang' : 'chase'; } }
      else if(e.state==='hang'){ e.y=araHangY(e.anchorY); e.face=Math.sign(d)||1;
        if(ad<230 && e.cool<=0){ e.state='drop'; e.wt=0; }
        else if(ad<520 && e.escupeCd<=0 && t.web<=0){ e.state='spit'; e.wt=.5; } }
      else if(e.state==='drop'){ e.y+=430*dt; e.face=Math.sign(d)||1;
        if(e.y>=GROUND){ e.y=GROUND; e.state='chase'; e.wt=0; } }
      else if(e.state==='windup'){ e.wt-=dt; e.face=Math.sign(d)||e.face;
        if(e.wt<=0){ e.state='bite'; e.wt=.3;
          if(ad<105 && aLaAltura(e)) hurt(e.x); } }
      else if(e.state==='bite'){ e.wt-=dt; e.x+=e.face*260*dt;
        if(e.wt<=0){ e.state='chase'; e.cool=.75; } }
      else { e.state='chase'; e.face=Math.sign(d)||1;
        if(ad>150 && ad<440 && e.escupeCd<=0 && e.cool<=0 && t.web<=0){ e.state='spit'; e.wt=.5; }
        else if(ad>72) e.x+=e.face*175*dt;
        else if(e.cool<=0){ e.state='windup'; e.wt=.38; }
        if(ad>820) e.x+=(e.baseX-e.x)*.7*dt; }
      e.x+=e.vx*dt; e.vx*=.85;
    } else if(e.kind==='ala'){
      /* ALACRÁN — el escudo de pedernal le cubre el FRENTE y tarda en girar:
         esa demora es la ventana para dispararle por la espalda. */
      e.cool=Math.max(0,e.cool-dt); e.turn=Math.max(0,e.turn-dt);
      e.blockT=Math.max(0,e.blockT-dt);
      const want=Math.sign(d)||e.face;
      if(e.state==='turning'){ e.wt-=dt;
        if(e.wt<=0){ e.face=e.turnTo; e.state='guard'; e.turn=1.0; e.cool=Math.max(e.cool,.25); } }
      else if(want!==e.face && e.turn<=0 && e.state!=='sting'){
        e.state='turning'; e.wt=GIRO_T; e.turnTo=want;
        e.x+=(want>0?-1:1)*6; }
      else if(e.state==='sting'){ e.wt-=dt;
        if(e.wt<=.15 && !e.hitDone){ e.hitDone=true;
          /* el aguijón hace DOBLE daño: es el enemigo pesado del bioma y así
             obliga de verdad a rodearlo en vez de comerse el golpe */
          if(ad<170 && Math.sign(d)===e.face && aLaAltura(e)) hurt(e.x,2); }
        if(e.wt<=0){ e.state='guard'; e.cool=1.1; e.hitDone=false; } }
      else if(ad<430){
        if(ad<200 && e.cool<=0 && Math.sign(d)===e.face){ e.state='sting'; e.wt=.72; e.hitDone=false; }
        else { e.state='guard';
          if(ad>150 && Math.sign(d)===e.face) e.x+=e.face*95*dt; } }
      else { e.state='patrol';
        e.x+=(Math.sin(e.t*.55)>0?52:-52)*dt;
        e.x=Math.max(e.baseX-160,Math.min(e.baseX+160,e.x)); }
      e.x+=e.vx*dt; e.vx*=.85;
    } else if(e.kind==='tec'){
      /* TECOLOTE MENSAJERO — no pelea: te delata. Grita, llama a un guardián
         y levanta el vuelo; vuelve a posarse para volver a gritar. */
      e.cool=Math.max(0,e.cool-dt);
      if(e.state==='perch'){ e.y=e.perchY; e.face=Math.sign(d)||1;
        if(ad<440 && e.cool<=0){ e.state='cry'; e.wt=.95; SFX.grito(); } }
      else if(e.state==='cry'){ e.wt-=dt; e.face=Math.sign(d)||e.face;
        if(e.wt<=0){
          if(e.calls<2 && foes.filter(f=>f.summoned&&f.hp>0).length<3){
            e.calls++; const sx=e.x+(Math.sign(d)||1)*260;
            const nf=mkEsq(Math.max(120,Math.min(GATE_X-80,sx)));
            nf.state='chase'; nf.summoned=true; nuevos.push(nf);
            say('¡el tecolote llamó a un guardián!',1.6);
          }
          e.state='fly'; e.wt=0; e.vy=-90;
        } }
      else { e.wt+=dt; e.face=Math.sign(d)||e.face;
        const tx=e.baseX+Math.cos(e.wt*1.3)*220, ty=e.perchY-150+Math.sin(e.wt*2.1)*40;
        e.x+=(tx-e.x)*1.8*dt; e.y+=(ty-e.y)*2.0*dt;
        if(e.wt>4.2 && Math.abs(e.x-e.baseX)<70){ e.state='perch'; e.cool=3.2; } }
    }
  });
  /* los guardianes recién llamados se añaden DESPUÉS del recorrido */
  if(nuevos.length) foes=foes.concat(nuevos);

  /* los bichos comunes NO cruzan la niebla: el claro es sólo del jefe */
  foes.forEach(e=>{ if(e.hp>0 && e.x>GATE_X-46){
    e.x=GATE_X-46; if(e.state==='chase'||e.state==='guard') e.face=-1; } });

  foes=foes.filter(e=>e.hp>0 || e.deadT<1.4);
}

/* Proyectiles: telarañas en vuelo y dardos. Va aparte de updFoes porque dentro del
   claro del nance NO se actualizan los bichos —y sin esto los dardos atravesaban al
   falso sol sin tocarlo, que era justo la pelea que hay que poder ganar. */
function updProyectiles(dt){
  telas.forEach(w=>{
    w.x+=w.vx*dt; w.y+=w.vy*dt; w.vy+=280*dt; w.life-=dt; w.rot+=7*dt;
    if(w.life>0 && !t.muerto && t.web<=0 && t.inv<=0 &&
       Math.abs(w.x-t.x)<30 && Math.abs(w.y-(t.y-50))<48){ w.life=0; enredar(); }
    if(w.life>0 && w.y>=GROUND-2){ w.life=0; burst(w.x,GROUND-2,BONE,3); }
  });
  for(let i=telas.length-1;i>=0;i--) if(telas[i].life<=0) telas.splice(i,1);

  darts.forEach(dd=>{
    if(dd.life<=0) return;
    telas.forEach(w=>{                       // un dardo revienta la telaraña en el aire
      if(w.life>0 && Math.abs(dd.x-w.x)<22 && Math.abs(dd.y-w.y)<20){
        w.life=0; dd.life=0; burst(w.x,w.y,BONE,6); SFX.clavo(); }
    });
    if(dd.life<=0) return;
    bossDartHit(dd);
    if(dd.life<=0 || enArena) return;        // en el claro sólo está él
    foes.forEach(e=>{
      if(e.hp<=0||dd.life<=0) return;
      const B=HITBOX(e);
      if(Math.abs(dd.x-e.x)<B.hw && Math.abs(dd.y-B.cy)<B.hh){
        if(e.kind==='ala' && Math.sign(dd.vx)===-e.face){     // pedernal de frente: rebota
          dd.life=0; e.blockT=.3; burst(dd.x,dd.y,GOLD,5); SFX.rebote();
          say('el pedernal rebota — dispárale por la espalda',1.4);
          return;
        }
        e.hp-=26; e.hitCd=.18; e.vx=Math.sign(dd.vx)*140; dd.life=0;
        burst(dd.x,dd.y,RED,4); SFX.clavo();
        if(e.hp<=0){ burst(e.x,B.cy,GOLDS,12); e.state='dead'; SFX.muere(); congela(.04); }
      }
    });
  });
}

/* caja de golpe por especie */
function HITBOX(e){
  if(e.kind==='esq') return {cy:e.y-60,hw:42,hh:58};
  if(e.kind==='ara') return {cy:e.y-EH.ara*.33,hw:52,hh:EH.ara*.34};
  if(e.kind==='ala') return {cy:e.y-EH.ala*.38,hw:62,hh:EH.ala*.38};
  if(e.kind==='tec') return {cy:e.y-EH.tec*.46,hw:40,hh:EH.tec*.46};
  return {cy:e.y-60,hw:42,hh:58};
}

/* ================================================================
   LA CASA DE LOS ESCRIBAS · sala de enigmas (PROTOTIPO)
   Una casa con puerta en la selva. Dentro, Jun Batz' y Jun Chowen —los medios
   hermanos a los que los gemelos convirtieron en monos, patronos de pintores,
   escribas y músicos en el Popol Vuh— hablan a través de un mascarón de piedra,
   explican la dinámica y plantean UN enigma con glifos. Acertar da un potenciador.
   Todo el texto está en SALA_TEXTO: es contenido de ejemplo para que el
   divulgador de glifos lo valide o lo sustituya sin tocar la lógica.
   ================================================================ */
/* x = centro de la PUERTA en el mundo. Medidas de la puerta sobre p_templo.png
   (499×341): de x 135 a 195 y de y 175 a 282; la base de los escalones al 94,4 %. */
const CASA={ x:1790, H:310, puerta:{x0:135/499, x1:195/499, y0:175/341, y1:282/341}, piso:.944 };
const poderes={ jade:false };
const sala={ fase:'dialogo', pagina:0, t:0, paginas:[], resuelto:false, intentos:0 };
const SALA_TEXTO={
  quien:"JUN BATZ'  y  JUN CHOWEN  ·  los monos escribas",
  /* Esta primera casa es el tutorial: explica en pocas frases CÓMO funcionarán
     todas las casas de enigmas, y luego pone el ejemplo del 13. */
  bienvenida:[
    "¿Junajpú? Hacía mucho que no te veíamos, hermano. Somos Jun Batz' y Jun Chowen, los escribas.",
    "Tú y Xbalanqué nos convirtieron en monos… pero nadie nos quitó el oficio: los pintores, los escribas y los músicos nos siguen invocando.",
    "Escucha cómo funciona esto. En el camino hay más casas como esta, y algunas están escondidas: fíjate en las piedras con luz en la puerta.",
    "En cada una verás un glifo en la estela y te haremos UNA pregunta sobre él. Cuatro respuestas; sólo una es la buena.",
    "Si aciertas, te llevas un don que te acompaña hasta el final del viaje. Si fallas, te damos una pista y vuelves a intentarlo: aquí no se pierde nada por equivocarse.",
    "Empecemos por lo primero que aprende un escriba: los números.",
  ],
  pregunta:"Los escribas contaban con puntos y barras: cada punto vale 1 y cada barra vale 5. ¿Qué número está grabado en la estela?",
  numero:13,
  opciones:['3','8','13','15'],
  pista:"Cuenta otra vez: cada barra vale cinco, así que las dos barras ya suman diez. Ahora suma los puntos de encima.",
  acierto:[
    "¡Trece! Dos barras y tres puntos. Con este sistema los mayas contaban de veinte en veinte, y tenían un signo para el cero.",
    "El trece es sagrado: en el calendario ritual de 260 días, los números del 1 al 13 se combinan con 20 días. Hasta tu nombre es una fecha de ese calendario: Jun Ajpu, el día Uno Ajpu.",
    "Toma esta CUENTA DE JADE. Para los mayas el jade era lo más precioso, ligado al aliento y a la vida. Desde ahora resistes un golpe más.",
  ],
  yaResuelto:["Ya leíste nuestra estela, hermano. Que el jade te cuide en el camino."],
};
const LETRAS_POR_SEG=55;

function casaCerca(){ return SCREEN==='juego' && !t.muerto && t.onGround && Math.abs(t.x-CASA.x)<48; }
function entrarSala(){
  if(!casaCerca()) return false;
  evento('sala_entrada',{ya_resuelta:sala.resuelto});
  SCREEN='sala'; sala.pagina=0; sala.t=0;
  t.vx=0; t.charging=false; t.charge=0; slowmo=1; t.web=0;
  for(const k in keys) keys[k]=false;
  for(const k in vk) vk[k]=0;
  if(typeof joySuelta==='function') joySuelta();
  if(sala.resuelto){ sala.fase='fin'; sala.paginas=SALA_TEXTO.yaResuelto;
    menuSet('','',[{label:'Volver a la selva', go:salirSala}]); }
  else { sala.fase='dialogo'; sala.paginas=SALA_TEXTO.bienvenida; menuSet('','',[]); }
  musPlay('intro'); SFX.umbral();
  return true;
}
function salirSala(){
  SCREEN='juego'; musPlay('juego');
  t.x=CASA.x; t.y=GROUND; t.vx=0; t.vy=0; t.onGround=true; t.inv=Math.max(t.inv,.8);
  if(sala.fase==='acierto') say('CUENTA DE JADE  ·  resistes un golpe más',3.2);
}
const salaTexto=()=>sala.paginas[sala.pagina]||'';
const salaCompleto=()=>sala.t*LETRAS_POR_SEG >= salaTexto().length;
function salaMenuVisible(){
  if(!salaCompleto()) return false;
  if(sala.fase==='enigma'||sala.fase==='pista') return true;
  if(sala.fase==='acierto'||sala.fase==='fin') return sala.pagina===sala.paginas.length-1;
  return false;
}
function salaAvanza(){
  if(!salaCompleto()){ sala.t=99; return; }                 // primer toque: termina de escribir
  if(sala.pagina<sala.paginas.length-1){ sala.pagina++; sala.t=0; SFX.pagina(); return; }
  if(sala.fase==='dialogo') irEnigma();
}
function irEnigma(){
  sala.fase='enigma'; sala.paginas=[SALA_TEXTO.pregunta]; sala.pagina=0; sala.t=0;
  menuSet('','',SALA_TEXTO.opciones.map((op,i)=>({label:op, go:()=>responder(i)})));
  /* sin opción marcada: quien machaca ENTER para pasar el diálogo no debe
     contestar sin querer la primera respuesta */
  menu.sel=-1;
}
function responder(i){
  sala.intentos++;
  const bien = SALA_TEXTO.opciones[i]===String(SALA_TEXTO.numero);
  evento('enigma_respuesta',{correcta:bien, intento:sala.intentos});
  sala.pagina=0; sala.t=0;
  if(bien){
    sala.resuelto=true; ganarPoder('jade');
    sala.fase='acierto'; sala.paginas=SALA_TEXTO.acierto;
    menuSet('','',[{label:'Volver a la selva', go:salirSala}]);
    SFX.triunfo();
  } else {
    sala.fase='pista'; sala.paginas=[SALA_TEXTO.pista];
    menuSet('','',[{label:'Intentarlo otra vez', go:irEnigma}]);
    SFX.rebote();
  }
}
function ganarPoder(id){
  if(id==='jade' && !poderes.jade){
    poderes.jade=true; VIDA_MAX=VIDA_BASE+1; t.hp=VIDA_MAX;
    evento('potenciador',{id});
  }
}

/* ================= DAÑO, MUERTE Y REAPARICIÓN ================= */
function hurt(fromX,dano){
  if(t.inv>0 || t.muerto) return;
  const d=dano||1;
  t.inv=.95; t.hurtT=.35; t.hp-=d;
  if(t.charging){ t.charging=false; slowmo=1; t.charge=0; }
  t.web=0;                                   // el golpe rompe la telaraña
  t.vx=Math.sign(t.x-fromX||-t.face)*(d>1?300:220); t.vy=-180; t.onGround=false;
  burst(t.x,t.y-60,RED,d>1?18:10); SFX.golpe();
  sacude(d>1?15:9, d>1?.42:.28); congela(d>1?.10:.06);
  if(t.hp<=0){ t.hp=0; t.muerto=true; t.muerteT=0; SFX.derrota(); }
}
function revive(){
  t.x=checkpoint; t.y=GROUND; t.vx=0; t.vy=0; t.onGround=true; t.face=1;
  t.hp=VIDA_MAX; t.inv=1.6; t.hurtT=0; t.charging=false; t.charge=0; t.dartCd=0;
  t.muerto=false; t.muerteT=0; t.jumpsLeft=P.jmax; slowmo=1; paused=false; t.web=0;
  spawnFoes();
  if(enArena){ t.x=ARENA_L+120; spawnBoss(); boss.wt=1.2;
    say('el falso sol vuelve al nance… espera a que baje',3); }
  SCREEN='juego';
}

/* Punta de la cerbatana en el cuadro 6 («sale el dardo») de cada hoja, en píxeles
   lógicos desde los pies y mirando a la derecha. Medidas sobre el arte: el dardo
   tiene que nacer ahí o se ve salir de la nada. Hacia abajo la cerbatana apunta
   ~58° por debajo de la horizontal, delante del cuerpo. */
const PUNTA={ arriba:{dx:4, dy:-119}, abajo:{dx:22, dy:-32, ang:58*Math.PI/180} };
function shootDart(){
  const v=880+320*t.charge, dir=t.aim;
  t.shotAim=dir;                          // lo usa el dibujo para rematar el soplido
  if(dir==='arriba'){
    darts.push({x:t.x+t.face*PUNTA.arriba.dx, y:t.y+PUNTA.arriba.dy, vx:0, vy:-v, life:.9});
  } else if(dir==='abajo'){
    const a=PUNTA.abajo.ang;
    darts.push({x:t.x+t.face*PUNTA.abajo.dx, y:t.y+PUNTA.abajo.dy,
                vx:t.face*Math.cos(a)*v, vy:Math.sin(a)*v, life:.9});
  } else {
    /* de pie la boquilla queda a ~76 % de la altura del sprite; agachado baja a ras
       de suelo, para alcanzar de lejos a las arañas */
    const bajo=t.duck;
    darts.push({x:t.x+t.face*(bajo?80:52), y:t.y-(bajo?P.duckDy:76), vx:t.face*v, vy:0, life:.9, bajo});
  }
  SFX.soplo();
}

/* ================= CONTROL ================= */
function control(dt){
  const accel=t.onGround?P.accG:P.accA;
  /* Enredado en una telaraña: no anda ni salta, pero SÍ puede disparar — dejar al
     jugador totalmente inútil se siente injusto. Y moverse acorta el forcejeo:
     de 1,5 s quieto a ~0,6 s si reaccionas. */
  if(t.web>0){
    /* forcejeo: machacar cualquier mando acorta el encierro y acelera el vaivén del
       capullo, que es lo que le dice al jugador que sirve de algo apretar. */
    t.webLucha = !!(L()||R()||JUMP()||vk.ax||SHOOT());
    t.web-=dt*(1+(t.webLucha?1.8:0));
    t.webF+=dt*(t.webLucha?7.5:2.8);
    if(t.web<=0){ t.web=0; t.webLucha=false;
      burst(t.x,t.y-50,BONE,10); burst(t.x,t.y-90,BONE,6); SFX.rebote(); }
  }
  const enredado=t.web>0;
  if(enredado){ t.charging=false; t.charge=0; slowmo=1; }   // con los brazos liados no sopla
  t.duck = DUCK() && t.onGround && !enredado;
  /* hacia dónde apunta la cerbatana; agachado siempre dispara al frente, a ras de suelo */
  t.aim = t.duck? 'frente' : AIM_UP()? 'arriba' : AIM_DN()? 'abajo' : 'frente';
  /* eje de marcha: el teclado da -1/0/1; el joystick da un valor intermedio que
     limita la velocidad, así inclinado a medias Junajpú camina en vez de correr */
  let eje=0;
  if(!t.charging && !enredado){ if(L())eje=-1; if(R())eje=1; if(vk.ax) eje=vk.ax; }
  let intent=Math.sign(eje);
  const vmax=P.spd*Math.min(1,Math.abs(eje)||1);
  if(t.duck){ if(intent!==0 && !t.charging) t.face=intent;   // agachado se gira, no avanza
    intent=0; t.vx=0; }
  if(intent!==0){ t.face=intent; t.vx+=intent*accel*dt;
    t.vx=Math.max(-vmax,Math.min(vmax,t.vx));
  } else t.vx*= t.onGround? ((t.charging||enredado)?.55:P.fric) : .96;

  // — salto (coyote time + buffer) —
  t.coyote=t.onGround? .1 : Math.max(0,t.coyote-dt);
  t.jbuf=Math.max(0,t.jbuf-dt);
  const wantJump=JUMP();
  if(wantJump && !t.jumpHeld){ t.jbuf=.12; t.jumpHeld=true; }
  if(!wantJump) t.jumpHeld=false;
  if(t.jbuf>0 && !t.charging && !t.duck && !enredado){
    if(t.coyote>0 || t.jumpsLeft>0){
      const first=t.coyote>0||t.jumpsLeft===P.jmax;
      t.vy = first? -P.jmp : -P.jmp*0.875;
      if(t.coyote<=0) t.jumpsLeft--; else t.jumpsLeft=P.jmax-1;
      t.onGround=false; t.coyote=0; t.jbuf=0; t.stretch=.05;
      SFX.salto();
    }
  }

  // — cerbatana: mantener para cargar, soltar para soplar —
  t.dartCd-=dt;
  if(SHOOT() && t.dartCd<=0 && !enredado){
    t.charging=true; t.charge=Math.min(1,t.charge+dt/0.8); slowmo=.45;
  } else if(t.charging){
    t.charging=false; slowmo=1; t.dartCd=.5; shootDart(); t.charge=0;
  }
}

function phys(dt){
  let g=P.grav;
  if(t.vy<0 && !JUMP()) g*=2.4;                   // salto variable: soltar lo corta
  t.vy+=g*dt;
  const y0=t.y;
  t.x+=t.vx*dt; t.y+=t.vy*dt;
  t.x = enArena? Math.max(ARENA_L,Math.min(ARENA_R,t.x))
               : Math.max(30,Math.min(LEVEL-30,t.x));
  const wasAir=!t.onGround, fallV=t.vy;
  if(t.y>=GROUND){ t.y=GROUND; t.vy=0; land(wasAir,fallV); }
  else{
    let landed=false;
    /* Colisión barrida: se comprueba si los pies CRUZARON la losa entre fotogramas,
       para que a velocidad alta no se atraviese. */
    if(t.vy>=0) platforms.forEach(p=>{
      if(t.x>p.x-10&&t.x<p.x+p.w+10 && y0<=p.y+1 && t.y>=p.y){ t.y=p.y; t.vy=0; landed=true; }});
    if(landed) land(wasAir,fallV); else t.onGround=false;
  }
  t.inv=Math.max(0,t.inv-dt); t.hurtT=Math.max(0,t.hurtT-dt);
  t.squash=Math.max(0,t.squash-dt*4); t.stretch=Math.max(0,t.stretch-dt*4);
  t.animT+=dt;
  if(Math.abs(t.vx)>40&&t.onGround){
    const prev=t.run;
    t.run+=dt*Math.abs(t.vx)/40;
    if(Math.floor(prev*P.freq/Math.PI)!==Math.floor(t.run*P.freq/Math.PI)){
      burst(t.x-t.face*10,t.y-2,PAPER2,2); SFX.paso();
    }
  }
  darts.forEach(d=>{
    d.x+=d.vx*dt; d.y+=(d.vy||0)*dt; d.life-=dt;
    /* el dardo hacia abajo se clava en el suelo; las losas las atraviesa, si no
       disparar hacia abajo desde una plataforma no serviría para nada */
    if(d.vy>0 && d.life>0 && d.y>=GROUND-2){ d.life=0; burst(d.x,GROUND-2,PAPER2,4); }
  });
  for(let i=darts.length-1;i>=0;i--) if(darts[i].life<=0) darts.splice(i,1);
  parts.forEach(p=>{p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=800*dt; p.life-=dt; p.rot+=p.spin*dt;});
  for(let i=parts.length-1;i>=0;i--) if(parts[i].life<=0) parts.splice(i,1);
}
function land(wasAir,fallV){
  if(wasAir){
    t.jumpsLeft=P.jmax;
    t.squash=Math.min(.10,fallV/9000);
    if(fallV>300){ burst(t.x,t.y-2,PAPER2,6); SFX.caer(); }
  }
  t.onGround=true;
}
function burst(x,y,col,n){ for(let i=0;i<n;i++) parts.push({x,y,
  vx:(Math.random()-.5)*220, vy:-Math.random()*200, col, life:.4+Math.random()*.3,
  rot:Math.random()*6.28, spin:(Math.random()-.5)*6, r:2.5+Math.random()*2.5}); }

/* braseros de copal: curan y fijan dónde revives */
function updHogueras(){

/* ================= TRAZOS DE CÓDICE (utilidades de dibujo) ================= */
function line(a,b,c,d){ cx.beginPath(); cx.moveTo(a,b); cx.lineTo(c,d); cx.stroke(); }
const hsh=(k,n)=>{ const v=Math.sin(k*127.1+n*311.7)*43758.5453; return v-Math.floor(v); };
const hash=i=>{ const s=Math.sin(i*127.1)*43758.545; return s-Math.floor(s); };
function voluta(x,y,r,rot,col,w,a){
  cx.save(); cx.translate(x,y); cx.rotate(rot); cx.globalAlpha=a;
  cx.strokeStyle=col; cx.lineWidth=w; cx.lineCap='round';
  cx.beginPath(); cx.arc(0,0,r,0.5,4.2); cx.stroke();
  cx.beginPath(); cx.arc(0,0,r*.5,0.9,4.6); cx.stroke();
  cx.restore();
}
function pluma(x,y,L,rot,col,a){
  cx.save(); cx.translate(x,y); cx.rotate(rot); cx.globalAlpha=a;
  cx.fillStyle=col; cx.strokeStyle=INK; cx.lineWidth=1.2;
  cx.beginPath(); cx.moveTo(0,-L/2);
  cx.quadraticCurveTo(L*.30,0, 0,L/2);
  cx.quadraticCurveTo(-L*.30,0, 0,-L/2);
  cx.fill(); cx.stroke();
  cx.beginPath(); cx.moveTo(0,-L/2); cx.lineTo(0,L/2); cx.globalAlpha=a*.6; cx.stroke();
  cx.restore();
}
/* Texto sobre la escenografía. Los biomas son oscuros y abigarrados: la tinta sola
   daba 1.66:1 de contraste y los avisos eran invisibles. Con halo de papel se lee
   siempre y sigue pareciendo un glifo de códice. */
function inkText(txt,x,y,fill,halo,w){
  cx.save();
  cx.lineJoin='round'; cx.miterLimit=2;
  cx.strokeStyle=halo||'rgba(244,235,208,.94)'; cx.lineWidth=w||4;
  cx.strokeText(txt,x,y);
  cx.fillStyle=fill; cx.fillText(txt,x,y);
  cx.restore();
}
function wrap(txt,maxw){
  const out=[]; let ln='';
  txt.split(' ').forEach(w=>{ const p2=ln?ln+' '+w:w;
    if(cx.measureText(p2).width>maxw && ln){ out.push(ln); ln=w; } else ln=p2; });
  if(ln) out.push(ln); return out;
}

const CINE_DUR=7.6;
const BOX_ANCHO={x:50,y:14,w:1180,h:506};      // láminas 16:9 (brazo)
const BOX_ALTO ={x:50,y:10,w:1180,h:512};      // láminas de códice (4:3)

function cineStart(motivo){
  if(motivo==='apertura') evento('apertura_iniciada');
  else if(motivo==='brazo') evento('cinematica_brazo');
  else if(motivo==='final') evento('cierre_visto');
  const seq = motivo==='apertura'? APERTURA : motivo==='final'? CIERRE : BRAZO;
  const box = motivo==='apertura'||motivo==='final'? BOX_ALTO : BOX_ANCHO;
  cine={on:true,seq,box,i:0,t:0,prev:-1,fade:0,motivo:motivo||'repaso'};
  SCREEN='cine'; SFX.pagina();
}
function cineEnd(){
  cine.on=false;
  const m=cine.motivo;
  slowmo=1;
  if(m==='apertura'){ empezarPartida(); }
  else if(m==='final'){ irFinal(); }
  else if(m==='derrota'){ revive(); }
  else if(m==='brazo'){
    /* la cinemática del brazo va DESPUÉS de vencerlo: de ahí se sigue al cierre.
       Si se ve desde el menú (repaso), se vuelve al menú sin tocar la partida. */
    if(boss && boss.dead) cineStart('final'); else irPortada();
  }
  else SCREEN='juego';
}
function cineGo(d){
  const j=cine.i+d;
  if(j<0){ cine.t=0; return; }
  if(j>=cine.seq.length){ cineEnd(); return; }
  cine.prev=cine.i; cine.i=j; cine.t=0; cine.fade=.5; SFX.pagina();
}
const cineNext=()=>cineGo(1), cinePrev=()=>cineGo(-1);
function cineTick(dt){
  if(cine.fade>0) cine.fade=Math.max(0,cine.fade-dt);
  cine.t+=dt;
  const dur=cine.seq[cine.i].dur||CINE_DUR;
  if(cine.t>=dur) cineNext();
}

/* --- dibujo del panel --- */
function cineFit(im,B){                    // la lámina completa: el marco es parte del arte
  const a=im.naturalWidth/im.naturalHeight;
  const h=Math.min(B.h,B.w/a), w=h*a;
  return {x:B.x+(B.w-w)/2, y:B.y+(B.h-h)/2, w, h};
}
function cineShake(p,tt){
  if(!p.fx||!p.fx.includes('golpe')) return {x:0,y:0};
  const d=Math.max(0,1-tt/.55); if(d<=0) return {x:0,y:0};
  return {x:Math.sin(tt*46)*13*d*d, y:Math.cos(tt*39)*9*d*d};
}
function cinePlate(idx,tt,alpha,openY){
  const p=cine.seq[idx], B=cine.box, im=p.im? p.im():null;
  if(!ok(im)){ cinePlaceholder(p,B,alpha); return null; }
  const r=cineFit(im,B), kb=p.kb||[.05,.3,0], pr=Math.min(1,tt/(CINE_DUR+2));
  const ease=pr*pr*(3-2*pr), s=1+kb[0]*ease;
  const W=r.w*s, H=r.h*s, ox=(W-r.w)*(.5-kb[1]*.5*ease), oy=(H-r.h)*(.5-kb[2]*.5*ease);
  const sh=cineShake(p,tt);
  cx.save(); cx.globalAlpha=alpha; cx.translate(sh.x,sh.y);
  if(openY<1){ cx.translate(r.x+r.w/2, r.y+r.h/2); cx.scale(1,openY); cx.translate(-r.x-r.w/2,-r.y-r.h/2); }
  cx.beginPath(); cx.rect(r.x,r.y,r.w,r.h); cx.clip();
  cx.drawImage(im, r.x-ox, r.y-oy, W, H);
  cineFx(p,tt,r);
  cx.restore();
  if(openY>=1){                       // sólo cuando el panel ya está desplegado
    cx.save(); cx.globalAlpha=alpha*.8; cx.strokeStyle='rgba(122,90,30,.85)'; cx.lineWidth=3;
    cx.strokeRect(r.x-1.5,r.y-1.5,r.w+3,r.h+3); cx.restore();
  }
  return r;
}
function cinePlaceholder(p,B,alpha){
  const r={x:B.x+240,y:B.y,w:B.w-480,h:B.h};
  cx.save(); cx.globalAlpha=alpha;
  cx.fillStyle=PAPER; cx.fillRect(r.x,r.y,r.w,r.h);
  cx.strokeStyle=INK; cx.lineWidth=3;
  for(let g=0;g<Math.floor(r.w/70);g++){ cx.strokeRect(r.x+14+g*70,r.y+14,44,44);
                                         cx.strokeRect(r.x+14+g*70,r.y+r.h-58,44,44); }
  cx.fillStyle=INK; cx.font='700 30px Georgia'; cx.textAlign='center';
  cx.fillText('· · ·', r.x+r.w/2, r.y+r.h/2);
  cx.strokeStyle=INK; cx.lineWidth=6; cx.strokeRect(r.x,r.y,r.w,r.h);
  cx.restore();
}
/* --- efectos: TODO como trazo de tinta o glifo (regla de estilo del códice) --- */
function cineFx(p,tt,r){
  if(!p.fx) return; const F=p.fx;
  if(F.includes('motes'))
    for(let k=0;k<26;k++){
      const sx=r.x+hsh(k,1)*r.w, sp=.05+hsh(k,2)*.06;
      const y=r.y+r.h-((tt*sp*r.h+hsh(k,3)*r.h)%r.h), s=2+hsh(k,4)*3.5;
      cx.save(); cx.translate(sx+Math.sin(tt*.9+k)*9,y); cx.rotate(Math.PI/4);
      cx.globalAlpha=.30+.25*Math.sin(tt*2+k); cx.fillStyle=GOLDS;
      cx.fillRect(-s/2,-s/2,s,s); cx.restore();
    }
  if(F.includes('hojas'))
    for(let k=0;k<9;k++){
      const x=r.x+r.w*(.08+hsh(k,5)*.86), y=r.y+r.h*(.1+hsh(k,6)*.8);
      voluta(x+Math.sin(tt*.7+k*1.3)*14, y+Math.cos(tt*.5+k)*7,
             9+hsh(k,7)*7, tt*.25+k, JADE, 2, .16+.08*Math.sin(tt+k));
    }
  if(F.includes('plumas'))
    for(let k=0;k<8;k++){
      const t2=(tt*.30+hsh(k,8))%1;
      const x=r.x+r.w*(.18+hsh(k,9)*.72)+Math.sin(tt*1.5+k*2)*26;
      const y=r.y+r.h*(.10+t2*.86);
      pluma(x,y,14+hsh(k,10)*10, Math.sin(tt*1.6+k)*.9+k,
            hsh(k,11)>.55?RED:GOLDS, Math.min(1,t2*4)*(1-t2*.5)*.6);
    }
  if(F.includes('tintaroja'))
    for(let k=0;k<7;k++){
      const g=Math.min(1,tt/.9), x=r.x+r.w*.5+(hsh(k,12)-.5)*r.w*.30;
      const y=r.y+r.h*.42+(hsh(k,13)-.5)*r.h*.30+g*24;
      voluta(x,y,(7+hsh(k,14)*13)*(.4+g), tt*.6+k*1.7, RED, 3, .5*(1-g*.55));
    }
  if(F.includes('caida'))
    for(let k=0;k<14;k++){
      const x=r.x+r.w*(.12+hsh(k,15)*.78), L=40+hsh(k,16)*90;
      const y=r.y+((tt*680+hsh(k,17)*r.h*2)%(r.h+L))-L;
      cx.save(); cx.globalAlpha=.16+.12*hsh(k,18); cx.strokeStyle=INK; cx.lineWidth=2;
      cx.beginPath(); cx.moveTo(x,y); cx.lineTo(x,y+L); cx.stroke(); cx.restore();
    }
  if(F.includes('tension')){
    const g=cx.createRadialGradient(r.x+r.w*.5,r.y+r.h*.5,r.h*.30,
                                    r.x+r.w*.5,r.y+r.h*.5,r.h*(.78-.05*Math.sin(tt*1.6)));
    g.addColorStop(0,'rgba(42,28,16,0)'); g.addColorStop(1,'rgba(42,28,16,.42)');
    cx.save(); cx.fillStyle=g; cx.fillRect(r.x,r.y,r.w,r.h); cx.restore();
  }
  if(F.includes('fuego')){
    const cxx=r.x+r.w*.5, cyy=r.y+r.h*.78, pul=.72+.28*Math.sin(tt*7)+.10*Math.sin(tt*17);
    const g=cx.createRadialGradient(cxx,cyy,4,cxx,cyy,r.h*.55*pul);
    g.addColorStop(0,'rgba(230,160,40,.34)'); g.addColorStop(.5,'rgba(190,90,25,.16)');
    g.addColorStop(1,'rgba(190,90,25,0)');
    cx.save(); cx.globalCompositeOperation='lighter'; cx.fillStyle=g;
    cx.fillRect(r.x,r.y,r.w,r.h); cx.restore();
  }
  if(F.includes('brasas'))
    for(let k=0;k<18;k++){
      const t2=(tt*.42+hsh(k,19))%1;
      const x=r.x+r.w*.5+(hsh(k,20)-.5)*r.w*.14+Math.sin(tt*2.4+k)*11;
      const y=r.y+r.h*.80-t2*r.h*.52, s=1.6+hsh(k,21)*2.4;
      cx.save(); cx.globalAlpha=(1-t2)*.85; cx.fillStyle=k%3?GOLDS:RED;
      cx.beginPath(); cx.arc(x,y,s,0,7); cx.fill(); cx.restore();
    }
  if(F.includes('humo'))
    for(let k=0;k<6;k++){
      const t2=(tt*.16+hsh(k,22))%1;
      voluta(r.x+r.w*.5+(hsh(k,23)-.5)*r.w*.20+Math.sin(tt*.6+k)*16,
             r.y+r.h*.62-t2*r.h*.5, 12+t2*26, tt*.3+k, INK, 2.4, (1-t2)*.22);
    }
}
function cineType(lines,n){                 // revela n caracteres repartidos entre líneas
  let c=n; return lines.map(l=>{ const s=l.slice(0,Math.max(0,c)); c-=l.length; return s; });
}
function drawCine(){
  const p=cine.seq[cine.i], tt=cine.t, B=cine.box;
  cx.fillStyle='#171008'; cx.fillRect(0,0,CVW,CVH);
  const openY=cine.prev<0? Math.min(1,tt/.45)**.6 : 1;
  if(cine.fade>0 && cine.prev>=0)
    cinePlate(cine.prev, (cine.seq[cine.prev].dur||CINE_DUR), 1, 1);
  const r=cinePlate(cine.i, tt, cine.fade>0? 1-cine.fade/.5 : 1, openY)
        || {x:B.x+240,y:B.y,w:B.w-480,h:B.h};
  // hilo de oro: cuánto falta para pasar sola de lámina
  const dur=p.dur||CINE_DUR;
  cx.fillStyle='rgba(122,90,30,.5)'; cx.fillRect(r.x,r.y+r.h+6,r.w,2);
  cx.fillStyle=GOLDS; cx.fillRect(r.x,r.y+r.h+6,r.w*Math.min(1,tt/dur),2);

  const n=Math.max(0,Math.floor((tt-.35)*42));
  cx.textAlign='center';
  const TB=B.y+B.h+26;
  let qh=0;
  if(p.q){
    cx.font='italic 20px Georgia';
    const ql=wrap('«'+p.q+'»',740);
    qh=28+ql.length*24;
    const bw=Math.min(CVW-160,Math.max(...ql.map(l=>cx.measureText(l).width))+280);
    cx.fillStyle=BONE; cx.strokeStyle=INK; cx.lineWidth=3;
    cx.fillRect(CVW/2-bw/2,TB,bw,qh); cx.strokeRect(CVW/2-bw/2,TB,bw,qh);
    cx.fillStyle=RED; cx.font='700 13px Georgia'; cx.fillText(p.w,CVW/2,TB+17);
    cx.fillStyle=INK; cx.font='italic 20px Georgia';
    cineType(ql,n).forEach((l,k)=>cx.fillText(l,CVW/2,TB+40+k*24));
  } else if(p.w){
    cx.fillStyle='rgba(201,168,106,.85)'; cx.font='700 12px Georgia';
    cx.letterSpacing&&(cx.letterSpacing='2px');
    cx.fillText(p.w.toUpperCase(),CVW/2,TB+2); qh=14;
    cx.letterSpacing&&(cx.letterSpacing='0px');
  }
  cx.fillStyle=GOLDS; cx.font=(p.fin?'700 26px':'19px')+' Georgia';
  cineType(wrap(p.n,900), p.q? n-p.q.length-2 : n)
    .forEach((l,k)=>cx.fillText(l, CVW/2, TB+(p.q?qh+30:qh+22)+k*25));
  // cuentas de panel + controles
  const cxx=CVW/2-(cine.seq.length-1)*9;
  for(let k=0;k<cine.seq.length;k++){
    cx.beginPath(); cx.arc(cxx+k*18,CVH-32,k===cine.i?4.5:3,0,7);
    cx.fillStyle=k===cine.i?GOLDS:'rgba(201,168,106,.42)'; cx.fill();
  }
  cx.fillStyle='rgba(201,168,106,.75)'; cx.font='12px Georgia';
  cx.fillText('←  ·  → / ESPACIO  ·  ESC salta la escena   ('+(cine.i+1)+'/'+cine.seq.length+')',
              CVW/2,CVH-11);
}

/* ================= ESCENOGRAFÍA ================= */
/* La cámara se redondea a píxel entero: con posición fraccionaria las láminas se
   remuestreaban distinto cada fotograma y el fondo entero hervía al caminar. */
function camX(){
  if(enArena) return 0;                     // la arena es una estampa fija
  const raw=Math.max(0,Math.min(LEVEL-CVW,t.x-CVW*0.45));
  /* se ajusta a píxel de PANTALLA (no lógico): así la copia 1:1 de las láminas cae
     en una posición entera del búfer, sin remuestreo ni hervor del fondo al andar */
  return Math.round(raw*SCALE)/SCALE;
}

/* ---------- láminas pre-escaladas ----------
   Cada lámina mide 1915×821 y se dibuja a ~1675 px de ancho. Reescalarlas en CADA
   fotograma costaba 11,5 ms de los 20 que tenía el cuadro entero en Retina: era la
   causa de que el juego fuera a tirones. Ahora cada una se escala UNA sola vez a un
   lienzo aparte —con la franja de fundido y el zócalo ya pintados— y por fotograma
   sólo queda una copia 1:1, que es prácticamente gratis.
   El zócalo estira la última franja de la lámina hasta el borde inferior: bajo la
   línea de piso quedaba si no una banda de papel crudo de hasta 7 px. */
let scnCache=null, scnKey='';
function scnCacheKey(){ return SCALE.toFixed(3)+'|'+SCN.map(im=>ok(im)?1:0).join(''); }
function buildScnCache(){
  scnCache=SCN.map((im,i)=>{
    if(!ok(im)) return null;
    const s=GROUND/SFLOOR[i], w=SW*s, h=SH*s;
    const c=document.createElement('canvas');
    c.width=Math.max(1,Math.round(w*SCALE)); c.height=Math.max(1,Math.round(CVH*SCALE));
    const g=c.getContext('2d');
    g.setTransform(SCALE,0,0,SCALE,0,0);
    g.imageSmoothingEnabled=true; g.imageSmoothingQuality='high';
    if(i===0||!ok(SCN[i-1])) g.drawImage(im,0,0,w,h);
    else {
      g.drawImage(im, OV/s,0, SW-OV/s,SH, OV,0, w-OV, h);      // cuerpo opaco
      const N=14, sw=OV/N;                                      // franja de fundido:
      for(let k=0;k<N;k++){                                     // se guarda CON su alfa,
        g.globalAlpha=(k+1)/(N+1);                              // así al copiarla sobre
        g.drawImage(im, (k*sw)/s,0, sw/s+1,SH, k*sw,0, sw+.8, h);  // la anterior funde igual
      }
      g.globalAlpha=1;
    }
    if(h<CVH) g.drawImage(im, 0,SH-3, SW,3, 0, h-1, w, CVH-h+1);   // zócalo
    return {c, wl:w};
  });
}
function drawScenes(cam){
  const k=scnCacheKey();
  if(scnKey!==k){ buildScnCache(); scnKey=k; }
  if(!scnCache) return;
  /* copia en coordenadas de PANTALLA: 1:1 con el búfer, sin remuestreo. Y sólo del
     trozo que se ve: copiar la lámina entera (2500 px de ancho) para enseñar 1900
     gastaba el doble de relleno del necesario, y en pantalla hay dos a la vez. */
  cx.save(); cx.setTransform(1,0,0,1,0,0);
  const W=Math.round(CVW*SCALE);
  for(let i=0;i<scnCache.length;i++){
    const e=scnCache[i]; if(!e) continue;
    const px=Math.round((ZS[i]-cam)*SCALE);
    if(px>=W || px+e.c.width<=0) continue;
    const sx=Math.max(0,-px), dx=Math.max(0,px);
    const sw=Math.min(e.c.width-sx, W-dx);
    if(sw>0) cx.drawImage(e.c, sx,0, sw,e.c.height, dx,0, sw,e.c.height);
  }
  cx.restore();
}
function drawProps(cam){
  PROPS.forEach(p=>{
    if(!okP(p.k)) return;
    const im=PR[p.k], px=p.x-cam; if(px<-360||px>CVW+360) return;
    const W=im.width/im.height*p.H;
    cx.drawImage(im,px-W/2,GROUND-p.H,W,p.H);
  });
}
/* braseros de copal: apagados son piedra; encendidos arden y son tu punto de vuelta */
function drawHogueras(cam){

    else { cx.fillStyle=PAPER2; cx.strokeStyle=INK; cx.lineWidth=3;

    if(h.on){
      // llama de copal: volutas de oro, no fuego realista

               5+t2*15, simT*.6+k, k%2?GOLDS:RED, 2.6, (1-t2)*.55);
      }
      cx.save(); cx.globalAlpha=.20+.06*Math.sin(simT*7);
      const g=cx.createRadialGradient(px,GROUND-H*.7,4,px,GROUND-H*.7,120);
