/* ================= ESCENOGRAFÍA ================= */
/* La cámara se redondea a píxel entero: con posición fraccionaria las láminas se
   remuestreaban distinto cada fotograma y el fondo entero hervía al caminar. */
function camX(){
  if(enArena) return 0;                     // la arena es una estampa fija
  const raw=Math.max(0,Math.min(LEVEL-CVW,t.x-CVW*0.45));
  /* se ajusta a píxel de PANTALLA (no lógico): así la copia 1:1 de las láminas cae
     en una posición entera del búfer, sin remuestreo ni hervor del fondo al andar */
  return Math.round(raw*SCALE)/SCALE;
}

/* ---------- láminas pre-escaladas ----------
   Cada lámina mide 1915×821 y se dibuja a ~1675 px de ancho. Reescalarlas en CADA
   fotograma costaba 11,5 ms de los 20 que tenía el cuadro entero en Retina: era la
   causa de que el juego fuera a tirones. Ahora cada una se escala UNA sola vez a un
   lienzo aparte —con la franja de fundido y el zócalo ya pintados— y por fotograma
   sólo queda una copia 1:1, que es prácticamente gratis.
   El zócalo estira la última franja de la lámina hasta el borde inferior: bajo la
   línea de piso quedaba si no una banda de papel crudo de hasta 7 px. */
let scnCache=null, scnKey='';
function scnCacheKey(){ return SCALE.toFixed(3)+'|'+SCN.map(im=>ok(im)?1:0).join(''); }
function buildScnCache(){
  scnCache=SCN.map((im,i)=>{
    if(!ok(im)) return null;
    const s=GROUND/SFLOOR[i], w=SW*s, h=SH*s;
    const c=document.createElement('canvas');
    c.width=Math.max(1,Math.round(w*SCALE)); c.height=Math.max(1,Math.round(CVH*SCALE));
    const g=c.getContext('2d');
    g.setTransform(SCALE,0,0,SCALE,0,0);
    g.imageSmoothingEnabled=true; g.imageSmoothingQuality='high';
    if(i===0||!ok(SCN[i-1])) g.drawImage(im,0,0,w,h);
    else {
      g.drawImage(im, OV/s,0, SW-OV/s,SH, OV,0, w-OV, h);      // cuerpo opaco
      const N=14, sw=OV/N;                                      // franja de fundido:
      for(let k=0;k<N;k++){                                     // se guarda CON su alfa,
        g.globalAlpha=(k+1)/(N+1);                              // así al copiarla sobre
        g.drawImage(im, (k*sw)/s,0, sw/s+1,SH, k*sw,0, sw+.8, h);  // la anterior funde igual
      }
      g.globalAlpha=1;
    }
    if(h<CVH) g.drawImage(im, 0,SH-3, SW,3, 0, h-1, w, CVH-h+1);   // zócalo
    return {c, wl:w};
  });
}
function drawScenes(cam){
  const k=scnCacheKey();
  if(scnKey!==k){ buildScnCache(); scnKey=k; }
  if(!scnCache) return;
  /* copia en coordenadas de PANTALLA: 1:1 con el búfer, sin remuestreo. Y sólo del
     trozo que se ve: copiar la lámina entera (2500 px de ancho) para enseñar 1900
     gastaba el doble de relleno del necesario, y en pantalla hay dos a la vez. */
  cx.save(); cx.setTransform(1,0,0,1,0,0);
  const W=Math.round(CVW*SCALE);
  for(let i=0;i<scnCache.length;i++){
    const e=scnCache[i]; if(!e) continue;
    const px=Math.round((ZS[i]-cam)*SCALE);
    if(px>=W || px+e.c.width<=0) continue;
    const sx=Math.max(0,-px), dx=Math.max(0,px);
    const sw=Math.min(e.c.width-sx, W-dx);
    if(sw>0) cx.drawImage(e.c, sx,0, sw,e.c.height, dx,0, sw,e.c.height);
  }
  cx.restore();
}
function drawProps(cam){
  PROPS.forEach(p=>{
    if(!okP(p.k)) return;
    const im=PR[p.k], px=p.x-cam; if(px<-360||px>CVW+360) return;

}

function drawFaro(cam){
  const px=CASA.x-cam; if(px<-260||px>CVW+260) return;
  /* ámbar y no blanco: el cielo de las láminas es papel claro y una luz pálida

  g.addColorStop(1,'rgba(240,170,60,'+(a*2).toFixed(3)+')');

  cx.moveTo(px-46,0); cx.lineTo(px+46,0); cx.lineTo(px+120,GROUND); cx.lineTo(px-120,GROUND); cx.closePath(); cx.fill();
  cx.restore();
  for(let k=0;k<16;k++){                      // motas de oro que suben por el haz
    const t2=(simT*.22+hsh(k,81))%1, x=px+(hsh(k,82)-.5)*150*(1-t2*.5)+Math.sin(simT*1.3+k)*8;
    cx.save(); cx.globalAlpha=(1-t2)*.9*(t2*6<1?t2*6:1); cx.fillStyle=k%3?GOLDS:'#fff3d6';
    cx.strokeStyle=GOLD; cx.lineWidth=1;
    cx.translate(x,GROUND-20-t2*(GROUND-80)); cx.rotate(Math.PI/4);
    const s=3.5+hsh(k,83)*3; cx.fillRect(-s/2,-s/2,s,s); cx.strokeRect(-s/2,-s/2,s,s); cx.restore();

function drawSendaCasa(cam){

/* cartucho de códice con el «?»: marco rojo, papel y glifo de oro */

/* ---------- numeral maya de puntos y barras ---------- */
function numeralMaya(n,x,yBase,u){
  const barras=Math.floor(n/5), puntos=n%5, bh=u*.24, gap=u*.1;
  cx.save(); cx.lineWidth=Math.max(2.5,u*.035); cx.strokeStyle=INK; cx.fillStyle=RED; cx.lineJoin='round';
  let y=yBase;
  for(let b=0;b<barras;b++){
    y-=bh; cx.beginPath();
    if(cx.roundRect) cx.roundRect(x-u/2,y,u,bh,bh*.35); else cx.rect(x-u/2,y,u,bh);
    cx.fill(); cx.stroke(); y-=gap;
  }
  if(puntos){
    const rad=u*.1, sep=u*.26, ancho=(puntos-1)*sep;
    y-=rad+gap*.4;
    for(let i=0;i<puntos;i++){ cx.beginPath(); cx.arc(x-ancho/2+i*sep,y,rad,0,7); cx.fill(); cx.stroke(); }
  }
  if(n===0){                                   // concha: el cero
    cx.fillStyle=PAPER; cx.beginPath(); cx.ellipse(x,yBase-u*.25,u*.42,u*.22,0,0,7); cx.fill(); cx.stroke();
    cx.beginPath(); cx.moveTo(x-u*.3,yBase-u*.25); cx.lineTo(x+u*.3,yBase-u*.25); cx.stroke();
  }
  cx.restore();
}

/* ---------- interior de la sala ---------- */
const salaSalirRect={x:18,y:16,w:132,h:38};
/* Qué cara pone cada hermano. 1 alegre · 2 serio · 3 enojado · 4 riendo.
   Las caras cuentan la escena: se enfadan al recordar que los convirtieron en
   monos, se ríen si fallas y celebran si aciertas. */
function carasMonos(){
  if(sala.fase==='acierto') return [4,4];
  if(sala.fase==='pista')   return [3,4];
  if(sala.fase==='fin')     return [1,1];
  if(sala.fase==='enigma')  return [2,2];
  return sala.pagina===0? [1,2] : sala.pagina===1? [3,3] : [2,2];
}
function dibujaMono(im,x,pies,alto,habla){
  if(!ok(im)) return;
  const bob=habla? Math.sin(simT*7)*3 : Math.sin(simT*1.6+x)*1.5;
  const W=im.width/im.height*alto;
  cx.save(); cx.globalAlpha=.22; cx.fillStyle='#000';
  cx.beginPath(); cx.ellipse(x,pies,W*.36,9,0,0,7); cx.fill(); cx.restore();
  cx.drawImage(im,x-W/2,pies-alto+bob,W,alto);
}
function drawSala(){
  // fondo: el interior de la casa de los escribas
  if(ok(SALA_FONDO)){
    const a=SALA_FONDO.naturalWidth/SALA_FONDO.naturalHeight, ca=CVW/CVH;
    let w,h; if(a>ca){ h=CVH; w=h*a; } else { w=CVW; h=w/a; }
    cx.drawImage(SALA_FONDO,(CVW-w)/2,(CVH-h)/2,w,h);
  } else {                                   // respaldo si la lámina no cargó
    cx.fillStyle='#21160c'; cx.fillRect(0,0,CVW,CVH);
    cx.save(); cx.strokeStyle='rgba(201,168,106,.09)'; cx.lineWidth=2;
    for(let f=0; f*58<460; f++){ const y=70+f*58; line(0,y,CVW,y);
      for(let x=(f%2?-64:0); x<CVW; x+=128) line(x,y,x,y+58); }
    cx.restore();
  }
  // las antorchas del fondo laten
  cx.save(); cx.globalCompositeOperation='lighter';
  [126,352,1024,1250].forEach((fx,i)=>{
    const g=cx.createRadialGradient(fx,250,6,fx,250,150);
    const p=.10+.04*Math.sin(simT*6+i*1.7);
    g.addColorStop(0,'rgba(255,190,90,'+p+')'); g.addColorStop(1,'rgba(255,190,90,0)');
    cx.fillStyle=g; cx.fillRect(fx-150,100,300,300);
  });
  cx.restore();

  // la estela con el glifo, en el pasillo central
  const ex=640, ew=214, ey=118, eh=300;
  cx.save();
  cx.fillStyle='rgba(42,28,16,.28)';
  cx.beginPath(); cx.ellipse(ex,ey+eh+6,ew*.55,12,0,0,7); cx.fill();
  cx.fillStyle=PAPER2; cx.strokeStyle=INK; cx.lineWidth=5;
  cx.fillRect(ex-ew/2,ey,ew,eh); cx.strokeRect(ex-ew/2,ey,ew,eh);
  cx.fillStyle='rgba(42,28,16,.10)'; cx.fillRect(ex-ew/2+13,ey+13,ew-26,eh-26);
  cx.lineWidth=2; cx.strokeStyle='rgba(42,28,16,.5)'; cx.strokeRect(ex-ew/2+13,ey+13,ew-26,eh-26);
  cx.fillStyle=INK;                       // muescas talladas en la cornisa
  for(let i=0;i<5;i++) cx.fillRect(ex-ew/2+18+i*(ew-36)/4-4,ey-7,8,7);
  cx.restore();
  if(sala.fase==='dialogo'){
    cx.save(); cx.globalAlpha=.32+.13*Math.sin(simT*2); cx.textAlign='center'; cx.fillStyle=INK;
    cx.font='700 120px Georgia'; cx.fillText('?', ex, ey+eh/2+42); cx.restore();
  } else numeralMaya(SALA_TEXTO.numero, ex, ey+eh-52, 140);

  // los hermanos, uno a cada lado; el que habla se mueve un poco más
  const [cb,cc]=carasMonos(), hablaB=sala.pagina%2===0;
  /* los pies justo encima de la caja de diálogo (que empieza en y=470) */
  dibujaMono(MONO.b[cb], 250, 462, 288, hablaB && !salaCompleto());
  dibujaMono(MONO.c[cc],1030, 462, 288, !hablaB && !salaCompleto());

  // caja de diálogo
  const bx=70, by=470, bw=CVW-140, bh=230;
  cx.save();
  cx.fillStyle='rgba(233,223,196,.96)'; cx.fillRect(bx,by,bw,bh);
  cx.strokeStyle=INK; cx.lineWidth=3; cx.strokeRect(bx,by,bw,bh);
  cx.fillStyle=RED; cx.fillRect(bx+22,by-16,520,32); cx.strokeRect(bx+22,by-16,520,32);
  cx.fillStyle=GOLDS; cx.font='700 15px Georgia'; cx.textAlign='left';
  cx.fillText(tr(SALA_TEXTO.quien), bx+38, by+5);
  cx.fillStyle=INK; cx.font='23px Georgia';
  const lineas=wrap(salaTexto(), bw-80);
  let quedan=Math.floor(sala.t*LETRAS_POR_SEG);
  lineas.forEach((l,i)=>{ const v=l.slice(0,Math.max(0,quedan)); quedan-=l.length+1; cx.fillText(v, bx+40, by+56+i*32); });
  cx.restore();

  // opciones o «seguir»
  menu.rects=[];
  if(salaMenuVisible()){
    const n=menu.items.length, ancho=n>1?170:320, sep=26, total=n*ancho+(n-1)*sep;
    const oy=by+bh-78;
    menu.items.forEach((it,i)=>{
      const x=CVW/2-total/2+i*(ancho+sep), sel=i===menu.sel;
      menu.rects.push({x,y:oy,w:ancho,h:46});
      cx.save();
      cx.fillStyle=sel?RED:PAPER2; cx.strokeStyle=INK; cx.lineWidth=3;
      cx.fillRect(x,oy,ancho,46); cx.strokeRect(x,oy,ancho,46);
      cx.fillStyle=sel?GOLDS:INK; cx.font=(n>1?'700 26px':'700 20px')+' Georgia'; cx.textAlign='center';
      cx.fillText(typeof it.label==='function'?it.label():tr(it.label), x+ancho/2, oy+(n>1?33:30));
      cx.restore();
    });
    if(sala.fase==='enigma'){
      cx.save(); cx.textAlign='center'; cx.fillStyle='rgba(42,28,16,.6)'; cx.font='italic 14px Georgia';
      cx.fillText(tr(TOUCH?'toca tu respuesta':'←  →  para elegir   ·   ENTER para responder'), CVW/2, by+bh-8); cx.restore();
    }
  } else if(salaCompleto()){
    cx.save(); cx.textAlign='right'; cx.fillStyle=RED; cx.globalAlpha=.5+.5*Math.sin(simT*5);
    cx.font='700 16px Georgia'; cx.fillText(tr(TOUCH?'toca para seguir  ▸':'ENTER para seguir  ▸'), bx+bw-24, by+bh-18); cx.restore();
  }

  // salir
  const s0=salaSalirRect;
  cx.save(); cx.fillStyle='rgba(42,28,16,.7)'; cx.strokeStyle='rgba(230,205,139,.45)'; cx.lineWidth=1.5;
  cx.fillRect(s0.x,s0.y,s0.w,s0.h); cx.strokeRect(s0.x,s0.y,s0.w,s0.h);
  cx.fillStyle=GOLDS; cx.font='15px Georgia'; cx.textAlign='center';
  cx.fillText(tr(TOUCH?'←  salir':'←  salir (ESC)'), s0.x+s0.w/2, s0.y+25); cx.restore();
}

/* ================= ENEMIGOS (dibujo) ================= */
const TOPY={esq:128,ara:EH.ara*.85,ala:EH.ala*.9,tec:EH.tec+8};
function drawFoes(cam){
  foes.forEach(e=>{
    const px=e.x-cam; if(px<-180||px>CVW+180) return;
    const dying=e.hp<=0;
    // hilo de seda: antes del cuerpo y sin espejar
    if(e.kind==='ara' && !dying && (e.state==='hang'||e.state==='drop')){
      cx.strokeStyle=BONE; cx.lineWidth=2; cx.globalAlpha=.85;
      line(px,e.anchorY,px,e.y-EH.ara*.86); cx.globalAlpha=1;
    }
    cx.save(); cx.translate(px,e.y);
    if(dying && e.kind==='esq'){ cx.globalAlpha=Math.max(0,1-e.deadT); cx.rotate(-1.3*Math.min(1,e.deadT)); }
    else if(dying) cx.globalAlpha=Math.max(0,Math.min(1,(1.35-e.deadT)/.35));
    else if(e.hitCd>0 && Math.floor(e.hitCd*30)%2===0) cx.globalAlpha=.5;
    const enSuelo = e.kind==='esq' || ((e.kind==='ara'||e.kind==='ala') && e.y>=GROUND-1);
    if(enSuelo && !dying){ cx.save(); cx.globalAlpha=.16; cx.fillStyle=INK;
      cx.beginPath(); cx.ellipse(0,3,e.kind==='ala'?40:(e.kind==='ara'?34:22),5,0,0,7); cx.fill(); cx.restore(); }
    cx.scale(e.face,1);
    let img=null, H=112;
    if(e.kind==='esq'){
      if(e.state==='windup'||e.state==='dashwind') img=FOE.ewind;
      else if(e.state==='stab'||e.state==='dash') img=FOE.eatk;
      else { const i=Math.floor(e.t*(e.state==='chase'?11:5.5))%6; img=FOE['ew'+(i+1)]; }
    } else if(e.kind==='ara'){ H=EH.ara;
      if(dying) img=anim('ara_die',e.deadT,4,true);
      else if(e.hitCd>0) img=anim('ara_hurt',.18-e.hitCd,14,true);
      else if(e.state==='hang') img=anim('ara_hang',e.t,4);
      else if(e.state==='drop') img=anim('ara_drop',e.t,10);
      else if(e.state==='windup') img=anim('ara_bite',(.38-e.wt)/.38*.5,4,true);
      else if(e.state==='bite')   img=anim('ara_bite',.5+(.3-e.wt)/.3*.5,4,true);
      else img=anim('ara_walk',e.t,13);
    } else if(e.kind==='ala'){ H=EH.ala;
      if(dying) img=anim('ala_die',e.deadT,3.6,true);
      else if(e.hitCd>0) img=anim('ala_hurt',.18-e.hitCd,14,true);
      else if(e.state==='sting') img=anim('ala_sting',(ALA_PICA-e.wt)/ALA_PICA,5,true);
      else if(e.state==='guard'||e.state==='turning') img=anim('ala_guard',e.t,5);
      else img=anim('ala_walk',e.t,7);
    } else if(e.kind==='tec'){ H=EH.tec;
      if(dying) img=anim('tec_die',e.deadT,3.6,true);
      else if(e.hitCd>0) img=anim('tec_hurt',.18-e.hitCd,14,true);
      else if(e.state==='cry') img=anim('tec_cry',.95-e.wt,5);
      else if(e.state==='picawind') img=anim('tec_cry',.45-e.pT,8);
      else if(e.state==='picado') img=anim('tec_fly',e.t,20);
      else if(e.state==='perch') img=anim('tec_idle',e.t,3.5);
      else img=anim('tec_fly',e.t,11);
    }
    if(ok(img)) drawAnchored(img,H,null,false);
    else { cx.fillStyle=INK; cx.fillRect(-14,-56,28,56); }
    cx.restore();

    if(!dying && e.kind==='ala' && e.blockT>0){      // chispa de pedernal al rebotar
      cx.save(); cx.globalAlpha=Math.min(1,e.blockT*4); cx.strokeStyle=GOLD; cx.lineWidth=3;
      const sx=px+e.face*46, sy=e.y-EH.ala*.45;
      for(let i=0;i<4;i++){ const a=(i/4)*6.28+e.blockT*8;
        line(sx+Math.cos(a)*7,sy+Math.sin(a)*7,sx+Math.cos(a)*16,sy+Math.sin(a)*16); }
      cx.restore();
    }
    /* trazos de velocidad detrás de la embestida y del picado */
    if(!dying && (e.state==='dash'||e.state==='picado')){
      const vx=e.state==='dash'? e.face*600 : e.pvx, vy=e.state==='dash'? 0 : e.pvy;
      const a=Math.atan2(vy,vx), ux=Math.cos(a), uy=Math.sin(a), cyy=e.y-(e.kind==='tec'?44:60);
      cx.save(); cx.lineCap='round'; cx.globalAlpha=.7;
      [[INK,3],[BONE,1.4]].forEach(([col,w])=>{ cx.strokeStyle=col; cx.lineWidth=w;
        for(let i=-1;i<=1;i++){ const sx=px-ux*40-uy*i*16, sy=cyy-uy*40+ux*i*16;
          line(sx,sy,sx-ux*(i?26:40),sy-uy*(i?26:40)); } });
      cx.restore();
    }
    if(!dying && (e.state==='windup'||e.state==='cry'||e.state==='sting'||e.state==='spit'||
                  e.state==='dashwind'||e.state==='picawind')){
      cx.font='700 22px Georgia'; cx.textAlign='center';
      inkText('!',px,e.y-(TOPY[e.kind]||60),RED);
    }
    /* alacrán girándose: la espalda está descubierta — hay que verlo para aprovecharlo */
    if(!dying && e.kind==='ala' && e.state==='turning'){
      cx.font='700 15px Georgia'; cx.textAlign='center';
      cx.save(); cx.globalAlpha=.55+.45*Math.sin(e.wt*20);
      inkText(tr('¡la espalda!'),px,e.y-TOPY.ala-6,JADE);
      cx.restore();
      cx.save(); cx.globalAlpha=.8; cx.strokeStyle=JADE; cx.lineWidth=2.5; cx.lineCap='round';
      const gy=e.y-EH.ala*.62, gr=13, a0=e.turnTo>0?3.5:5.9;
      cx.beginPath(); cx.arc(px,gy,gr,a0,a0+2.2); cx.stroke();
      cx.restore();
    }
    if(!dying && e.hp<e.maxhp){
      const by=e.y-(TOPY[e.kind]||60)+6;
      cx.fillStyle='rgba(244,235,208,.85)'; cx.fillRect(px-19,by-1,38,6);
      cx.fillStyle='rgba(42,28,16,.5)'; cx.fillRect(px-18,by,36,4);
      cx.fillStyle=RED; cx.fillRect(px-18,by,36*Math.max(0,e.hp/e.maxhp),4);
    }
  });
}

/* ================= VUCUB CAQUIX (dibujo) ================= */
function drawFeathers(cam){
  feathers.forEach(f=>{
    const px=f.x-cam; if(px<-60||px>CVW+60) return;
    if(okV('projr')){
      /* el cuadro de la hoja apunta a la IZQUIERDA (la punta brillante a la izquierda
         y las chispas detrás): sin el espejo, la pluma volaba de culo */
      cx.save(); cx.translate(px,f.y); cx.rotate(Math.atan2(f.vy,f.vx)); cx.scale(-1,1);
      const im=VC.projr, H=16, W=im.width/im.height*H;
      cx.drawImage(im,-W/2,-H/2,W,H); cx.restore();
    } else { cx.strokeStyle=GOLD; cx.lineWidth=3; line(px,f.y,px-f.vx*.04,f.y-f.vy*.04); }
  });
}
/* ondas de tierra: una cresta de polvo con filo de tinta que corre por el suelo */
function drawOndas(cam){
  ondas.forEach(o=>{ if(o.t<.14) return;
    const px=o.x-cam, h=30+7*Math.sin(o.t*28), f=o.dir;
    cx.save(); cx.translate(px,GROUND+2);
    cx.fillStyle='rgba(42,28,16,.28)';                    // sombra de la cresta
    cx.beginPath(); cx.ellipse(-4*f,0,34,6,0,0,7); cx.fill();
    cx.fillStyle=BONE; cx.strokeStyle=INK; cx.lineWidth=3; cx.lineJoin='round';
    cx.beginPath(); cx.moveTo(-40*f,0);
    cx.quadraticCurveTo(-14*f,-h*1.15,12*f,-h*.35);
    cx.quadraticCurveTo(16*f,-h*.1,22*f,0); cx.closePath(); cx.fill(); cx.stroke();
    cx.lineWidth=2;                                       // rayas de tierra que salta
    line(-22*f,-h*.55,-34*f,-h*.9); line(-8*f,-h*.75,-12*f,-h*1.2);
    cx.restore();
  });
}
/* ángulo de vuelo para inclinar el cuadro, siempre del lado hacia el que mira */
function bossTilt(){
  const v=Math.hypot(boss.vxd,boss.vyd); if(v<60) return 0;
  let a=Math.atan2(boss.vyd,boss.vxd); if(boss.face<0) a=a>0? a-Math.PI : a+Math.PI;
  return Math.max(-0.9,Math.min(0.9,a));
}
function drawBoss(cam){
  if(!boss) return;
  const px=boss.x-cam; if(px<-260||px>CVW+260){ drawFeathers(cam); return; }
  const st=boss.state, grounded=bossGrounded();
  const volando = st==='dive'||st==='remonta'||st==='barrido';
  let img=null, mirror=false, tilt=0;
  /* sombra en el suelo: dice dónde está el pájaro en el aire, y crece al bajar */
  if(!grounded && !boss.dead){
    const k=Math.max(.2,1-(GROUND-boss.y)/480);
    cx.fillStyle='rgba(42,28,16,'+(.30*k).toFixed(3)+')';
    cx.beginPath(); cx.ellipse(px,GROUND-2,24+70*k,4+8*k,0,0,7); cx.fill();
  }
  /* la sombra ROJA: dónde va a caer el picado (se mueve mientras apunta, se fija al
     lanzarse). Es el aviso que hace justo un picado que adelanta tu carrera. */
  if(st==='aim'||st==='dive'){
    const tx=boss.tx-cam, fija=st==='dive', p=.5+.5*Math.sin(boss.t*18);
    const rx=fija?48:58-10*p, ry=fija?10:12-2*p;
    cx.save(); cx.globalAlpha=fija? .95 : .55+.35*p;
    cx.fillStyle='rgba(156,44,27,.22)';
    cx.beginPath(); cx.ellipse(tx,GROUND-3,rx,ry,0,0,7); cx.fill();
    cx.strokeStyle=INK; cx.lineWidth=fija?6:5; cx.stroke();      // filo de tinta debajo
    cx.strokeStyle=RED; cx.lineWidth=fija?3.5:2.5; cx.stroke();
    cx.beginPath(); cx.ellipse(tx,GROUND-3,16,3.5,0,0,7); cx.stroke();
    cx.restore();
  }
  /* Los ataques se animan con boss.st (tiempo DENTRO del estado) para que siempre
     arranquen en el cuadro 1. El picado y la ráfaga usan las hojas de vuelo
     horizontal, que sí son un ciclo limpio: las de vc_dive y vc_atk cambian de
     tamaño dentro de la misma hoja y el pájaro parpadeaba y se encogía. */
  if(boss.dead){ const i=Math.min(VC_N.death,1+Math.floor(boss.deadT*5)); img=VC['death'+i]; mirror=boss.face<0; }
  else if(st==='canopy'||st==='eat'){ img=vcF('idle',boss.t,6); mirror=boss.face<0; }
  else if(volando){ img=vcF(boss.face>0?'flyr':'flyl',boss.st,14); tilt=bossTilt(); }
  else if(st==='gust'||st==='prebarrido'){ img=vcF('hover',boss.st,14); mirror=boss.face<0; }
  else if(st==='stun'){ img=vcF('hurt',boss.st,5); mirror=boss.face<0; }
  else { img=vcF('hover',boss.t,10); mirror=boss.face<0; }
  /* trazos de velocidad, a tinta, detrás del pájaro */
  if(volando && Math.hypot(boss.vxd,boss.vyd)>300){
    const a=Math.atan2(boss.vyd,boss.vxd), ux=Math.cos(a), uy=Math.sin(a);
    /* dos tonos (tinta debajo, hueso encima) para que se lean sobre el follaje
       oscuro y sobre el cielo claro */
    cx.save(); cx.lineCap='round'; cx.globalAlpha=.8;
    [[INK,3.5],[BONE,1.6]].forEach(([col,w])=>{ cx.strokeStyle=col; cx.lineWidth=w;
      for(let i=-1;i<=1;i++){ const o=i*20, l=i? 34 : 52, b=100+12*Math.abs(i);
        const sx=px-ux*b-uy*o, sy=boss.y-uy*b+ux*o;
        line(sx,sy,sx-ux*l,sy-uy*l); } });
    cx.restore();
  }
  cx.save(); cx.translate(px, grounded? GROUND : boss.y);
  if(tilt) cx.rotate(tilt);
  if(mirror) cx.scale(-1,1);
  if(ok(img)){
    drawAnchored(img,BOSS_H,null,!grounded);
    /* destello de golpe como silueta clara ENCIMA del cuadro, y al morir se apaga
       hacia la tinta: nunca se vuelve transparente, que es lo que dejaba ver el fondo */
    const fl=boss.hitCd>0? Math.min(1,boss.hitCd/.15) : 0;
    if(boss.dead){ cx.globalAlpha=Math.min(.6,boss.deadT*.2); drawAnchored(img,BOSS_H,null,false,tinted(img,INK)); }
    else if(fl>0){ cx.globalAlpha=.6*fl; drawAnchored(img,BOSS_H,null,!grounded,tinted(img,'#fff3d6')); }
    else if(boss.furia && st!=='stun'){                 // en furia arde: un pulso rojo
      cx.globalAlpha=.10+.08*Math.sin(boss.t*7); drawAnchored(img,BOSS_H,null,!grounded,tinted(img,'#e0401f')); }
    cx.globalAlpha=1;
  }
  else { cx.fillStyle=RED; cx.beginPath(); cx.ellipse(0,grounded?-60:0,60,40,0,0,7); cx.fill(); }
  cx.restore();
  drawOndas(cam);                                   // delante del pájaro: se ven al salir
  if(!boss.dead){
    cx.textAlign='center';
    if(st==='aim'||st==='prebarrido'){ cx.font='700 30px Georgia'; inkText('!',px,boss.y-104,RED,null,5); }
    if((st==='eat'&&!boss.active)||st==='stun'){
      const pulso=.65+.35*Math.sin(boss.st*9);
      cx.save(); cx.globalAlpha=pulso; cx.font='700 17px Georgia';
      inkText(tr('¡AHORA!'),px,(grounded?GROUND-158:boss.y-BOSS_H*.6)-12,RED);
      cx.restore(); }
  }
  drawFeathers(cam);
}

/* ================= JUNAJPÚ (dibujo) ================= */
function snap(){ return { x:t.x, y:t.y, face:t.face, run:t.run,
  inAir:!t.onGround, charging:t.charging, charge:t.charge,
  dartCd:t.dartCd, hurtT:t.hurtT, vy:t.vy, duck:t.duck,
  squash:t.squash, stretch:t.stretch, vx:t.vx, animT:t.animT,
  aim:t.aim, shotAim:t.shotAim, web:t.web, webF:t.webF, webLucha:t.webLucha,
  golpe:t.golpe, golpeT:t.golpeT, golpeRec:t.golpeRec, golpeN:t.golpeN, guardia:t.guardia }; }

/* Selección de cuadro + movimiento procedural sobre el gráfico: rebote y bamboleo
   de zancada, tirón hacia atrás al recibir daño, retroceso al soplar. */
function drawSprite(o){
  const shooting = o.charging || o.dartCd>.3;
  /* disparo vertical: mientras carga manda hacia dónde apunta AHORA; después del
     soplido, hacia dónde salió el dardo (para rematar la animación completa) */
  const dirV = o.charging? o.aim : o.shotAim;
  const vertical = (o.charging || o.dartCd>0) && (dirV==='arriba'||dirV==='abajo');
  const hojaV = dirV==='arriba'? 'up' : 'dn';
  let img, H=P.sprH, ax=null;
  if(o.web>0 && okO('red1')){
    /* ENVUELTO: cuadro propio de la hoja de telaraña. Va el primero de la cadena
       porque anula todo lo demás — ni agacharse, ni soplar, ni correr. */
    img = (okO('red2') && Math.sin(o.webF)>0)? OPT.red2 : OPT.red1;
  }
  else if(o.golpe>0 && o.hurtT<=0 && okO(GOLPES[o.golpe-1].k+'1')){
    /* EL PUÑAL: cinco cuadros por golpe repartidos en su duración */
    const G=GOLPES[o.golpe-1], f=Math.min(5,1+Math.floor(o.golpeT/G.dur*5));
    img=pickO(G.k+f, G.k+'1');
  }
  else if(o.golpeRec>0 && o.hurtT<=0 && okO('rec1')){
    /* recupera la guardia: los seis cuadros de «recuperación» en su medio instante */
    const tot=GOLPE_REC*(o.golpeN===3?1.5:1);
    img=pickO('rec'+Math.min(6,1+Math.floor((1-o.golpeRec/tot)*6)),'rec1');
  }
  else if(o.guardia>0 && !o.inAir && !o.charging && o.dartCd<=0 && !o.duck && Math.abs(o.vx)<=40 && okO('prep1')){
    /* un rato después del combo, quieto, se queda EN GUARDIA con el puñal: dice que
       el golpe está listo sin un cartel */
    img=pickO('prep'+(1+Math.floor(o.animT*7)%5),'prep1');
  }
  else if(o.duck && okO('dk1')){
    /* AGACHADO: hoja propia de 9 cuadros (1-5 levanta y sopla · 6-9 apunta y sopla).
       Es más bajo que de pie, así que va con su propia altura y ancla. */
    H=P.duckH; ax=P.duckAx;
    if(o.hurtT>0) img=OPT.dk1;
    else if(o.charging){
      const seq=['dk2','dk3','dk4','dk6','dk7','dk8'];
      const k=Math.min(seq.length-1,Math.floor(o.charge*seq.length));
      img=pickO(seq[k],'dk4','dk1');
    }
    else if(o.dartCd>.38) img=pickO('dk9','dk5','dk1');
    else if(o.dartCd>0)   img=pickO('dk8','dk4','dk1');
    else img=OPT.dk1;
  }
  else if(o.hurtT>0 && okO('hurt')) img=OPT.hurt;
  else if(vertical && okO(hojaV+'1')){
    /* hojas de 18: 2-4 sube y apunta (según la carga) · 5-12 sopla, sale el dardo,
       remata y baja (repartidos en el medio segundo de recarga) */
    let f;
    if(o.charging) f = o.charge<.25? 2 : o.charge<.6? 3 : 4;
    else f = Math.min(12, 5+Math.floor((1-Math.max(0,o.dartCd)/.5)*8));
    img = OPT[hojaV+f] && okO(hojaV+f)? OPT[hojaV+f] : OPT[hojaV+'1'];
  }
  else if(shooting && okO('sh1')){
    if(o.charging) img=OPT.sh1;                                  // la lleva a la boca
    else if(o.dartCd>.38 && okO('sh2')) img=OPT.sh2;             // el soplido
    else img=okO('sh3')?OPT.sh3:OPT.sh1;                         // la baja
  }
  else if(shooting){ img=ART.hatk; H=P.sprH*0.96; ax=P.atkAx; }
  else if(o.inAir){
    if(o.vy<0 && okO('jump')) img=OPT.jump;
    else if(o.vy>=0 && okO('fall')) img=OPT.fall;
    else img=okO('jump')?OPT.jump:ART.hw2;
  }
  else if(Math.abs(o.vx)>40){
    const fast=Math.abs(o.vx)>P.spd*0.72;
    if(fast && RUN_N>=4){ const i=Math.floor(o.run*P.cyc*(RUN_N/4))%RUN_N; img=OPT['run'+(i+1)]; }
    else if(WALK_N>=4){ const i=Math.floor(o.run*P.cyc*(WALK_N/4))%WALK_N; img=OPT['wn'+(i+1)]; }
    else if(RUN_N>=4){ const i=Math.floor(o.run*P.cyc*(RUN_N/4))%RUN_N; img=OPT['run'+(i+1)]; }
    else { const i=Math.floor(o.run*P.cyc)%4; img=ART['hw'+(i+1)]; }
  }
  else if((o.aim==='arriba'||o.aim==='abajo') && okO((o.aim==='arriba'?'up':'dn')+'13')){
    /* quieto y apuntando: reposo mirando arriba/abajo (13-18). Así el jugador ve que
       el joystick o la tecla ya cambiaron la dirección ANTES de disparar */
    const h=o.aim==='arriba'?'up':'dn';
    img = OPT[h+(13+Math.floor(o.animT*5)%6)];
  }
  else img = okO('idle2')? OPT.idle2 : ART.hidle;

  cx.save();
  if(o.web>0){                          // el capullo se balancea, no corre ni rebota
    cx.rotate(Math.sin(o.webF)*.05);
    cx.translate(Math.sin(o.webF*2.1)*(o.webLucha?2.2:.8),0);
  }
  else if(!o.inAir && Math.abs(o.vx)>40 && o.hurtT<=0 && !o.golpe){
    const ph=o.run*P.cyc*Math.PI;
    cx.translate(0,-Math.abs(Math.sin(ph))*P.sprBob);
    cx.rotate(Math.sin(ph*2)*P.sprTilt);
  }
  if(o.hurtT>0 && !okO('hurt') && !o.web) cx.rotate(-(o.hurtT/.35)*.45);
  if(o.dartCd>.35 && !o.charging && o.shotAim==='frente') cx.translate(-3,0);   // retroceso sólo al frente
  if(o.charging && o.charge>=1) cx.translate((Math.random()-.5)*1.6,0);
  if(ok(img)) drawAnchored(img,H,ax);
  cx.restore();
}
/* estela del puñal: trazo de tinta con filo de hueso (como las de velocidad del
   jefe), sólo mientras el filo corta. La estocada es recta; los cortes, arcos. */
function drawTajo(o,cam){
  const G=GOLPES[o.golpe-1], p=o.golpeT/G.dur;
  if(p<G.act[0]-.05 || p>G.act[1]+.15) return;
  const k=Math.max(0,Math.min(1,(p-G.act[0])/(G.act[1]-G.act[0])));
  cx.save(); cx.translate(o.x-cam,o.y); cx.scale(o.face,1);
  cx.lineCap='round'; cx.globalAlpha=.85*(1-Math.max(0,p-G.act[1])/.15);
  [[INK,4],[BONE,1.8]].forEach(([col,w])=>{ cx.strokeStyle=col; cx.lineWidth=w;
    cx.beginPath();
    if(o.golpe===1){ const y=-70; cx.moveTo(30+40*k,y); cx.lineTo(G.alc-4,y);
                     cx.moveTo(40+40*k,y-9); cx.lineTo(G.alc-22,y-7); }
    else if(o.golpe===2){ cx.ellipse(18,-66,G.alc-18,24,0,-.9+.3*k,.55+.5*k); }
    else { cx.ellipse(26,-78,48,56,0,.9,.9-(.5+1.5*k),true); }       // de abajo hacia arriba
    cx.stroke(); });
  cx.restore();
}
/* títere de papel: sólo si el arte no cargó, para que el juego nunca quede vacío */
function puppet(o){
  const SKIN='#c9a163', runP=Math.sin(o.run*P.freq);
  cx.lineWidth=4; cx.strokeStyle=INK; cx.lineJoin='round'; cx.lineCap='round';
  const legA=o.inAir? .5 : runP*P.lamp;
  cx.beginPath(); cx.moveTo(0,-44); cx.lineTo(10*Math.sin(legA)+2,-22); cx.lineTo(14*Math.sin(legA)+4,0); cx.stroke();
  cx.beginPath(); cx.moveTo(0,-44); cx.lineTo(-10*Math.sin(legA)+2,-22); cx.lineTo(-14*Math.sin(legA)+4,0); cx.stroke();
  cx.fillStyle=SKIN;
  cx.beginPath(); cx.moveTo(-7,-44); cx.quadraticCurveTo(-9,-72,-4,-86);
  cx.lineTo(8,-86); cx.quadraticCurveTo(11,-64,8,-44); cx.closePath(); cx.fill(); cx.stroke();
  cx.fillStyle=RED; cx.fillRect(-11,-52,22,12); cx.strokeRect(-11,-52,22,12);
  cx.fillStyle=BONE; cx.beginPath();
  cx.moveTo(-6,-40); cx.lineTo(6,-40); cx.lineTo(3,-26); cx.lineTo(-3,-26); cx.closePath(); cx.fill(); cx.stroke();
  cx.beginPath(); cx.moveTo(0,-78); cx.lineTo(-12,-66); cx.lineTo(-8,-54); cx.stroke();
  cx.beginPath(); cx.moveTo(2,-76); cx.lineTo(16,-66); cx.lineTo(24,-58); cx.stroke();
  cx.strokeStyle=GOLD; cx.lineWidth=5;
  if(o.charging||o.dartCd>.3) line(20,-58,64,-58); else line(18,-64,44,-30);
  cx.strokeStyle=INK; cx.lineWidth=4;
  cx.fillStyle=SKIN; cx.beginPath(); cx.arc(4,-98,13,0,7); cx.fill(); cx.stroke();
  cx.fillStyle=INK; cx.beginPath();cx.arc(9,-100,2,0,7);cx.fill();
  cx.fillStyle=RED;
  for(let i=0;i<3;i++){ cx.beginPath(); cx.moveTo(-2+i*5,-108);
    cx.quadraticCurveTo(i*5,-128-i*4,6+i*5,-110); cx.closePath(); cx.fill(); cx.stroke(); }
  cx.fillStyle=GOLDS; cx.beginPath();cx.arc(0,-112,5,0,7);cx.fill();cx.stroke();
}
function drawChar(o,cam){
  cx.save(); cx.translate(o.x-cam,o.y);
  if(t.muerto) cx.globalAlpha=Math.max(0,1-t.muerteT*.7);
  else if(t.inv>0 && Math.floor(t.inv*12)%2===0) cx.globalAlpha=.45;
  if(!o.inAir){ cx.save(); cx.globalAlpha=cx.globalAlpha*.18; cx.fillStyle=INK;
    cx.beginPath(); cx.ellipse(0,3,24,5.5,0,0,7); cx.fill(); cx.restore(); }
  cx.scale(o.face,1);
  if(t.muerto) cx.rotate(-Math.min(1.4,t.muerteT*1.6));
  cx.rotate(o.inAir||o.golpe? 0 : (o.vx*o.face)/P.spd*.1);  // inclinación al correr
  const sq=1-o.squash*1.4+o.stretch*.9; cx.scale(2-sq,sq); // squash & stretch
  if(artOk()) drawSprite(o); else puppet(o);
  cx.restore();
  if(o.golpe>0 && !t.muerto) drawTajo(o,cam);
  if(t.web>0 && !t.muerto && okO('red1')){  // hilos de anclaje: del capullo al suelo
    cx.save(); cx.translate(o.x-cam,o.y);
    cx.globalAlpha=Math.min(1,t.web*1.6)*.5;
    cx.strokeStyle=BONE; cx.lineCap='round';
    /* seda floja: cada hilo cuelga con su panza y se estira cuando forcejea */
    const tir=Math.sin(t.webF)*(t.webLucha?4:1.4);
    for(let i=0;i<4;i++){
      const lx=(i-1.5)*29, sx=(i-1.5)*9+tir*.6, sy=-84+Math.abs(i-1.5)*14,
            panza=10-Math.abs(tir)*1.2;                 // al tirar se tensa
      cx.lineWidth=i===1||i===2? 1.8 : 1.3;
      cx.beginPath(); cx.moveTo(sx,sy);
      cx.bezierCurveTo(sx+(lx-sx)*.2, sy*.45, (lx+sx)/2+panza*Math.sign(lx||1), -14, lx, -1);
      cx.stroke();
      cx.beginPath(); cx.arc(lx,-1,1.7,0,7); cx.fillStyle=BONE; cx.fill();
    }
    cx.restore();
  }
  else if(t.web>0 && !t.muerto){            // respaldo si la hoja no cargó
    cx.save(); cx.translate(o.x-cam,o.y);
    const j=Math.sin(simT*40)*1.6;          // tirones del forcejeo
    cx.translate(j,0);
    cx.globalAlpha=Math.min(1,t.web*1.6)*.9;
    cx.strokeStyle=BONE; cx.lineWidth=2.2; cx.lineCap='round';
    const cyw=-56, R=50;
    for(let i=0;i<10;i++){ const a=i*Math.PI/5;                 // hilos en todas direcciones
      line(Math.cos(a)*R,cyw+Math.sin(a)*R*.86,Math.cos(a)*-R,cyw-Math.sin(a)*R*.86); }
    cx.lineWidth=1.7;
    for(let r=16;r<=R;r+=12){ cx.beginPath(); cx.ellipse(0,cyw,r,r*.86,0,0,7); cx.stroke(); }
    cx.fillStyle='rgba(233,223,196,.18)'; cx.beginPath(); cx.ellipse(0,cyw,R,R*.86,0,0,7); cx.fill();
    cx.restore();
  }
}

/* ================= EFECTOS ================= */
function drawFx(cam){
  parts.forEach(p=>{
    cx.save(); cx.translate(p.x-cam,p.y); cx.rotate(p.rot);
    cx.globalAlpha=Math.min(.8,Math.max(0,p.life*2));
    cx.strokeStyle=INK; cx.lineWidth=1.6; cx.lineCap='round';
    cx.beginPath(); cx.arc(0,0,p.r,0,4.6); cx.stroke();
    cx.beginPath(); cx.arc(p.r*.25,-p.r*.2,p.r*.45,2.4,6.9); cx.stroke();
    cx.restore();
  });
  cx.globalAlpha=1;
  // telarañas en vuelo: bola de hilos que gira
  telas.forEach(w=>{
    const px=w.x-cam; if(px<-40||px>CVW+40) return;
    cx.save(); cx.translate(px,w.y); cx.rotate(w.rot);
    cx.globalAlpha=Math.min(1,w.life*2);
    cx.strokeStyle=BONE; cx.lineWidth=2.2; cx.lineCap='round';
    for(let i=0;i<6;i++){ const a=i*Math.PI/3; line(Math.cos(a)*11,Math.sin(a)*11,Math.cos(a)*-11,Math.sin(a)*-11); }
    cx.lineWidth=1.6;
    for(let r=5;r<=11;r+=3){ cx.beginPath(); cx.arc(0,0,r,0,7); cx.stroke(); }
    cx.fillStyle='rgba(233,223,196,.55)'; cx.beginPath(); cx.arc(0,0,4,0,7); cx.fill();
    cx.restore();
  });
  darts.forEach(d=>{
    const ang=Math.atan2(d.vy||0, d.vx);           // el dardo apunta a donde vuela
    const c=d.carga||0;
    if(c>.5){                                       // estela de oro: el soplo cargado
      const L=30+60*c, ux=Math.cos(ang), uy=Math.sin(ang);
      cx.save(); cx.lineCap='round'; cx.globalAlpha=.35+.4*c;
      cx.strokeStyle=INK; cx.lineWidth=2+3*c; line(d.x-cam,d.y,d.x-cam-ux*L,d.y-uy*L);
      cx.strokeStyle=GOLDS; cx.lineWidth=1+2*c; line(d.x-cam,d.y,d.x-cam-ux*L*.8,d.y-uy*L*.8);
      cx.restore();
    }
    if(okO('dart')){ const im=OPT.dart, H=6*(1+.6*c), W=im.width/im.height*H;
      cx.save(); cx.translate(d.x-cam,d.y); cx.rotate(ang);
      cx.drawImage(im,-W/2,-H/2,W,H); cx.restore();
    } else { cx.strokeStyle=GOLD; cx.lineWidth=3;
      line(d.x-cam,d.y,d.x-cam-Math.cos(ang)*14,d.y-Math.sin(ang)*14); }
  });
}

/* ================= HUD ================= */
function cuentaJade(x,y,lleno,r){
  cx.beginPath(); cx.arc(x,y,r||8,0,7);
  cx.fillStyle=lleno?JADE:'rgba(42,28,16,.25)'; cx.fill();
  cx.strokeStyle=INK; cx.lineWidth=2; cx.stroke();
  if(lleno){ cx.beginPath(); cx.arc(x-2.5,y-2.5,2,0,7); cx.fillStyle='rgba(255,255,255,.45)'; cx.fill(); }
}
function drawHUD(){
  // — vida: retrato + cuentas de jade —
  cx.save();
  cx.fillStyle='rgba(244,235,208,.72)'; cx.strokeStyle=INK; cx.lineWidth=2.5;
  cx.fillRect(18,16,190,50); cx.strokeRect(18,16,190,50);
  if(okO('face')){ const im=OPT.face, H=42, W=im.width/im.height*H;
    cx.save(); cx.beginPath(); cx.rect(22,20,42,42); cx.clip();
    cx.drawImage(im,22+(42-W)/2,20,W,H); cx.restore();
    cx.strokeRect(22,20,42,42); }
  for(let i=0;i<VIDA_MAX;i++) cuentaJade(84+i*27,41,i<t.hp);
  cx.restore();

  // — avance por la selva —
  const prog=enArena? 1 : Math.max(0,Math.min(1,(t.x-300)/(GATE_X-300)));
  cx.save();
  cx.fillStyle='rgba(42,28,16,.30)'; cx.fillRect(232,36,300,4);
  cx.fillStyle=GOLDS; cx.fillRect(232,36,300*prog,4);
  /* la primera casa de enigmas, marcada en el camino hasta que se resuelve */
  if(casaLlama() && !enArena){
    const hx=232+300*Math.max(0,Math.min(1,(CASA.x-300)/(GATE_X-300)));
    cx.fillStyle=BONE; cx.strokeStyle=INK; cx.lineWidth=1.5;
    cx.beginPath(); cx.moveTo(hx,27); cx.lineTo(hx+7,38); cx.lineTo(hx,49); cx.lineTo(hx-7,38); cx.closePath();
    cx.fill(); cx.stroke();
    cx.fillStyle=GOLD; cx.font='700 11px Georgia'; cx.textAlign='center'; cx.fillText('?',hx,42);
  }
  cx.fillStyle=RED; cx.beginPath(); cx.arc(232+300*prog,38,4.5,0,7); cx.fill();
  cx.strokeStyle=INK; cx.lineWidth=1.5; cx.stroke();
  cx.restore();

  // — barra del jefe —
  if(boss && boss.active && !boss.dead){
    cx.textAlign='center'; cx.font='700 16px Georgia';
    inkText(tr('VUCUB CAQUIX · EL FALSO SOL'), CVW/2, 34, RED);
    cx.fillStyle='rgba(244,235,208,.9)'; cx.fillRect(CVW/2-222,42,444,13);
    cx.fillStyle='rgba(42,28,16,.45)'; cx.fillRect(CVW/2-220,44,440,9);
    cx.fillStyle=RED; cx.fillRect(CVW/2-220,44,440*Math.max(0,boss.hp/boss.maxhp),9);
    cx.strokeStyle=INK; cx.lineWidth=2; cx.strokeRect(CVW/2-220,44,440,9);
    line(CVW/2,40,CVW/2,57);                    // media luz: ahí entra en furia
  }
  // — aviso —
  if(notice.t>0){
    cx.textAlign='center'; cx.font='700 20px Georgia';
    cx.globalAlpha=Math.min(1,notice.t*1.6);
    inkText(notice.txt, CVW/2, 108, INK); cx.globalAlpha=1;
  }
  // — carga de la cerbatana —
  if(t.charging){
    const px=t.x-camX();
    cx.fillStyle='rgba(244,235,208,.9)'; cx.fillRect(px-28,t.y-124,56,11);
    cx.strokeStyle=INK; cx.lineWidth=3; cx.strokeRect(px-26,t.y-122,52,7);
    cx.fillStyle=t.charge>=1?RED:GOLD; cx.fillRect(px-24,t.y-120,48*t.charge,3);
  }
  cx.textAlign='left'; cx.font='11px Georgia';
  cx.fillStyle='rgba(42,28,16,.42)'; if(!TOUCH) cx.fillText(tr('ESC · pausa'), 20, CVH-14);
}

const menu={items:[],sel:0,rects:[],title:'',sub:''};
function menuSet(title,sub,items){ menu.title=title; menu.sub=sub; menu.items=items; menu.sel=0; menu.rects=[]; }
function drawPanelFondo(alpha){
  cx.fillStyle='rgba(13,9,5,'+(alpha==null?.82:alpha)+')'; cx.fillRect(0,0,CVW,CVH);
}
function drawMenu(y0){
  cx.textAlign='center';
  menu.rects=[];
  menu.items.forEach((it,i)=>{
    const y=y0+i*46, sel=i===menu.sel;

      cx.fillStyle='rgba(230,205,139,.10)'; cx.fillRect(CVW/2-w/2,y-27,w,40);

      cx.fillStyle=RED; cx.font='700 20px Georgia';

      cx.font='700 25px Georgia';

    cx.fillStyle=sel?'#f4e8cc':'#c9b282';
    cx.fillText(label,CVW/2,y);
  });
}
function menuMove(d){ if(!menu.items.length) return;
  menu.sel=(menu.sel+d+menu.items.length)%menu.items.length; SFX.pagina(); }
function menuPick(){ const it=menu.items[menu.sel]; if(it&&it.go){ SFX.fogata(); it.go(); } }
function menuTap(fx,fy){
  const x=fx*CVW, y=fy*CVH;
  for(let i=0;i<menu.rects.length;i++){
    const r=menu.rects[i];
    if(x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h){ menu.sel=i; menuPick(); return true; }
  }
  return false;
}

function drawFondoLamina(im,alpha){

     anterior seguía viéndose por debajo (la portada se transparentaba sobre la
     hoja de controles). */
  cx.fillStyle='#0d0905'; cx.fillRect(0,0,CVW,CVH);
  if(ok(im)){
    const a=im.naturalWidth/im.naturalHeight, ca=CVW/CVH;
    let w,h; if(a>ca){ h=CVH; w=h*a; } else { w=CVW; h=w/a; }
    cx.save(); cx.globalAlpha=alpha==null?.35:alpha;
    cx.drawImage(im,(CVW-w)/2,(CVH-h)/2,w,h); cx.restore();
  }
  const g=cx.createRadialGradient(CVW/2,CVH*.42,120,CVW/2,CVH*.42,CVW*.75);
  g.addColorStop(0,'rgba(13,9,5,.35)'); g.addColorStop(1,'rgba(13,9,5,.92)');
  cx.fillStyle=g; cx.fillRect(0,0,CVW,CVH);
}

  'El ESQUELETO embiste desde lejos: no retrocedas, sáltalo.',
  'El TECOLOTE llama guardianes y se lanza en picado a donde vas: da la vuelta para esquivarlo.',
  'El PUÑAL encadena tres golpes; su tajo corta telarañas y plumas en el aire.',
  'Los BRASEROS DE COPAL curan y son el sitio donde vuelves si caes.',
  'A Vucub Caquix se le embosca cuando BAJA a comer al suelo: ahí parpadea «¡ahora!».',

/* ================= TRANSICIONES ================= */
function empezarPartida(){
  VIDA_MAX=VIDA_BASE; poderes.jade=false; sala.resuelto=false; sala.intentos=0;
  t.web=0; telas.length=0; avisoTela=false; casaVista=false; casaAtras=false; avisoPedernal=false;
  golpeCorta(); t.golpeN=0;
  evento('partida_iniciada', {tactil: TOUCH, idioma: LANG});
  t.x=400; t.y=GROUND; t.vx=0; t.vy=0; t.face=1; t.onGround=true;
  t.hp=VIDA_MAX; t.inv=1; t.hurtT=0; t.charging=false; t.charge=0; t.dartCd=0;
  t.muerto=false; t.muerteT=0; t.run=0; t.jumpsLeft=P.jmax; t.duck=false;
  checkpoint=400; HOGUERAS.forEach(h=>h.on=false);
  gate={open:false,near:false,flash:0,t:0}; enArena=false; volverA=0;
  pistaI=0; pistaT=0; slowmo=1; paused=false; notice={txt:'',t:0};
  shake.t=0; shake.mag=0; hitStop=0;
  spawnFoes();
  SCREEN='juego'; musPlay('juego');
}
function irPausa(){
  SCREEN='pausa';
  menuSet('','',[
    {label:'Continuar',                go:()=>{ SCREEN='juego'; }},
    {label:'Controles',                go:()=>{ volverDe='pausa'; SCREEN='controles'; }},
    {label:'Volver al último brasero', go:()=>revive()},
    {label:etiquetaMusica, go:()=>{ SND.on=!SND.on; sndSave(); musRefresh(); }},
    {label:etiquetaIdioma, go:cambiaIdioma},
    {label:'Salir a la portada',       go:()=>irPortada()},
  ]);
}
function irMuerte(){
  evento('muerte', {contra_el_jefe: !!(boss&&boss.active),
                    avance_pct: Math.round(Math.max(0,Math.min(1,(t.x-300)/(GATE_X-300)))*100)});
  SCREEN='muerte';
  menuSet('','',[
    {label:'Volver al brasero de copal', go:()=>revive()},
    {label:'Salir a la portada',         go:()=>irPortada()},
  ]);
}
function irFinal(){
  SCREEN='final'; musPlay('intro'); SFX.triunfo();
  menuSet('','',[
    {label:'Jugar de nuevo',       go:()=>empezarPartida()},
    {label:'Ver la apertura',      go:()=>cineStart('apertura')},
    {label:'Volver a la portada',  go:()=>irPortada()},
  ]);
}

/* ================= ACTUALIZACIÓN DEL JUEGO ================= */
function updJuego(raw){
  notice.t=Math.max(0,notice.t-raw);
  if(shake.t>0){ shake.t-=raw; shake.mag*=Math.pow(0.015,raw); if(shake.t<=0) shake.mag=0; }
  if(hitStop>0){ hitStop-=raw; return; }        // micro-pausa de impacto: nada se mueve
  const dt=raw*slowmo;
  if(t.muerto){
    t.muerteT+=raw;
    phys(dt); if(enArena) updBoss(dt); else updFoes(dt); updProyectiles(dt);
    if(t.muerteT>1.5) irMuerte();
    return;
  }
  control(dt); phys(dt);
  if(enArena) updBoss(dt); else { updFoes(dt); updGate(dt); updHogueras(); updCasa(); updPistas(raw); }
  updProyectiles(dt);
  /* vencido el falso sol se deja ver la caída y arranca la cinemática del brazo */
  if(boss && boss.dead && boss.deadT>3.4) cineStart('brazo');
}

function drawJuego(){
  const cam=camX();
  const s = shake.t>0? shake.mag : 0;
  cx.save();
  if(s) cx.translate((Math.random()-.5)*2*s,(Math.random()-.5)*2*s);
  drawWorld(cam);
  if(!enArena) drawFoes(cam);
  if(enArena) drawBoss(cam);
  drawChar(snap(),cam);
  drawFx(cam);      // dardos y volutas SOBRE los personajes
  drawCamino(cam);  // el claro del sendero va delante de los personajes
  if(!enArena) drawCasaAviso(cam);
  cx.restore();
  drawHUD();
}

/* ================= ENTRADA POR PANTALLA ================= */
let audioUnlocked=false;
function unlockAudio(){ if(audioUnlocked) return; audioUnlocked=true; ac(); musRefresh(); }
function onKey(code){
  unlockAudio();
  if(code==='KeyM'){ SND.on=!SND.on; sndSave(); musRefresh(); say(SND.on?'música: sí':'música: no',1.2); return; }
  if(code==='KeyF'){ toggleFull(); return; }
  switch(SCREEN){
    case 'cine':
      if(code==='Space'||code==='Enter'||code==='ArrowRight'||code==='KeyD') cineNext();
      else if(code==='ArrowLeft'||code==='KeyA'||code==='Backspace') cinePrev();
      else if(code==='Escape') cineEnd();
      break;
    case 'controles':
      if(code==='Escape'||code==='Enter'||code==='Space'||code==='Backspace') SCREEN=volverDe;
      break;
    case 'juego':
      if(code==='Escape') irPausa();
      else if(code==='KeyE'||code==='Enter'){ if(!entrarSala()) entrarArena(); }
      break;
    case 'sala':
      if(code==='Escape'){ salirSala(); break; }
      if(salaMenuVisible() && menu.items.length>1){
        if(['ArrowLeft','ArrowUp','KeyA','KeyW'].includes(code)){ menuMove(-1); break; }
        if(['ArrowRight','ArrowDown','KeyD','KeyS'].includes(code)){ menuMove(1); break; }
      }
      if(['Enter','Space','KeyE','KeyK','KeyX'].includes(code)){
        if(salaMenuVisible()) menuPick(); else salaAvanza();
      }
      break;
    case 'portada': case 'pausa': case 'muerte': case 'final':
      if(code==='ArrowUp'||code==='KeyW') menuMove(-1);
      else if(code==='ArrowDown'||code==='KeyS') menuMove(1);
      else if(code==='Enter'||code==='Space') menuPick();
      else if(code==='Escape'&&SCREEN==='pausa') SCREEN='juego';
      break;
  }
}
function onTap(fx,fy){
  unlockAudio();
  switch(SCREEN){
    case 'cine':   (fx<.25)? cinePrev() : cineNext(); break;
    case 'controles': SCREEN=volverDe; break;
    case 'juego':
      // tocar la pantalla entra en la casa o cruza la niebla, según dónde estés
      if(!entrarSala()) entrarArena();
      break;
    case 'sala': {
      const x=fx*CVW, y=fy*CVH, r=salaSalirRect;
      if(x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h){ salirSala(); break; }
      if(salaMenuVisible()) menuTap(fx,fy); else salaAvanza();
      break; }
    case 'portada': case 'pausa': case 'muerte': case 'final': menuTap(fx,fy); break;
  }
}

/* ================= BUCLE ================= */
let last=0;
function frame(now){
  requestAnimationFrame(frame);
  /* base del fotograma: coordenadas lógicas 1280×720 sobre el búfer real.
     Se reponen cada cuadro porque cambiar cv.width borra el estado del contexto. */
  cx.setTransform(SCALE,0,0,SCALE,0,0);
  cx.imageSmoothingEnabled=true; cx.imageSmoothingQuality='high';
  /* El delta se recorta por arriba (un tirón largo no debe teletransportar a nadie)
     y por abajo a cero: un reloj que va hacia atrás hacía que el tiempo de las
     cinemáticas y de la simulación retrocediera. */
  const raw=Math.min(.05,Math.max(0,(now-last)/1000))||0; last=now;
  simT+=raw;
  document.body.classList.toggle('playing', SCREEN==='juego');

  if(SCREEN==='cine'){ cineTick(raw); if(cine.on){ drawCine(); return; } }
  switch(SCREEN){
    case 'carga':     cx.fillStyle='#0d0905'; cx.fillRect(0,0,CVW,CVH); break;
    case 'portada':   drawPortada(); break;
    case 'controles': drawControles(); break;
    case 'juego':     updJuego(raw); drawJuego(); break;
    case 'pausa':     drawJuego(); drawPausa(); break;
    case 'muerte':    drawJuego(); drawMuerte(); break;
    case 'final':     drawFinal(); break;
    case 'sala':      sala.t+=raw; drawSala(); break;
    default:          cx.fillStyle='#0d0905'; cx.fillRect(0,0,CVW,CVH);
  }
}
requestAnimationFrame(frame);

/* En local: lista en la consola los textos que aún no tienen versión inglesa.
   Recorre los datos (relatos, casa, pistas, mandos) y cada llamada a tr() o say() con texto fijo. */
function revisaTraducciones(){
  const todos=new Set();
  const mete=v=>{ if(typeof v==='string') todos.add(v); else if(Array.isArray(v)) v.forEach(mete); };
  [APERTURA,BRAZO,CIERRE].forEach(seq=>seq.forEach(p=>{ mete(p.n); mete(p.q); mete(p.w); }));
  Object.values(SALA_TEXTO).forEach(v=>{ if(typeof v!=='number') mete(v); });
  PISTAS.forEach(p=>{ mete(p.txt); mete(p.tap); });
  CONTROLES_TECLADO.concat(CONTROLES_TACTIL).forEach(mete); CONSEJOS.forEach(mete);
  const src=[...document.scripts].map(s=>s.textContent).join('\n');
  for(const m of src.matchAll(/(?:tr|say)\('((?:[^'\\]|\\.)*)'/g)) todos.add(m[1].replace(/\\'/g,"'"));
  for(const m of src.matchAll(/label:'((?:[^'\\]|\\.)*)'/g)) todos.add(m[1]);
  const faltan=[...todos].filter(s=>s && !s.includes('(?:') && !/^[\d\s.,?]+$/.test(s) && EN[s]==null);
  if(faltan.length) console.warn('[en] '+faltan.length+' textos sin traducir:\n'+faltan.join('\n'));
  else console.info('[en] todos los textos tienen traducción');
  return faltan;
}
if(VERSION==='dev') setTimeout(revisaTraducciones,0);

/* ================= ARRANQUE ================= */
const T0=Date.now();
(function boot(){
  const listo = assetsTotal>0 && assetsDone>=assetsTotal;
  if(listo || Date.now()-T0>20000){
    countFrames();
    loadEls.box.classList.add('gone');
    setTimeout(()=>{ loadEls.box.style.display='none'; },800);
    irPortada();
    return;
  }
  setTimeout(boot,120);
})();
