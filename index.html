function fitCanvas(){
  const r=cv.getBoundingClientRect();
  if(!r.width||!r.height) return;
  const dpr=Math.min(devicePixelRatio||1,2);
  const s=Math.max(1, Math.min(r.width/CVW, r.height/CVH)*dpr);
  const w=Math.round(CVW*s), h=Math.round(CVH*s);
  if(cv.width!==w||cv.height!==h){ cv.width=w; cv.height=h; }
  SCALE=w/CVW;
}

/* Dibuja un cuadro anclado por su CONTENIDO, no por su lienzo. */
function drawAnchored(img,h,ax,mid){
  const an=img.an, k=an? h/an.ref : h/img.naturalHeight;
  const W=img.naturalWidth*k, H=img.naturalHeight*k;
  cx.drawImage(img, -(ax!=null?ax:(an?an.ax:.5))*W, -(mid?.5:(an?an.by:1))*H, W, H);
}

   Pages) y al comprimir. Por eso `_empaquetar.py` sustituye ESTE BLOQUE ENTERO por
   otro con nombres sin acentos ni espacios y las láminas grandes en JPEG.

function assetSettled(){
  assetsDone++;
  const p=assetsTotal? assetsDone/assetsTotal : 1;
  loadEls.bar.style.width=(p*100).toFixed(1)+'%';
  loadEls.pct.textContent=Math.round(p*100)+' %';
}
function loadImg(f,onFail,dir,ext){
  dir=(dir===undefined||dir===null)?DIR:dir; ext=ext||'.png';
  assetsTotal++;
  const im=new Image();
  im.an=ANCHOR[f]||null;
  im.decoding='async';
  let settled=false;
  const done=()=>{ if(!settled){ settled=true; assetSettled(); } };
  im.onload=done;
  /* macOS guarda los acentos en forma NFD: si la primera petición falla se
     reintenta con esa forma antes de darla por perdida. */
  im.onerror=()=>{ if(!im.retried){ im.retried=true; im.src=encodeURI((dir+f+ext).normalize('NFD')); }
                   else { done(); if(onFail) onFail(); } };
  im.src=encodeURI(dir+f+ext);
  return im;
}

/* ================================================================
   SONIDO
   · Música: los dos temas del proyecto, con fundido cruzado.
   · Efectos: sintetizados con WebAudio (no hay archivos de efectos y
     así el juego pesa lo mismo). Todo son soplos, maderas y piedras,
     nada electrónico, para no romper el mundo de códice.
   ================================================================ */
const MUS_SRC=RUTAS.musica;
const SND={ on:true, mus:0.55, sfx:0.55 };
try{ const s=localStorage.getItem('pv_snd'); if(s) Object.assign(SND,JSON.parse(s)); }catch(e){}
function sndSave(){ try{ localStorage.setItem('pv_snd',JSON.stringify(SND)); }catch(e){} }

const MUS={}, musState={cur:null, fades:{}};
function mkMus(key){
  const a=new Audio(); a.loop=true; a.volume=0; a.preload='auto';
  let retried=false;
  a.addEventListener('error',()=>{ if(!retried){ retried=true; a.src=encodeURI(MUS_SRC[key].normalize('NFD')); } });
  a.src=encodeURI(MUS_SRC[key]);
  MUS[key]=a; return a;
}
Object.keys(MUS_SRC).forEach(mkMus);
function musFade(key,target,ms){
  const a=MUS[key]; if(!a) return;
  clearInterval(musState.fades[key]);
  const step=40, n=Math.max(1,Math.round((ms||900)/step)), d=(target-a.volume)/n;
  musState.fades[key]=setInterval(()=>{
    const v=a.volume+d;
    if((d>=0&&v>=target)||(d<0&&v<=target)){ a.volume=Math.max(0,Math.min(1,target));
      clearInterval(musState.fades[key]); if(target<=0) a.pause(); return; }
    a.volume=Math.max(0,Math.min(1,v));
  },step);
}
/* Cambia de tema con fundido cruzado. key=null apaga toda la música. */
function musPlay(key,ms){
  if(musState.cur===key) { if(key&&SND.on) MUS[key].play().catch(()=>{}); return; }
  const prev=musState.cur; musState.cur=key;
  if(prev) musFade(prev,0,ms||1200);
  if(!key||!SND.on) return;
  const a=MUS[key];
  a.play().then(()=>musFade(key,SND.mus,ms||1400)).catch(()=>{});
}
function musRefresh(){                      // tras cambiar volumen o silenciar
  Object.keys(MUS).forEach(k=>{
    if(k===musState.cur && SND.on){ MUS[k].play().catch(()=>{}); musFade(k,SND.mus,250); }
    else musFade(k,0,250);
  });
}

/* ---------- efectos sintetizados ---------- */
let AC=null;
function ac(){
  if(!AC){ const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; AC=new C(); }
  if(AC.state==='suspended') AC.resume().catch(()=>{});
  return AC;
}
let noiseBuf=null;
function noise(a){
  if(!noiseBuf){ noiseBuf=a.createBuffer(1,a.sampleRate*1.2,a.sampleRate);
    const d=noiseBuf.getChannelData(0);
    for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; }
  const s=a.createBufferSource(); s.buffer=noiseBuf; s.loop=true; return s;
}
/* tono: forma de onda con caída exponencial y barrido opcional de altura */
function tone(o){
  const a=ac(); if(!a||!SND.on||SND.sfx<=0) return;
  const t0=a.currentTime+(o.delay||0);
  const osc=a.createOscillator(), g=a.createGain();
  osc.type=o.type||'sine';
  osc.frequency.setValueAtTime(o.f0,t0);
  if(o.f1) osc.frequency.exponentialRampToValueAtTime(Math.max(20,o.f1),t0+o.d);
  const vol=(o.v==null?.3:o.v)*SND.sfx;
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.exponentialRampToValueAtTime(vol,t0+(o.atk||0.008));
  g.gain.exponentialRampToValueAtTime(0.0001,t0+o.d);
  let node=osc;
  if(o.filt){ const f=a.createBiquadFilter(); f.type='lowpass'; f.frequency.value=o.filt; node.connect(f); node=f; }
  node.connect(g); g.connect(a.destination);
  osc.start(t0); osc.stop(t0+o.d+0.05);
}
/* soplo: ruido filtrado — pasos, viento, cerbatana, tierra */
function puff(o){
  const a=ac(); if(!a||!SND.on||SND.sfx<=0) return;
  const t0=a.currentTime+(o.delay||0);
  const s=noise(a), f=a.createBiquadFilter(), g=a.createGain();
  f.type=o.type||'bandpass'; f.Q.value=o.q==null?1.2:o.q;
  f.frequency.setValueAtTime(o.f0,t0);
  if(o.f1) f.frequency.exponentialRampToValueAtTime(Math.max(40,o.f1),t0+o.d);
  const vol=(o.v==null?.25:o.v)*SND.sfx;
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.exponentialRampToValueAtTime(vol,t0+(o.atk||0.006));
  g.gain.exponentialRampToValueAtTime(0.0001,t0+o.d);
  s.connect(f); f.connect(g); g.connect(a.destination);
  s.start(t0); s.stop(t0+o.d+0.05);
}

/* ================= VUCUB CAQUIX ================= */
const BOSSX=7060, CANOPY_Y=215, BOSS_H=170;
const HOVER_Y=GROUND-230, DIVE_V=520, DIVE_FLOOR=GROUND-50;
const ARENA_L=6180, ARENA_R=LEVEL-110;
function spawnBoss(){
  boss={x:BOSSX,y:CANOPY_Y,vx:0,vy:0,face:-1,hp:300,maxhp:300,
        state:'canopy',t:0,st:0,wt:3.2,active:false,hitCd:0,next:'dive',armCine:false,
        dead:false,deadT:0,tx:0,ty:0,gustN:0,rugidoT:0};
  feathers.length=0;
}
function bossGo(state,wt){ boss.state=state; boss.st=0; if(wt!==undefined) boss.wt=wt; }
function bossGrounded(){ return boss.state==='eat'||boss.state==='stun'||boss.dead; }
function bossBox(){
  return bossGrounded()? {cy:GROUND-72, hw:84, hh:76}
                       : {cy:boss.y,    hw:88, hh:80};
}

function updBoss(dt){
  if(!boss) return;
  boss.t+=dt; boss.st+=dt; boss.hitCd=Math.max(0,boss.hitCd-dt);
  if(boss.dead){ boss.deadT+=dt;
    if(boss.y<GROUND) boss.y=Math.min(GROUND,boss.y+300*dt);
    return; }
  const d=t.x-boss.x;
  switch(boss.state){
    case 'canopy':                       // arriba, comiendo nances (invulnerable)
      boss.x=BOSSX+Math.sin(boss.t*.8)*14; boss.y=CANOPY_Y+Math.sin(boss.t*1.7)*8;
      boss.face=-1; boss.wt-=dt;
      if(boss.wt<=0) bossGo('descend');
      break;
    case 'descend':
      boss.y+=(GROUND-boss.y)*2.2*dt; boss.x+=(BOSSX-50-boss.x)*2*dt;
      if(GROUND-boss.y<10){ boss.y=GROUND; bossGo('eat',3.6);
        /* el aviso sólo dentro del claro: el ciclo del jefe corre desde el
           principio del nivel y si no, el cartel saltaba en plena selva */
        if(!boss.active && t.x>GATE_X) say('come en el suelo: ¡dispárale AHORA con la cerbatana!',3); }
      break;
    case 'eat':                          // en el suelo: LA ventana de emboscada
      boss.face=Math.sign(d)||-1; boss.wt-=dt;
      if(boss.wt<=0) bossGo('ascend');
      break;
    case 'ascend':
      boss.y+=(CANOPY_Y-boss.y)*2*dt; boss.x+=(BOSSX-boss.x)*2*dt;
      if(boss.y-CANOPY_Y<10) bossGo('canopy',3.2);
      break;
    case 'rise':
      boss.y+=(HOVER_Y-boss.y)*2.5*dt;
      if(Math.abs(boss.y-HOVER_Y)<12) bossGo('hover',1.5);
      break;
    case 'hover': {
      const hx=Math.max(ARENA_L,Math.min(ARENA_R, t.x+(d>0?-230:230)));
      boss.x+=(hx-boss.x)*1.6*dt;
      boss.y+=(HOVER_Y+Math.sin(boss.t*2)*14-boss.y)*2.2*dt;
      boss.face=Math.sign(t.x-boss.x)||boss.face; boss.wt-=dt;
      if(boss.wt<=0){
        if(boss.next==='dive'){ bossGo('aim',.55); boss.tx=t.x; boss.next='gust'; SFX.grito(); }
        else { bossGo('gust',.9); boss.gustN=0; boss.next='dive'; }
      }
      break; }
    case 'aim':
      boss.face=Math.sign(boss.tx-boss.x)||boss.face; boss.wt-=dt;
      if(boss.wt<=0){
        /* Se apunta al SUELO bajo el jugador, nunca al jugador en el aire: así el
           picado siempre baja y siempre acaba estrellándose, que es la ventana de daño. */
        const dx=Math.max(ARENA_L,Math.min(ARENA_R,boss.tx))-boss.x,
              dy=Math.max(120,(GROUND-24)-boss.y), m=Math.hypot(dx,dy)||1;
        boss.vx=dx/m*DIVE_V; boss.vy=dy/m*DIVE_V; bossGo('dive');
      }
      break;
    case 'dive':
      boss.x+=boss.vx*dt; boss.y+=boss.vy*dt; boss.face=Math.sign(boss.vx)||boss.face;
      if(t.inv<=0 && Math.abs(boss.x-t.x)<54 && Math.abs(boss.y-(t.y-46))<54) hurt(boss.x);
      if(boss.y>=DIVE_FLOOR){                    // estrellado: se gana la ventana
        boss.y=GROUND; bossGo('stun',1.5); burst(boss.x,GROUND,PAPER2,10);
        SFX.choque(); sacude(16,.45);
      } else if(boss.st>2.4 || boss.x<=ARENA_L || boss.x>=ARENA_R){
        bossGo('rise');                          // red de seguridad: nunca se pierde
      }
      break;
    case 'stun':
      boss.wt-=dt;
      if(boss.wt<=0) bossGo('rise');
      break;
    case 'gust':                                 // ráfaga de plumas
      boss.face=Math.sign(t.x-boss.x)||boss.face; boss.wt-=dt;
      if(boss.gustN<3 && boss.wt<.9-.22*(boss.gustN+1)){
        boss.gustN++;
        const dx=t.x-boss.x, dy=(t.y-50)-boss.y, m=Math.hypot(dx,dy)||1;
        feathers.push({x:boss.x,y:boss.y,vx:dx/m*430,vy:dy/m*430,life:2.2});
        SFX.clavo();
      }
      if(boss.wt<=0) bossGo('hover',1.5);
      break;
  }
  // cinturón y tirantes: pase lo que pase, el jefe vive dentro del claro
  boss.x=Math.max(ARENA_L,Math.min(ARENA_R,boss.x));
  boss.y=Math.max(90,Math.min(GROUND,boss.y));
  feathers.forEach(f=>{ f.x+=f.vx*dt; f.y+=f.vy*dt; f.life-=dt;
    if(t.inv<=0 && f.life>0 && Math.abs(f.x-t.x)<30 && Math.abs(f.y-(t.y-50))<40){ hurt(f.x); f.life=0; } });
  for(let i=feathers.length-1;i>=0;i--) if(feathers[i].life<=0) feathers.splice(i,1);
}

function bossDartHit(dd){
  if(!boss||boss.dead||dd.life<=0) return;
  const B=bossBox();
  if(Math.abs(dd.x-boss.x)>B.hw || Math.abs(dd.y-B.cy)>B.hh) return;
  dd.life=0;
  const vuln = boss.state==='eat'||boss.state==='stun';
  if(!boss.active){
    if(vuln){ boss.active=true; boss.hp-=60; boss.hitCd=.25; bossGo('rise');
      t.hp=VIDA_MAX;                       // la pelea empieza con las cuentas llenas
      say('¡EMBOSCADA! El falso sol chilla de rabia',3);
      burst(boss.x,B.cy,RED,16); SFX.jefe(); sacude(14,.5); congela(.09);
    } else { burst(dd.x,dd.y,PAPER2,3); SFX.rebote(); }
    return;
  }
  boss.hp-= vuln? 26 : 9;
  boss.hitCd=.15; burst(dd.x,dd.y,RED,5); SFX.jefeHit();
  if(vuln){ sacude(7,.2); congela(.05); }
  if(boss.hp<=0){ boss.hp=0; boss.dead=true; boss.deadT=0; feathers.length=0;
    burst(boss.x,B.cy,GOLDS,34); burst(boss.x,B.cy,RED,18);
    SFX.jefe(); SFX.triunfo(); sacude(20,.9); congela(.14);
    say('☀ EL FALSO SOL HA CAÍDO',4); return; }
  /* A media vida se dispara la cinemática del brazo: es el punto del Popol Vuh en
     que Junajpú se lanza a sujetarlo y el falso sol se lo lleva de un tirón. */
  if(!boss.armCine && boss.hp<=boss.maxhp*0.5){ boss.armCine=true; cineStart('brazo'); }
}

/* ============ NIEBLA DE COPAL (puerta del claro del jefe) ============
   Separa la selva del territorio de Vucub Caquix: los bichos no la cruzan,
   Junajpú sí, y al pasarla se anuncia el sitio. */
const GATE_X=ARENA_L, GATE_STOP=GATE_X-26;
let gate={open:false, near:false, flash:0, t:0};
function updGate(dt){
  gate.t+=dt;
  gate.flash=Math.max(0,gate.flash-dt);
  gate.near = !gate.open && t.x>GATE_STOP-120 && t.x<=GATE_STOP+4;
  if(!gate.open && t.x>GATE_STOP){          // la niebla es un muro hasta que se abre
    t.x=GATE_STOP; if(t.vx>0) t.vx=0;
  }
  if(gate.near && ENTER()){
    gate.open=true; gate.flash=2.6; t.inv=Math.max(t.inv,1.2); t.hp=VIDA_MAX;
    checkpoint=GATE_X+120;
    say('EL CLARO DEL NANCE · dominio de Vucub Caquix',3.4);
    burst(GATE_X,GROUND-60,GOLDS,14); SFX.umbral();
  }
}

/* ================= ACTUALIZACIÓN DE ENEMIGOS ================= */
function updFoes(dt){
  const nuevos=[];
  foes.forEach(e=>{
    e.t+=dt; e.hitCd=Math.max(0,e.hitCd-dt);
    if(e.hp<=0){ e.deadT+=dt; return; }
    const d=t.x-e.x, ad=Math.abs(d);
    if(e.kind==='esq'){
      e.atkT=Math.max(0,e.atkT-dt);
      if(e.state==='windup'){ e.wt-=dt;
        if(e.wt<=0){ e.state='stab'; e.wt=.32;
          if(ad<95 && t.onGround) hurt(e.x); } }
      else if(e.state==='stab'){ e.wt-=dt; e.x+=e.face*230*dt;
        if(e.wt<=0){ e.state='chase'; e.atkT=.9; } }
      else if(ad<380){ e.state='chase'; e.face=Math.sign(d)||1;
        if(ad>66) e.x+=e.face*205*dt;
        else if(e.atkT<=0){ e.state='windup'; e.wt=.5; } }
      else { e.state='patrol';
        e.x+=(Math.sin(e.t*.7)>0?60:-60)*dt; e.face=Math.sin(e.t*.7)>0?1:-1;
        e.x=Math.max(e.baseX-130,Math.min(e.baseX+130,e.x)); }
      e.x+=e.vx*dt; e.vx*=.85;
    } else if(e.kind==='ara'){
      /* ARAÑA — duerme colgada del techo, se descuelga por el hilo cuando pasas
         debajo, persigue a ras de suelo y muerde. */
      e.cool=Math.max(0,e.cool-dt);
      if(e.state==='hang'){ e.y=araHangY(e.anchorY); e.face=Math.sign(d)||1;
        if(ad<230 && e.cool<=0){ e.state='drop'; e.wt=0; } }
      else if(e.state==='drop'){ e.y+=430*dt; e.face=Math.sign(d)||1;
        if(e.y>=GROUND){ e.y=GROUND; e.state='chase'; e.wt=0; } }
      else if(e.state==='windup'){ e.wt-=dt; e.face=Math.sign(d)||e.face;
        if(e.wt<=0){ e.state='bite'; e.wt=.3;
          if(ad<105 && t.onGround) hurt(e.x); } }
      else if(e.state==='bite'){ e.wt-=dt; e.x+=e.face*260*dt;
        if(e.wt<=0){ e.state='chase'; e.cool=.75; } }
      else { e.state='chase'; e.face=Math.sign(d)||1;
        if(ad>72) e.x+=e.face*175*dt;
        else if(e.cool<=0){ e.state='windup'; e.wt=.38; }
        if(ad>820) e.x+=(e.baseX-e.x)*.7*dt; }
      e.x+=e.vx*dt; e.vx*=.85;
    } else if(e.kind==='ala'){
      /* ALACRÁN — el escudo de pedernal le cubre el FRENTE y tarda en girar:
         esa demora es la ventana para dispararle por la espalda. */
      e.cool=Math.max(0,e.cool-dt); e.turn=Math.max(0,e.turn-dt);
      e.blockT=Math.max(0,e.blockT-dt);
      const want=Math.sign(d)||e.face;
      if(e.state==='turning'){ e.wt-=dt;
        if(e.wt<=0){ e.face=e.turnTo; e.state='guard'; e.turn=1.0; e.cool=Math.max(e.cool,.25); } }
      else if(want!==e.face && e.turn<=0 && e.state!=='sting'){
        e.state='turning'; e.wt=GIRO_T; e.turnTo=want;
        e.x+=(want>0?-1:1)*6; }
      else if(e.state==='sting'){ e.wt-=dt;
        if(e.wt<=.15 && !e.hitDone){ e.hitDone=true;
          if(ad<170 && Math.sign(d)===e.face) hurt(e.x); }
        if(e.wt<=0){ e.state='guard'; e.cool=1.1; e.hitDone=false; } }
      else if(ad<430){
        if(ad<200 && e.cool<=0 && Math.sign(d)===e.face){ e.state='sting'; e.wt=.72; e.hitDone=false; }
        else { e.state='guard';
          if(ad>150 && Math.sign(d)===e.face) e.x+=e.face*95*dt; } }
      else { e.state='patrol';
        e.x+=(Math.sin(e.t*.55)>0?52:-52)*dt;
        e.x=Math.max(e.baseX-160,Math.min(e.baseX+160,e.x)); }
      e.x+=e.vx*dt; e.vx*=.85;
    } else if(e.kind==='tec'){
      /* TECOLOTE MENSAJERO — no pelea: te delata. Grita, llama a un guardián
         y levanta el vuelo; vuelve a posarse para volver a gritar. */
      e.cool=Math.max(0,e.cool-dt);
      if(e.state==='perch'){ e.y=e.perchY; e.face=Math.sign(d)||1;
        if(ad<440 && e.cool<=0){ e.state='cry'; e.wt=.95; SFX.grito(); } }
      else if(e.state==='cry'){ e.wt-=dt; e.face=Math.sign(d)||e.face;
        if(e.wt<=0){
          if(e.calls<2 && foes.filter(f=>f.summoned&&f.hp>0).length<3){
            e.calls++; const sx=e.x+(Math.sign(d)||1)*260;
            const nf=mkEsq(Math.max(120,Math.min(GATE_X-80,sx)));
            nf.state='chase'; nf.summoned=true; nuevos.push(nf);
            say('¡el tecolote llamó a un guardián!',1.6);
          }
          e.state='fly'; e.wt=0; e.vy=-90;
        } }
      else { e.wt+=dt; e.face=Math.sign(d)||e.face;
        const tx=e.baseX+Math.cos(e.wt*1.3)*220, ty=e.perchY-150+Math.sin(e.wt*2.1)*40;
        e.x+=(tx-e.x)*1.8*dt; e.y+=(ty-e.y)*2.0*dt;
        if(e.wt>4.2 && Math.abs(e.x-e.baseX)<70){ e.state='perch'; e.cool=3.2; } }
    }
  });
  /* los guardianes recién llamados se añaden DESPUÉS del recorrido */
  if(nuevos.length) foes=foes.concat(nuevos);

  /* los bichos comunes NO cruzan la niebla: el claro es sólo del jefe */
  foes.forEach(e=>{ if(e.hp>0 && e.x>GATE_X-46){
    e.x=GATE_X-46; if(e.state==='chase'||e.state==='guard') e.face=-1; } });

  // dardos contra el jefe y contra los enemigos
  darts.forEach(dd=>{
    if(dd.life<=0) return;
    bossDartHit(dd);
    if(dd.life<=0) return;
    foes.forEach(e=>{
      if(e.hp<=0||dd.life<=0) return;
      const B=HITBOX(e);
      if(Math.abs(dd.x-e.x)<B.hw && Math.abs(dd.y-B.cy)<B.hh){
        if(e.kind==='ala' && Math.sign(dd.vx)===-e.face){     // pedernal de frente: rebota
          dd.life=0; e.blockT=.3; burst(dd.x,dd.y,GOLD,5); SFX.rebote();
          say('el pedernal rebota — dispárale por la espalda',1.4);
          return;
        }
        e.hp-=26; e.hitCd=.18; e.vx=Math.sign(dd.vx)*140; dd.life=0;
        burst(dd.x,dd.y,RED,4); SFX.clavo();
        if(e.hp<=0){ burst(e.x,B.cy,GOLDS,12); e.state='dead'; SFX.muere(); congela(.04); }
      }
    });
  });
  foes=foes.filter(e=>e.hp>0 || e.deadT<1.4);
}

/* caja de golpe por especie */
function HITBOX(e){
  if(e.kind==='esq') return {cy:e.y-60,hw:42,hh:58};
  if(e.kind==='ara') return {cy:e.y-EH.ara*.33,hw:52,hh:EH.ara*.34};
  if(e.kind==='ala') return {cy:e.y-EH.ala*.38,hw:62,hh:EH.ala*.38};
  if(e.kind==='tec') return {cy:e.y-EH.tec*.46,hw:40,hh:EH.tec*.46};
  return {cy:e.y-60,hw:42,hh:58};
}

/* ================= DAÑO, MUERTE Y REAPARICIÓN ================= */
function hurt(fromX){
  if(t.inv>0 || t.muerto) return;
  t.inv=.95; t.hurtT=.35; t.hp--;
  if(t.charging){ t.charging=false; slowmo=1; t.charge=0; }
  t.vx=Math.sign(t.x-fromX||-t.face)*220; t.vy=-180; t.onGround=false;
  burst(t.x,t.y-60,RED,10); SFX.golpe(); sacude(9,.28); congela(.06);
  if(t.hp<=0){ t.hp=0; t.muerto=true; t.muerteT=0; SFX.derrota(); }
}
function revive(){
  t.x=checkpoint; t.y=GROUND; t.vx=0; t.vy=0; t.onGround=true; t.face=1;
  t.hp=VIDA_MAX; t.inv=1.6; t.hurtT=0; t.charging=false; t.charge=0; t.dartCd=0;
  t.muerto=false; t.muerteT=0; t.jumpsLeft=P.jmax; slowmo=1; paused=false;
  spawnFoes();
  if(checkpoint>GATE_X){ gate.open=true; say('el falso sol sube al nance… espera a que baje',3); }
  SCREEN='juego';
}

function shootDart(){
  /* de pie la boquilla queda a ~76 % de la altura del sprite; agachado baja a ras
     de suelo — es la única forma de alcanzar a las arañas. */
  const bajo=t.duck;
  darts.push({x:t.x+t.face*(bajo?80:52), y:t.y-(bajo?P.duckDy:76),
              vx:t.face*(880+320*t.charge), life:.9, bajo});
  SFX.soplo();
}

/* ================= CONTROL ================= */
function control(dt){
  const accel=t.onGround?P.accG:P.accA;
  t.duck = DUCK() && t.onGround;
  let intent=0;
  if(!t.charging){ if(L())intent=-1; if(R())intent=1; }
  if(t.duck){ if(intent!==0 && !t.charging) t.face=intent;   // agachado se gira, no avanza
    intent=0; t.vx=0; }
  if(intent!==0){ t.face=intent; t.vx+=intent*accel*dt;
    t.vx=Math.max(-P.spd,Math.min(P.spd,t.vx));
  } else t.vx*= t.onGround? (t.charging?.55:P.fric) : .96;

  // — salto (coyote time + buffer) —
  t.coyote=t.onGround? .1 : Math.max(0,t.coyote-dt);
  t.jbuf=Math.max(0,t.jbuf-dt);
  const wantJump=JUMP();
  if(wantJump && !t.jumpHeld){ t.jbuf=.12; t.jumpHeld=true; }
  if(!wantJump) t.jumpHeld=false;
  if(t.jbuf>0 && !t.charging && !t.duck){
    if(t.coyote>0 || t.jumpsLeft>0){
      const first=t.coyote>0||t.jumpsLeft===P.jmax;
      t.vy = first? -P.jmp : -P.jmp*0.875;
      if(t.coyote<=0) t.jumpsLeft--; else t.jumpsLeft=P.jmax-1;
      t.onGround=false; t.coyote=0; t.jbuf=0; t.stretch=.05;
      SFX.salto();
    }
  }

  // — cerbatana: mantener para cargar, soltar para soplar —
  t.dartCd-=dt;
  if(SHOOT() && t.dartCd<=0){
    t.charging=true; t.charge=Math.min(1,t.charge+dt/0.8); slowmo=.45;
  } else if(t.charging){
    t.charging=false; slowmo=1; t.dartCd=.5; shootDart(); t.charge=0;
  }
}

function phys(dt){
  let g=P.grav;
  if(t.vy<0 && !JUMP()) g*=2.4;                   // salto variable: soltar lo corta
  t.vy+=g*dt;
  const y0=t.y;
  t.x+=t.vx*dt; t.y+=t.vy*dt;
  t.x=Math.max(30,Math.min(LEVEL-30,t.x));
  const wasAir=!t.onGround, fallV=t.vy;
  if(t.y>=GROUND){ t.y=GROUND; t.vy=0; land(wasAir,fallV); }
  else{
    let landed=false;
    /* Colisión barrida: se comprueba si los pies CRUZARON la losa entre fotogramas,
       para que a velocidad alta no se atraviese. */
    if(t.vy>=0) platforms.forEach(p=>{
      if(t.x>p.x-10&&t.x<p.x+p.w+10 && y0<=p.y+1 && t.y>=p.y){ t.y=p.y; t.vy=0; landed=true; }});
    if(landed) land(wasAir,fallV); else t.onGround=false;
  }
  t.inv=Math.max(0,t.inv-dt); t.hurtT=Math.max(0,t.hurtT-dt);
  t.squash=Math.max(0,t.squash-dt*4); t.stretch=Math.max(0,t.stretch-dt*4);
  t.animT+=dt;
  if(Math.abs(t.vx)>40&&t.onGround){
    const prev=t.run;
    t.run+=dt*Math.abs(t.vx)/40;
    if(Math.floor(prev*P.freq/Math.PI)!==Math.floor(t.run*P.freq/Math.PI)){
      burst(t.x-t.face*10,t.y-2,PAPER2,2); SFX.paso();
    }
  }
  darts.forEach(d=>{d.x+=d.vx*dt; d.life-=dt;});
  for(let i=darts.length-1;i>=0;i--) if(darts[i].life<=0) darts.splice(i,1);
  parts.forEach(p=>{p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=800*dt; p.life-=dt; p.rot+=p.spin*dt;});
  for(let i=parts.length-1;i>=0;i--) if(parts[i].life<=0) parts.splice(i,1);
}
function land(wasAir,fallV){
  if(wasAir){
    t.jumpsLeft=P.jmax;
    t.squash=Math.min(.10,fallV/9000);
    if(fallV>300){ burst(t.x,t.y-2,PAPER2,6); SFX.caer(); }
  }
  t.onGround=true;
}
function burst(x,y,col,n){ for(let i=0;i<n;i++) parts.push({x,y,
  vx:(Math.random()-.5)*220, vy:-Math.random()*200, col, life:.4+Math.random()*.3,
  rot:Math.random()*6.28, spin:(Math.random()-.5)*6, r:2.5+Math.random()*2.5}); }

/* braseros de copal: curan y fijan dónde revives */
function updHogueras(){
  HOGUERAS.forEach(h=>{
    if(!h.on && Math.abs(t.x-h.x)<70 && t.onGround){
      h.on=true; checkpoint=h.x; t.hp=VIDA_MAX;
      say('brasero de copal encendido · aquí volverás',2.4);
      burst(h.x,GROUND-40,GOLDS,12); SFX.fogata();

  });
}

/* ================= TRAZOS DE CÓDICE (utilidades de dibujo) ================= */
function line(a,b,c,d){ cx.beginPath(); cx.moveTo(a,b); cx.lineTo(c,d); cx.stroke(); }
const hsh=(k,n)=>{ const v=Math.sin(k*127.1+n*311.7)*43758.5453; return v-Math.floor(v); };
const hash=i=>{ const s=Math.sin(i*127.1)*43758.545; return s-Math.floor(s); };
function voluta(x,y,r,rot,col,w,a){
  cx.save(); cx.translate(x,y); cx.rotate(rot); cx.globalAlpha=a;
  cx.strokeStyle=col; cx.lineWidth=w; cx.lineCap='round';
  cx.beginPath(); cx.arc(0,0,r,0.5,4.2); cx.stroke();
  cx.beginPath(); cx.arc(0,0,r*.5,0.9,4.6); cx.stroke();
  cx.restore();
}
function pluma(x,y,L,rot,col,a){
  cx.save(); cx.translate(x,y); cx.rotate(rot); cx.globalAlpha=a;
  cx.fillStyle=col; cx.strokeStyle=INK; cx.lineWidth=1.2;
  cx.beginPath(); cx.moveTo(0,-L/2);
  cx.quadraticCurveTo(L*.30,0, 0,L/2);
  cx.quadraticCurveTo(-L*.30,0, 0,-L/2);
  cx.fill(); cx.stroke();
  cx.beginPath(); cx.moveTo(0,-L/2); cx.lineTo(0,L/2); cx.globalAlpha=a*.6; cx.stroke();
  cx.restore();
}
/* Texto sobre la escenografía. Los biomas son oscuros y abigarrados: la tinta sola
   daba 1.66:1 de contraste y los avisos eran invisibles. Con halo de papel se lee
   siempre y sigue pareciendo un glifo de códice. */
function inkText(txt,x,y,fill,halo,w){
  cx.save();
  cx.lineJoin='round'; cx.miterLimit=2;
  cx.strokeStyle=halo||'rgba(244,235,208,.94)'; cx.lineWidth=w||4;
  cx.strokeText(txt,x,y);
  cx.fillStyle=fill; cx.fillText(txt,x,y);
  cx.restore();
}
function wrap(txt,maxw){
  const out=[]; let ln='';
  txt.split(' ').forEach(w=>{ const p2=ln?ln+' '+w:w;
    if(cx.measureText(p2).width>maxw && ln){ out.push(ln); ln=w; } else ln=p2; });
  if(ln) out.push(ln); return out;
}

const CINE_DUR=7.6;
const BOX_ANCHO={x:50,y:14,w:1180,h:506};      // láminas 16:9 (brazo)
const BOX_ALTO ={x:50,y:10,w:1180,h:512};      // láminas de códice (4:3)
let cine={on:false,seq:BRAZO,box:BOX_ANCHO,i:0,t:0,prev:-1,fade:0,motivo:'repaso'};
function cineStart(motivo){
  const seq = motivo==='apertura'? APERTURA : motivo==='final'? CIERRE : BRAZO;
  const box = motivo==='apertura'||motivo==='final'? BOX_ALTO : BOX_ANCHO;
  cine={on:true,seq,box,i:0,t:0,prev:-1,fade:0,motivo:motivo||'repaso'};
  SCREEN='cine'; SFX.pagina();
}
function cineEnd(){
  cine.on=false;
  const m=cine.motivo;
  slowmo=1;
  if(m==='apertura'){ empezarPartida(); }
  else if(m==='final'){ irFinal(); }
  else if(m==='derrota'){ revive(); }
  else if(m==='brazo'){
    // la pelea continúa: sólo se recoloca a Junajpú y se le da un respiro
    SCREEN='juego';
    t.hurtT=0; t.vx=0; t.vy=0; t.inv=1.8; t.charging=false; t.charge=0; t.hp=VIDA_MAX;
    if(boss && !boss.dead){ bossGo('rise'); boss.hitCd=.4; }
    say('¡te arrancó el brazo! — acaba con él',3.6);
  }
  else SCREEN='juego';
}
function cineGo(d){
  const j=cine.i+d;
  if(j<0){ cine.t=0; return; }
  if(j>=cine.seq.length){ cineEnd(); return; }
  cine.prev=cine.i; cine.i=j; cine.t=0; cine.fade=.5; SFX.pagina();
}
const cineNext=()=>cineGo(1), cinePrev=()=>cineGo(-1);
function cineTick(dt){
  if(cine.fade>0) cine.fade=Math.max(0,cine.fade-dt);
  cine.t+=dt;
  const dur=cine.seq[cine.i].dur||CINE_DUR;
  if(cine.t>=dur) cineNext();
}

/* --- dibujo del panel --- */
function cineFit(im,B){                    // la lámina completa: el marco es parte del arte
  const a=im.naturalWidth/im.naturalHeight;
  const h=Math.min(B.h,B.w/a), w=h*a;
  return {x:B.x+(B.w-w)/2, y:B.y+(B.h-h)/2, w, h};
}
function cineShake(p,tt){
  if(!p.fx||!p.fx.includes('golpe')) return {x:0,y:0};
  const d=Math.max(0,1-tt/.55); if(d<=0) return {x:0,y:0};
  return {x:Math.sin(tt*46)*13*d*d, y:Math.cos(tt*39)*9*d*d};
}
function cinePlate(idx,tt,alpha,openY){
  const p=cine.seq[idx], B=cine.box, im=p.im? p.im():null;
  if(!ok(im)){ cinePlaceholder(p,B,alpha); return null; }
  const r=cineFit(im,B), kb=p.kb||[.05,.3,0], pr=Math.min(1,tt/(CINE_DUR+2));
  const ease=pr*pr*(3-2*pr), s=1+kb[0]*ease;
  const W=r.w*s, H=r.h*s, ox=(W-r.w)*(.5-kb[1]*.5*ease), oy=(H-r.h)*(.5-kb[2]*.5*ease);
  const sh=cineShake(p,tt);
  cx.save(); cx.globalAlpha=alpha; cx.translate(sh.x,sh.y);
  if(openY<1){ cx.translate(r.x+r.w/2, r.y+r.h/2); cx.scale(1,openY); cx.translate(-r.x-r.w/2,-r.y-r.h/2); }
  cx.beginPath(); cx.rect(r.x,r.y,r.w,r.h); cx.clip();
  cx.drawImage(im, r.x-ox, r.y-oy, W, H);
  cineFx(p,tt,r);
  cx.restore();
  if(openY>=1){                       // sólo cuando el panel ya está desplegado
    cx.save(); cx.globalAlpha=alpha*.8; cx.strokeStyle='rgba(122,90,30,.85)'; cx.lineWidth=3;
    cx.strokeRect(r.x-1.5,r.y-1.5,r.w+3,r.h+3); cx.restore();
  }
  return r;
}
function cinePlaceholder(p,B,alpha){

/* --- efectos: TODO como trazo de tinta o glifo (regla de estilo del códice) --- */
function cineFx(p,tt,r){
  if(!p.fx) return; const F=p.fx;
  if(F.includes('motes'))
    for(let k=0;k<26;k++){
      const sx=r.x+hsh(k,1)*r.w, sp=.05+hsh(k,2)*.06;
      const y=r.y+r.h-((tt*sp*r.h+hsh(k,3)*r.h)%r.h), s=2+hsh(k,4)*3.5;
      cx.save(); cx.translate(sx+Math.sin(tt*.9+k)*9,y); cx.rotate(Math.PI/4);
      cx.globalAlpha=.30+.25*Math.sin(tt*2+k); cx.fillStyle=GOLDS;
      cx.fillRect(-s/2,-s/2,s,s); cx.restore();
    }
  if(F.includes('hojas'))
    for(let k=0;k<9;k++){
      const x=r.x+r.w*(.08+hsh(k,5)*.86), y=r.y+r.h*(.1+hsh(k,6)*.8);
      voluta(x+Math.sin(tt*.7+k*1.3)*14, y+Math.cos(tt*.5+k)*7,
             9+hsh(k,7)*7, tt*.25+k, JADE, 2, .16+.08*Math.sin(tt+k));
    }
  if(F.includes('plumas'))
    for(let k=0;k<8;k++){
      const t2=(tt*.30+hsh(k,8))%1;
      const x=r.x+r.w*(.18+hsh(k,9)*.72)+Math.sin(tt*1.5+k*2)*26;
      const y=r.y+r.h*(.10+t2*.86);
      pluma(x,y,14+hsh(k,10)*10, Math.sin(tt*1.6+k)*.9+k,
            hsh(k,11)>.55?RED:GOLDS, Math.min(1,t2*4)*(1-t2*.5)*.6);
    }
  if(F.includes('tintaroja'))
    for(let k=0;k<7;k++){
      const g=Math.min(1,tt/.9), x=r.x+r.w*.5+(hsh(k,12)-.5)*r.w*.30;
      const y=r.y+r.h*.42+(hsh(k,13)-.5)*r.h*.30+g*24;
      voluta(x,y,(7+hsh(k,14)*13)*(.4+g), tt*.6+k*1.7, RED, 3, .5*(1-g*.55));
    }
  if(F.includes('caida'))
    for(let k=0;k<14;k++){
      const x=r.x+r.w*(.12+hsh(k,15)*.78), L=40+hsh(k,16)*90;
      const y=r.y+((tt*680+hsh(k,17)*r.h*2)%(r.h+L))-L;
      cx.save(); cx.globalAlpha=.16+.12*hsh(k,18); cx.strokeStyle=INK; cx.lineWidth=2;
      cx.beginPath(); cx.moveTo(x,y); cx.lineTo(x,y+L); cx.stroke(); cx.restore();
    }
  if(F.includes('tension')){
    const g=cx.createRadialGradient(r.x+r.w*.5,r.y+r.h*.5,r.h*.30,
                                    r.x+r.w*.5,r.y+r.h*.5,r.h*(.78-.05*Math.sin(tt*1.6)));
    g.addColorStop(0,'rgba(42,28,16,0)'); g.addColorStop(1,'rgba(42,28,16,.42)');
    cx.save(); cx.fillStyle=g; cx.fillRect(r.x,r.y,r.w,r.h); cx.restore();
  }
  if(F.includes('fuego')){
    const cxx=r.x+r.w*.5, cyy=r.y+r.h*.78, pul=.72+.28*Math.sin(tt*7)+.10*Math.sin(tt*17);
    const g=cx.createRadialGradient(cxx,cyy,4,cxx,cyy,r.h*.55*pul);
    g.addColorStop(0,'rgba(230,160,40,.34)'); g.addColorStop(.5,'rgba(190,90,25,.16)');
    g.addColorStop(1,'rgba(190,90,25,0)');
    cx.save(); cx.globalCompositeOperation='lighter'; cx.fillStyle=g;
    cx.fillRect(r.x,r.y,r.w,r.h); cx.restore();
  }
  if(F.includes('brasas'))
    for(let k=0;k<18;k++){
      const t2=(tt*.42+hsh(k,19))%1;
      const x=r.x+r.w*.5+(hsh(k,20)-.5)*r.w*.14+Math.sin(tt*2.4+k)*11;
      const y=r.y+r.h*.80-t2*r.h*.52, s=1.6+hsh(k,21)*2.4;
      cx.save(); cx.globalAlpha=(1-t2)*.85; cx.fillStyle=k%3?GOLDS:RED;
      cx.beginPath(); cx.arc(x,y,s,0,7); cx.fill(); cx.restore();
    }
  if(F.includes('humo'))
    for(let k=0;k<6;k++){
      const t2=(tt*.16+hsh(k,22))%1;
      voluta(r.x+r.w*.5+(hsh(k,23)-.5)*r.w*.20+Math.sin(tt*.6+k)*16,
             r.y+r.h*.62-t2*r.h*.5, 12+t2*26, tt*.3+k, INK, 2.4, (1-t2)*.22);
    }
}
function cineType(lines,n){                 // revela n caracteres repartidos entre líneas
  let c=n; return lines.map(l=>{ const s=l.slice(0,Math.max(0,c)); c-=l.length; return s; });
}
function drawCine(){
  const p=cine.seq[cine.i], tt=cine.t, B=cine.box;
  cx.fillStyle='#171008'; cx.fillRect(0,0,CVW,CVH);
  const openY=cine.prev<0? Math.min(1,tt/.45)**.6 : 1;
  if(cine.fade>0 && cine.prev>=0)
    cinePlate(cine.prev, (cine.seq[cine.prev].dur||CINE_DUR), 1, 1);
  const r=cinePlate(cine.i, tt, cine.fade>0? 1-cine.fade/.5 : 1, openY)
        || {x:B.x+240,y:B.y,w:B.w-480,h:B.h};
  // hilo de oro: cuánto falta para pasar sola de lámina
  const dur=p.dur||CINE_DUR;
  cx.fillStyle='rgba(122,90,30,.5)'; cx.fillRect(r.x,r.y+r.h+6,r.w,2);
  cx.fillStyle=GOLDS; cx.fillRect(r.x,r.y+r.h+6,r.w*Math.min(1,tt/dur),2);

  const n=Math.max(0,Math.floor((tt-.35)*42));
  cx.textAlign='center';
  const TB=B.y+B.h+26;
  let qh=0;
  if(p.q){
    cx.font='italic 20px Georgia';
    const ql=wrap('«'+p.q+'»',740);
    qh=28+ql.length*24;
    const bw=Math.min(CVW-160,Math.max(...ql.map(l=>cx.measureText(l).width))+280);
    cx.fillStyle=BONE; cx.strokeStyle=INK; cx.lineWidth=3;
    cx.fillRect(CVW/2-bw/2,TB,bw,qh); cx.strokeRect(CVW/2-bw/2,TB,bw,qh);
    cx.fillStyle=RED; cx.font='700 13px Georgia'; cx.fillText(p.w,CVW/2,TB+17);
    cx.fillStyle=INK; cx.font='italic 20px Georgia';
    cineType(ql,n).forEach((l,k)=>cx.fillText(l,CVW/2,TB+40+k*24));
  } else if(p.w){
    cx.fillStyle='rgba(201,168,106,.85)'; cx.font='700 12px Georgia';
    cx.letterSpacing&&(cx.letterSpacing='2px');
    cx.fillText(p.w.toUpperCase(),CVW/2,TB+2); qh=14;
    cx.letterSpacing&&(cx.letterSpacing='0px');
  }
  cx.fillStyle=GOLDS; cx.font=(p.fin?'700 26px':'19px')+' Georgia';
  cineType(wrap(p.n,900), p.q? n-p.q.length-2 : n)
    .forEach((l,k)=>cx.fillText(l, CVW/2, TB+(p.q?qh+30:qh+22)+k*25));
  // cuentas de panel + controles
  const cxx=CVW/2-(cine.seq.length-1)*9;
  for(let k=0;k<cine.seq.length;k++){
    cx.beginPath(); cx.arc(cxx+k*18,CVH-32,k===cine.i?4.5:3,0,7);
    cx.fillStyle=k===cine.i?GOLDS:'rgba(201,168,106,.42)'; cx.fill();
  }
  cx.fillStyle='rgba(201,168,106,.75)'; cx.font='12px Georgia';
  cx.fillText('←  ·  → / ESPACIO  ·  ESC salta la escena   ('+(cine.i+1)+'/'+cine.seq.length+')',
              CVW/2,CVH-11);
}

/* ================= ESCENOGRAFÍA ================= */
/* La cámara se redondea a píxel entero: con posición fraccionaria las láminas se
   remuestreaban distinto cada fotograma y el fondo entero hervía al caminar. */
function camX(){ return Math.round(Math.max(0,Math.min(LEVEL-CVW,t.x-CVW*0.45))); }

/* Bajo la línea de piso las láminas dejan una banda de papel crudo de hasta 7 px:
   se estira la última franja de la propia lámina hasta el borde de la pantalla. */
function drawSkirt(im,x0,w,h){
  if(h>=CVH) return;
  cx.drawImage(im, 0,SH-3, SW,3, x0, h-1, w, CVH-h+1);
}
function drawScenes(cam){
  SCN.forEach((im,i)=>{
    if(!okS(i)) return;
    const s=GROUND/SFLOOR[i], w=SW*s, x0=ZS[i]-cam, h=SH*s;
    if(x0>CVW||x0+w<0) return;
    if(i===0||!okS(i-1)){ cx.drawImage(im,x0,0,w,h); drawSkirt(im,x0,w,h); return; }
    cx.drawImage(im, OV/s,0, SW-OV/s,SH, x0+OV,0, w-OV, h);   // cuerpo opaco
    const N=14, sw=OV/N;                                       // franja de fundido
    for(let k=0;k<N;k++){
      cx.globalAlpha=(k+1)/(N+1);
      cx.drawImage(im, (k*sw)/s,0, sw/s+1,SH, x0+k*sw,0, sw+.8, h);
    }
    cx.globalAlpha=1;
    drawSkirt(im,x0,w,h);
  });
}
function drawProps(cam){
  PROPS.forEach(p=>{
    if(!okP(p.k)) return;
    const im=PR[p.k], px=p.x-cam; if(px<-360||px>CVW+360) return;
    const W=im.width/im.height*p.H;
    cx.drawImage(im,px-W/2,GROUND-p.H,W,p.H);
  });
}
/* braseros de copal: apagados son piedra; encendidos arden y son tu punto de vuelta */
function drawHogueras(cam){

    else { cx.fillStyle=PAPER2; cx.strokeStyle=INK; cx.lineWidth=3;
      cx.fillRect(px-20,GROUND-40,40,40); cx.strokeRect(px-20,GROUND-40,40,40); }
    if(h.on){
      // llama de copal: volutas de oro, no fuego realista

        voluta(px+(hsh(k,72)-.5)*20+Math.sin(simT*2+k)*4, GROUND-H-6-t2*54,
               5+t2*15, simT*.6+k, k%2?GOLDS:RED, 2.6, (1-t2)*.55);

      g.addColorStop(0,'rgba(230,205,139,.9)'); g.addColorStop(1,'rgba(230,205,139,0)');

      cx.font='700 13px Georgia'; cx.textAlign='center';

  });
}
function drawPlatforms(cam){
  platforms.forEach(p=>{
    const px=p.x-cam; if(px+p.w<-260||px>CVW+260)return;
    const art=p.art&&okP(p.art)? p.art : (okP('plataforma')?'plataforma':null);
    /* Sombra bajo la losa: sin ella las piezas se confundían con la arquitectura
       pintada en la lámina y no había forma de saber dónde se podía subir. */
    cx.save(); cx.globalAlpha=.22; cx.fillStyle=INK;
    cx.beginPath(); cx.ellipse(px+p.w/2,p.y+22,p.w*.52,9,0,0,7); cx.fill(); cx.restore();
    if(art==='dintel_mur'){
      const im=PR[art], H=Math.round(p.w*im.height/im.width*.75);
      cx.drawImage(im, px-10, p.y-4, p.w+20, H);
    } else if(art==='plataforma'){
      cx.drawImage(PR.plataforma,px-12,p.y-6,p.w+24,34);

      cx.fillStyle=PAPER2; cx.strokeStyle=INK; cx.lineWidth=3.5;
      cx.fillRect(px,p.y,p.w,14); cx.strokeRect(px,p.y,p.w,14);
      cx.lineWidth=1.5; cx.globalAlpha=.4;
      for(let i=1;i<p.w/26;i++) line(px+i*26,p.y,px+i*26,p.y+14);
      cx.globalAlpha=1;
    }
    // filo de tinta en la cara superior: es LA superficie sobre la que se pisa
    cx.save(); cx.strokeStyle='rgba(42,28,16,.75)'; cx.lineWidth=3; cx.lineCap='round';
    line(px+4,p.y+1,px+p.w-4,p.y+1);
    cx.strokeStyle='rgba(230,205,139,.5)'; cx.lineWidth=1.5;
    line(px+6,p.y-1.5,px+p.w-6,p.y-1.5);
    cx.restore();
  });
}
function drawWorld(cam){
  cx.fillStyle=PAPER; cx.fillRect(0,0,CVW,CVH);
  if(okS(0)){ drawScenes(cam); }
  else {                                   // respaldo si las láminas no cargan
    cx.fillStyle=PAPER2; cx.fillRect(0,GROUND,CVW,CVH-GROUND);
    cx.strokeStyle=INK; cx.lineWidth=4; line(0,GROUND,CVW,GROUND);

}

/* ================= ENEMIGOS (dibujo) ================= */
const TOPY={esq:128,ara:EH.ara*.85,ala:EH.ala*.9,tec:EH.tec+8};
function drawFoes(cam){
  foes.forEach(e=>{
    const px=e.x-cam; if(px<-180||px>CVW+180) return;
    const dying=e.hp<=0;
    // hilo de seda: antes del cuerpo y sin espejar
    if(e.kind==='ara' && !dying && (e.state==='hang'||e.state==='drop')){
      cx.strokeStyle=BONE; cx.lineWidth=2; cx.globalAlpha=.85;
      line(px,e.anchorY,px,e.y-EH.ara*.86); cx.globalAlpha=1;
    }
    cx.save(); cx.translate(px,e.y);
    if(dying && e.kind==='esq'){ cx.globalAlpha=Math.max(0,1-e.deadT); cx.rotate(-1.3*Math.min(1,e.deadT)); }
    else if(dying) cx.globalAlpha=Math.max(0,Math.min(1,(1.35-e.deadT)/.35));
    else if(e.hitCd>0 && Math.floor(e.hitCd*30)%2===0) cx.globalAlpha=.5;
    const enSuelo = e.kind==='esq' || ((e.kind==='ara'||e.kind==='ala') && e.y>=GROUND-1);
    if(enSuelo && !dying){ cx.save(); cx.globalAlpha=.16; cx.fillStyle=INK;
      cx.beginPath(); cx.ellipse(0,3,e.kind==='ala'?40:(e.kind==='ara'?34:22),5,0,0,7); cx.fill(); cx.restore(); }
    cx.scale(e.face,1);
    let img=null, H=112;
    if(e.kind==='esq'){
      if(e.state==='windup') img=FOE.ewind;
      else if(e.state==='stab') img=FOE.eatk;
      else { const i=Math.floor(e.t*(e.state==='chase'?11:5.5))%6; img=FOE['ew'+(i+1)]; }
    } else if(e.kind==='ara'){ H=EH.ara;
      if(dying) img=anim('ara_die',e.deadT,4,true);
      else if(e.hitCd>0) img=anim('ara_hurt',.18-e.hitCd,14,true);
      else if(e.state==='hang') img=anim('ara_hang',e.t,4);
      else if(e.state==='drop') img=anim('ara_drop',e.t,10);
      else if(e.state==='windup') img=anim('ara_bite',(.38-e.wt)/.38*.5,4,true);
      else if(e.state==='bite')   img=anim('ara_bite',.5+(.3-e.wt)/.3*.5,4,true);
      else img=anim('ara_walk',e.t,13);
    } else if(e.kind==='ala'){ H=EH.ala;
      if(dying) img=anim('ala_die',e.deadT,3.6,true);
      else if(e.hitCd>0) img=anim('ala_hurt',.18-e.hitCd,14,true);
      else if(e.state==='sting') img=anim('ala_sting',(.72-e.wt)/.72,5,true);
      else if(e.state==='guard'||e.state==='turning') img=anim('ala_guard',e.t,5);
      else img=anim('ala_walk',e.t,7);
    } else if(e.kind==='tec'){ H=EH.tec;
      if(dying) img=anim('tec_die',e.deadT,3.6,true);
      else if(e.hitCd>0) img=anim('tec_hurt',.18-e.hitCd,14,true);
      else if(e.state==='cry') img=anim('tec_cry',.95-e.wt,5);
      else if(e.state==='perch') img=anim('tec_idle',e.t,3.5);
      else img=anim('tec_fly',e.t,11);
    }
    if(ok(img)) drawAnchored(img,H,null,false);
    else { cx.fillStyle=INK; cx.fillRect(-14,-56,28,56); }
    cx.restore();

    if(!dying && e.kind==='ala' && e.blockT>0){      // chispa de pedernal al rebotar
      cx.save(); cx.globalAlpha=Math.min(1,e.blockT*4); cx.strokeStyle=GOLD; cx.lineWidth=3;
      const sx=px+e.face*46, sy=e.y-EH.ala*.45;
      for(let i=0;i<4;i++){ const a=(i/4)*6.28+e.blockT*8;
        line(sx+Math.cos(a)*7,sy+Math.sin(a)*7,sx+Math.cos(a)*16,sy+Math.sin(a)*16); }
      cx.restore();
    }
    if(!dying && (e.state==='windup'||e.state==='cry'||e.state==='sting')){
      cx.font='700 22px Georgia'; cx.textAlign='center';
      inkText('!',px,e.y-(TOPY[e.kind]||60),RED);
    }
    /* alacrán girándose: la espalda está descubierta — hay que verlo para aprovecharlo */
    if(!dying && e.kind==='ala' && e.state==='turning'){
      cx.font='700 15px Georgia'; cx.textAlign='center';
      cx.save(); cx.globalAlpha=.55+.45*Math.sin(e.wt*20);
      inkText('¡la espalda!',px,e.y-TOPY.ala-6,JADE);
      cx.restore();
      cx.save(); cx.globalAlpha=.8; cx.strokeStyle=JADE; cx.lineWidth=2.5; cx.lineCap='round';
      const gy=e.y-EH.ala*.62, gr=13, a0=e.turnTo>0?3.5:5.9;
      cx.beginPath(); cx.arc(px,gy,gr,a0,a0+2.2); cx.stroke();
      cx.restore();
    }
    if(!dying && e.hp<e.maxhp){
      const by=e.y-(TOPY[e.kind]||60)+6;
      cx.fillStyle='rgba(244,235,208,.85)'; cx.fillRect(px-19,by-1,38,6);
      cx.fillStyle='rgba(42,28,16,.5)'; cx.fillRect(px-18,by,36,4);
      cx.fillStyle=RED; cx.fillRect(px-18,by,36*Math.max(0,e.hp/e.maxhp),4);
    }
  });
}

/* ================= VUCUB CAQUIX (dibujo) ================= */
function drawFeathers(cam){
  feathers.forEach(f=>{
    const px=f.x-cam; if(px<-60||px>CVW+60) return;
    if(okV('projr')){
      cx.save(); cx.translate(px,f.y); cx.rotate(Math.atan2(f.vy,f.vx));
      const im=VC.projr, H=16, W=im.width/im.height*H;
      cx.drawImage(im,-W/2,-H/2,W,H); cx.restore();
    } else { cx.strokeStyle=GOLD; cx.lineWidth=3; line(px,f.y,px-f.vx*.04,f.y-f.vy*.04); }
  });
}
function drawBoss(cam){
  if(!boss) return;
  const px=boss.x-cam; if(px<-260||px>CVW+260){ drawFeathers(cam); return; }
  const st=boss.state, grounded=bossGrounded();
  let img=null, mirror=false, tilt=0;
  /* Los ataques se animan con boss.st (tiempo DENTRO del estado) para que siempre
     arranquen en el cuadro 1. El picado y la ráfaga usan las hojas de vuelo
     horizontal, que sí son un ciclo limpio: las de vc_dive y vc_atk cambian de
     tamaño dentro de la misma hoja y el pájaro parpadeaba y se encogía. */
  if(boss.dead){ const i=Math.min(VC_N.death,1+Math.floor(boss.deadT*5)); img=VC['death'+i]; mirror=boss.face<0; }
  else if(st==='canopy'||st==='eat'){ img=vcF('idle',boss.t,6); mirror=boss.face<0; }
  else if(st==='dive'){
    img=vcF(boss.face>0?'flyr':'flyl',boss.st,14);
    const ang=Math.atan2(boss.vy,boss.vx);
    tilt = boss.face>0? ang : ang-Math.PI;
    tilt = Math.max(-0.9,Math.min(0.9,tilt));
  }
  else if(st==='gust'){ img=vcF('hover',boss.st,14); mirror=boss.face<0; }
  else if(st==='stun'){ img=vcF('hurt',boss.st,5); mirror=boss.face<0; }
  else { img=vcF('hover',boss.t,10); mirror=boss.face<0; }
  cx.save(); cx.translate(px, grounded? GROUND : boss.y);
  if(tilt) cx.rotate(tilt);
  if(boss.hitCd>0 && Math.floor(boss.hitCd*30)%2===0) cx.globalAlpha=.5;
  if(boss.dead) cx.globalAlpha=Math.max(.25,1-boss.deadT*.10);
  if(mirror) cx.scale(-1,1);
  if(ok(img)) drawAnchored(img,BOSS_H,null,!grounded);
  else { cx.fillStyle=RED; cx.beginPath(); cx.ellipse(0,grounded?-60:0,60,40,0,0,7); cx.fill(); }
  cx.restore();
  if(!boss.dead){
    cx.textAlign='center';
    if(st==='aim'){ cx.font='700 30px Georgia'; inkText('!',px,boss.y-104,RED,null,5); }
    if((st==='eat'&&!boss.active)||st==='stun'){
      const pulso=.65+.35*Math.sin(boss.st*9);
      cx.save(); cx.globalAlpha=pulso; cx.font='700 17px Georgia';
      inkText('¡AHORA!',px,(grounded?GROUND-158:boss.y-BOSS_H*.6)-12,RED);
      cx.restore(); }
  }
  drawFeathers(cam);
}

function snap(){ return { x:t.x, y:t.y, face:t.face, run:t.run,
  inAir:!t.onGround, charging:t.charging, charge:t.charge,
  dartCd:t.dartCd, hurtT:t.hurtT, vy:t.vy, duck:t.duck,
  squash:t.squash, stretch:t.stretch, vx:t.vx }; }

/* Selección de cuadro + movimiento procedural sobre el gráfico: rebote y bamboleo
   de zancada, tirón hacia atrás al recibir daño, retroceso al soplar. */
function drawSprite(o){
  const shooting = o.charging || o.dartCd>.3;
  let img, H=P.sprH, ax=null;
  if(o.duck && okO('dk1')){
    /* AGACHADO: hoja propia de 9 cuadros (1-5 levanta y sopla · 6-9 apunta y sopla).
       Es más bajo que de pie, así que va con su propia altura y ancla. */
    H=P.duckH; ax=P.duckAx;
    if(o.hurtT>0) img=OPT.dk1;
    else if(o.charging){
      const seq=['dk2','dk3','dk4','dk6','dk7','dk8'];
      const k=Math.min(seq.length-1,Math.floor(o.charge*seq.length));
      img=pickO(seq[k],'dk4','dk1');
    }
    else if(o.dartCd>.38) img=pickO('dk9','dk5','dk1');
    else if(o.dartCd>0)   img=pickO('dk8','dk4','dk1');
    else img=OPT.dk1;
  }
  else if(o.hurtT>0 && okO('hurt')) img=OPT.hurt;
  else if(shooting && okO('sh1')){
    if(o.charging) img=OPT.sh1;                                  // la lleva a la boca
    else if(o.dartCd>.38 && okO('sh2')) img=OPT.sh2;             // el soplido
    else img=okO('sh3')?OPT.sh3:OPT.sh1;                         // la baja
  }
  else if(shooting){ img=ART.hatk; H=P.sprH*0.96; ax=P.atkAx; }
  else if(o.inAir){
    if(o.vy<0 && okO('jump')) img=OPT.jump;
    else if(o.vy>=0 && okO('fall')) img=OPT.fall;
    else img=okO('jump')?OPT.jump:ART.hw2;
  }
  else if(Math.abs(o.vx)>40){
    const fast=Math.abs(o.vx)>P.spd*0.72;
    if(fast && RUN_N>=4){ const i=Math.floor(o.run*P.cyc*(RUN_N/4))%RUN_N; img=OPT['run'+(i+1)]; }
    else if(WALK_N>=4){ const i=Math.floor(o.run*P.cyc*(WALK_N/4))%WALK_N; img=OPT['wn'+(i+1)]; }
    else if(RUN_N>=4){ const i=Math.floor(o.run*P.cyc*(RUN_N/4))%RUN_N; img=OPT['run'+(i+1)]; }
    else { const i=Math.floor(o.run*P.cyc)%4; img=ART['hw'+(i+1)]; }
  }
  else img = okO('idle2')? OPT.idle2 : ART.hidle;

  cx.save();
  if(!o.inAir && Math.abs(o.vx)>40 && o.hurtT<=0){
    const ph=o.run*P.cyc*Math.PI;
    cx.translate(0,-Math.abs(Math.sin(ph))*P.sprBob);
    cx.rotate(Math.sin(ph*2)*P.sprTilt);
  }
  if(o.hurtT>0 && !okO('hurt')) cx.rotate(-(o.hurtT/.35)*.45);
  if(o.dartCd>.35 && !o.charging) cx.translate(-3,0);
  if(o.charging && o.charge>=1) cx.translate((Math.random()-.5)*1.6,0);
  if(ok(img)) drawAnchored(img,H,ax);
  cx.restore();
}
/* títere de papel: sólo si el arte no cargó, para que el juego nunca quede vacío */
function puppet(o){
  const SKIN='#c9a163', runP=Math.sin(o.run*P.freq);
  cx.lineWidth=4; cx.strokeStyle=INK; cx.lineJoin='round'; cx.lineCap='round';
  const legA=o.inAir? .5 : runP*P.lamp;
  cx.beginPath(); cx.moveTo(0,-44); cx.lineTo(10*Math.sin(legA)+2,-22); cx.lineTo(14*Math.sin(legA)+4,0); cx.stroke();
  cx.beginPath(); cx.moveTo(0,-44); cx.lineTo(-10*Math.sin(legA)+2,-22); cx.lineTo(-14*Math.sin(legA)+4,0); cx.stroke();
  cx.fillStyle=SKIN;
  cx.beginPath(); cx.moveTo(-7,-44); cx.quadraticCurveTo(-9,-72,-4,-86);
  cx.lineTo(8,-86); cx.quadraticCurveTo(11,-64,8,-44); cx.closePath(); cx.fill(); cx.stroke();
  cx.fillStyle=RED; cx.fillRect(-11,-52,22,12); cx.strokeRect(-11,-52,22,12);
  cx.fillStyle=BONE; cx.beginPath();
  cx.moveTo(-6,-40); cx.lineTo(6,-40); cx.lineTo(3,-26); cx.lineTo(-3,-26); cx.closePath(); cx.fill(); cx.stroke();
  cx.beginPath(); cx.moveTo(0,-78); cx.lineTo(-12,-66); cx.lineTo(-8,-54); cx.stroke();
  cx.beginPath(); cx.moveTo(2,-76); cx.lineTo(16,-66); cx.lineTo(24,-58); cx.stroke();
  cx.strokeStyle=GOLD; cx.lineWidth=5;
  if(o.charging||o.dartCd>.3) line(20,-58,64,-58); else line(18,-64,44,-30);
  cx.strokeStyle=INK; cx.lineWidth=4;
  cx.fillStyle=SKIN; cx.beginPath(); cx.arc(4,-98,13,0,7); cx.fill(); cx.stroke();
  cx.fillStyle=INK; cx.beginPath();cx.arc(9,-100,2,0,7);cx.fill();
  cx.fillStyle=RED;
  for(let i=0;i<3;i++){ cx.beginPath(); cx.moveTo(-2+i*5,-108);
    cx.quadraticCurveTo(i*5,-128-i*4,6+i*5,-110); cx.closePath(); cx.fill(); cx.stroke(); }
  cx.fillStyle=GOLDS; cx.beginPath();cx.arc(0,-112,5,0,7);cx.fill();cx.stroke();
}
function drawChar(o,cam){
  cx.save(); cx.translate(o.x-cam,o.y);
  if(t.muerto) cx.globalAlpha=Math.max(0,1-t.muerteT*.7);
  else if(t.inv>0 && Math.floor(t.inv*12)%2===0) cx.globalAlpha=.45;
  if(!o.inAir){ cx.save(); cx.globalAlpha=cx.globalAlpha*.18; cx.fillStyle=INK;
    cx.beginPath(); cx.ellipse(0,3,24,5.5,0,0,7); cx.fill(); cx.restore(); }
  cx.scale(o.face,1);
  if(t.muerto) cx.rotate(-Math.min(1.4,t.muerteT*1.6));
  cx.rotate(o.inAir?0 : (o.vx*o.face)/P.spd*.1);           // inclinación al correr
  const sq=1-o.squash*1.4+o.stretch*.9; cx.scale(2-sq,sq); // squash & stretch
  if(artOk()) drawSprite(o); else puppet(o);
  cx.restore();
}

    cx.strokeStyle=INK; cx.lineWidth=2; cx.strokeRect(CVW/2-220,44,440,9);

}

function menuMove(d){ if(!menu.items.length) return;
  menu.sel=(menu.sel+d+menu.items.length)%menu.items.length; SFX.pagina(); }
function menuPick(){ const it=menu.items[menu.sel]; if(it&&it.go){ SFX.fogata(); it.go(); } }
function menuTap(fx,fy){
  const x=fx*CVW, y=fy*CVH;
  for(let i=0;i<menu.rects.length;i++){
    const r=menu.rects[i];
    if(x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h){ menu.sel=i; menuPick(); return true; }
  }
  return false;
}

  cx.fillStyle='#c9b282'; cx.font='italic 18px Georgia';
  cx.fillText('Primer pasaje del Popol Vuh · demo jugable', CVW/2, 176);
  cx.strokeStyle='rgba(230,205,139,.3)'; cx.lineWidth=1.5; line(CVW/2-220,200,CVW/2+220,200);
  const cr=[['Relato','Popol Vuh · libro del consejo k’iche’'],
            ['Arte, escenografías y música','proyecto Popol Vuh'],
            ['Primer enemigo derrotado','Vucub Caquix, el Siete Guacamayo']];
  cr.forEach((c,i)=>{
    const y=236+i*38;
    cx.textAlign='right'; cx.fillStyle='#8d764a'; cx.font='700 13px Georgia'; cx.fillText(c[0].toUpperCase(), CVW/2-20, y);
    cx.textAlign='left';  cx.fillStyle='#c9b282'; cx.font='17px Georgia';    cx.fillText(c[1], CVW/2+20, y);
  });
  cx.textAlign='center';
  drawMenu(400);
}

/* ================= TRANSICIONES ================= */
function empezarPartida(){
  t.x=400; t.y=GROUND; t.vx=0; t.vy=0; t.face=1; t.onGround=true;
  t.hp=VIDA_MAX; t.inv=1; t.hurtT=0; t.charging=false; t.charge=0; t.dartCd=0;
  t.muerto=false; t.muerteT=0; t.run=0; t.jumpsLeft=P.jmax; t.duck=false;
  checkpoint=400; HOGUERAS.forEach(h=>h.on=false);
  gate={open:false,near:false,flash:0,t:0};
  pistaI=0; pistaT=0; slowmo=1; paused=false; notice={txt:'',t:0};
  shake.t=0; shake.mag=0; hitStop=0;
  spawnFoes();
  SCREEN='juego'; musPlay('juego');
}
function irPausa(){
  SCREEN='pausa';
  menuSet('','',[
    {label:'Continuar',                go:()=>{ SCREEN='juego'; }},
    {label:'Controles',                go:()=>{ volverDe='pausa'; SCREEN='controles'; }},
    {label:'Volver al último brasero', go:()=>revive()},
    {label:()=>'Música: '+(SND.on?'sí':'no'), go:()=>{ SND.on=!SND.on; sndSave(); musRefresh(); }},
    {label:'Salir a la portada',       go:()=>irPortada()},
  ]);
}
function irMuerte(){
  SCREEN='muerte';
  menuSet('','',[
    {label:'Volver al brasero de copal', go:()=>revive()},
    {label:'Salir a la portada',         go:()=>irPortada()},
  ]);
}
function irFinal(){
  SCREEN='final'; musPlay('intro'); SFX.triunfo();
  menuSet('','',[
    {label:'Jugar de nuevo',       go:()=>empezarPartida()},
    {label:'Ver la apertura',      go:()=>cineStart('apertura')},
    {label:'Volver a la portada',  go:()=>irPortada()},
  ]);
}

/* ================= ACTUALIZACIÓN DEL JUEGO ================= */
function updJuego(raw){
  notice.t=Math.max(0,notice.t-raw);
  if(shake.t>0){ shake.t-=raw; shake.mag*=Math.pow(0.015,raw); if(shake.t<=0) shake.mag=0; }
  if(hitStop>0){ hitStop-=raw; return; }        // micro-pausa de impacto: nada se mueve
  const dt=raw*slowmo;
  if(t.muerto){
    t.muerteT+=raw;
    phys(dt); updFoes(dt); updBoss(dt);
    if(t.muerteT>1.5) irMuerte();
    return;
  }
  control(dt); phys(dt); updFoes(dt); updBoss(dt); updGate(dt);
  updHogueras(); updPistas(raw);
  /* el falso sol ha caído: se deja ver la caída y arranca el cierre */
  if(boss && boss.dead && boss.deadT>3.4) cineStart('final');
}

function drawJuego(){
  const cam=camX();
  const s = shake.t>0? shake.mag : 0;
  cx.save();
  if(s) cx.translate((Math.random()-.5)*2*s,(Math.random()-.5)*2*s);
  drawWorld(cam);
  drawFoes(cam);
  drawBoss(cam);
  drawChar(snap(),cam);
  drawFx(cam);      // dardos y volutas SOBRE los personajes
  drawGate(cam);    // la niebla va delante: se entra atravesándola
  cx.restore();
  drawHUD();
  if(TOUCH){        // botón de pausa para dedos
    cx.save(); cx.globalAlpha=.75; cx.fillStyle='rgba(42,28,16,.6)';
    cx.beginPath(); cx.arc(CVW-42,40,22,0,7); cx.fill();
    cx.fillStyle=GOLDS; cx.fillRect(CVW-50,30,6,20); cx.fillRect(CVW-40,30,6,20);
    cx.restore();
  }
}

/* ================= ENTRADA POR PANTALLA ================= */
let audioUnlocked=false;
function unlockAudio(){ if(audioUnlocked) return; audioUnlocked=true; ac(); musRefresh(); }
function onKey(code){
  unlockAudio();
  if(code==='KeyM'){ SND.on=!SND.on; sndSave(); musRefresh(); say(SND.on?'música: sí':'música: no',1.2); return; }
  if(code==='KeyF'){ if(document.fullscreenElement) document.exitFullscreen&&document.exitFullscreen();
                     else document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen().catch(()=>{});
                     return; }
  switch(SCREEN){
    case 'cine':
      if(code==='Space'||code==='Enter'||code==='ArrowRight'||code==='KeyD') cineNext();
      else if(code==='ArrowLeft'||code==='KeyA'||code==='Backspace') cinePrev();
      else if(code==='Escape') cineEnd();
      break;
    case 'controles':
      if(code==='Escape'||code==='Enter'||code==='Space'||code==='Backspace') SCREEN=volverDe;
      break;
    case 'juego':
      if(code==='Escape') irPausa();
      break;
    case 'portada': case 'pausa': case 'muerte': case 'final':
      if(code==='ArrowUp'||code==='KeyW') menuMove(-1);
      else if(code==='ArrowDown'||code==='KeyS') menuMove(1);
      else if(code==='Enter'||code==='Space') menuPick();
      else if(code==='Escape'&&SCREEN==='pausa') SCREEN='juego';
      break;
  }
}
function onTap(fx,fy){
  unlockAudio();
  switch(SCREEN){
    case 'cine':   (fx<.25)? cinePrev() : cineNext(); break;
    case 'controles': SCREEN=volverDe; break;
    case 'juego':
      if(TOUCH && fx>.94 && fy<.13) irPausa();
      break;
    case 'portada': case 'pausa': case 'muerte': case 'final': menuTap(fx,fy); break;
  }
}

/* ================= BUCLE ================= */
let last=0;
function frame(now){
  requestAnimationFrame(frame);
  /* base del fotograma: coordenadas lógicas 1280×720 sobre el búfer real.
     Se reponen cada cuadro porque cambiar cv.width borra el estado del contexto. */
  cx.setTransform(SCALE,0,0,SCALE,0,0);
  cx.imageSmoothingEnabled=true; cx.imageSmoothingQuality='high';
  /* El delta se recorta por arriba (un tirón largo no debe teletransportar a nadie)
     y por abajo a cero: un reloj que va hacia atrás hacía que el tiempo de las
     cinemáticas y de la simulación retrocediera. */
  const raw=Math.min(.05,Math.max(0,(now-last)/1000))||0; last=now;
  simT+=raw;
  document.body.classList.toggle('playing', SCREEN==='juego');

  if(SCREEN==='cine'){ cineTick(raw); if(cine.on){ drawCine(); return; } }
  switch(SCREEN){
    case 'carga':     cx.fillStyle='#0d0905'; cx.fillRect(0,0,CVW,CVH); break;
    case 'portada':   drawPortada(); break;
    case 'controles': drawControles(); break;
    case 'juego':     updJuego(raw); drawJuego(); break;
    case 'pausa':     drawJuego(); drawPausa(); break;
    case 'muerte':    drawJuego(); drawMuerte(); break;
    case 'final':     drawFinal(); break;
    default:          cx.fillStyle='#0d0905'; cx.fillRect(0,0,CVW,CVH);
  }
}
requestAnimationFrame(frame);

/* ================= ARRANQUE ================= */
const T0=Date.now();
(function boot(){
  const listo = assetsTotal>0 && assetsDone>=assetsTotal;
  if(listo || Date.now()-T0>20000){
    countFrames();
    loadEls.box.classList.add('gone');
    setTimeout(()=>{ loadEls.box.style.display='none'; },800);
    irPortada();
    return;
  }
  setTimeout(boot,120);
})();
</script>
